        m.className = 'msg err'; m.textContent = t('toast.error'); CQ.toast(t('toast.error'), 'err');
      } finally { b.disabled = false; b.textContent = t('sc.save'); }
    });

    // ---- BOT CONTROL: autopilot kill switch + per-tenant state -------------------------
    // The switch itself is one `app_settings` blob: {global_disabled, disabled_clients:[id]}.
    // The per-tenant column is read from each tenant's own chat config, so this page shows the
    // two facts an operator needs at 3am — is it allowed to answer, and is it stopped — with no
    // third place to look. N+1 by design: the tenant list is tens of rows, not thousands.
    const KILL = `${API}/admin/chat/kill-switch`;
    let killState = { global_disabled: false, disabled_clients: [] }, killTenants = [];

    async function loadKill() {
      const m = $('killMsg'); m.className = 'msg'; m.textContent = '';
      let ok = true;
      try {
        const r = await fetch(KILL, { headers: hdr() });
        if (!r.ok) throw new Error(r.status === 404 ? t('kill.unavailable') : t('kill.loadfail'));
        const d = await r.json();
        killState = {
          global_disabled: !!(d && d.global_disabled),
          disabled_clients: (d && Array.isArray(d.disabled_clients)) ? d.disabled_clients.map(String) : [],
        };
      } catch (e) { ok = false; m.className = 'msg err'; m.textContent = e.message || t('kill.loadfail'); }
      renderKillGlobal(ok);
      await loadKillTenants();
    }

    function renderKillGlobal(reachable) {
      const p = $('killGlobalPill');
      p.className = 'pill ' + (!reachable ? 'error' : killState.global_disabled ? 'error' : 'ready');
      p.textContent = !reachable ? '—' : killState.global_disabled ? t('kill.global.on') : t('kill.global.off');
      const b = $('killGlobalBtn');
      b.className = killState.global_disabled ? 'primary' : 'danger';
      b.textContent = killState.global_disabled ? t('kill.resume') : t('kill.global');
      b.disabled = !reachable;
    }

    async function loadKillTenants() {
      const box = $('killList');
      const r = await adminFetch(`${API}/admin/tenants`, { headers: hdr() });
      if (!r.ok) { box.innerHTML = `<div class="msg err">${esc(t('kill.overviewfail'))}</div>`; return; }
      const l = await r.json();
      const tenants = Array.isArray(l) ? l : [];
      killTenants = await Promise.all(tenants.map(async x => {
        let on = false, reachable = true;
        try {
          const rr = await adminFetch(`${API}/admin/chat/${x.id}/config`, { headers: hdr() });
          if (rr.ok) { const c = await rr.json(); on = !!(c && c.autopilot_enabled); } else reachable = false;
        } catch { reachable = false; }
        return { id: String(x.id), name: x.name, autopilot: on, reachable };
      }));
      renderKillTenants();
    }

    function killRowState(x) {
      if (!x.autopilot) return { cls: 'notinkb', label: t('kill.state.off') };
      if (killState.global_disabled || killState.disabled_clients.includes(x.id))
        return { cls: 'error', label: t('kill.state.stopped') };
      return { cls: 'ready', label: t('kill.state.live') };
    }

    function renderKillTenants() {
      const box = $('killList');
      if (!killTenants.length) { box.innerHTML = `<div class="empty">—</div>`; return; }
      box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${t('th.name')}</th><th>${t('th.autopilot')}</th><th>${t('th.status')}</th><th></th></tr></thead><tbody>` +
        killTenants.map(x => {
          const st = killRowState(x);
          const stopped = killState.disabled_clients.includes(x.id);
          return `<tr>
            <td>${esc(x.name)}${x.reachable ? '' : ` <span class="hint">${esc(t('kill.overviewfail'))}</span>`}</td>
            <td><span class="pill ${x.autopilot ? 'on' : 'off'}">${x.autopilot ? '●' : '○'}</span></td>
            <td><span class="pill ${st.cls}">${esc(st.label)}</span></td>
            <td class="inline"><button class="${stopped ? 'primary' : 'danger'}" data-kill="${stopped ? 'resume' : 'stop'}" data-id="${esc(x.id)}" data-name="${esc(x.name)}">${stopped ? t('kill.resume') : t('kill.stop')}</button></td>
          </tr>`;
        }).join('') + `</tbody></table></div>`;
      box.querySelectorAll('button[data-kill]').forEach(b => b.addEventListener('click', () => killTenant(b.dataset.kill, b.dataset.id, b.dataset.name)));
    }

    async function putKill(patch) {
      const m = $('killMsg'); m.className = 'msg'; m.textContent = '';
      const r = await fetch(KILL, { method: 'PUT', headers: jhdr(), body: JSON.stringify(patch) });
      if (!r.ok) { m.className = 'msg err';
        m.textContent = r.status === 404 ? t('kill.unavailable') : t('toast.error');
        CQ.toast(m.textContent, 'err'); return false; }
      m.className = 'msg ok'; m.textContent = t('kill.saved'); CQ.toast(t('kill.saved'), 'ok');
      await loadKill(); return true;
    }

    $('reloadKill').addEventListener('click', loadKill);
    $('killGlobalBtn').addEventListener('click', async () => {
      const next = !killState.global_disabled;
      const msg = next ? t('kill.confirm.global') : t('kill.confirm.resume.global');
      if (!(await CQ.confirm(msg, { ok: next ? t('kill.stop') : t('kill.resume'), danger: next }))) return;
      await putKill({ global_disabled: next });
    });

    async function killTenant(act, id, name) {
      const stop = act === 'stop';
      const msg = (stop ? t('kill.confirm.tenant') : t('kill.confirm.resume')).replace('{name}', name || '');
      if (!(await CQ.confirm(msg, { ok: stop ? t('kill.stop') : t('kill.resume'), danger: stop }))) return;
      const set = new Set(killState.disabled_clients);
      stop ? set.add(id) : set.delete(id);
      await putKill({ disabled_clients: [...set] });
    }

    // ---- Chat connections ---------------------------------------------------------------
    // A connection is the credential a chat service authenticates with (X-CQ-Key). It is not
    // a tenant's api_key: one service fronts several workspaces, so the workspace is named per
    // request (X-CQ-Tenant) and checked against the grants managed here — a service can only
    // ever act for a workspace an operator granted it. Keys are stored hashed, so the clear
    // text exists exactly once, in the reveal modal; the table only ever shows key_ids.
    const CRED_URL = `${API}/admin/integrations`;
    const CRED_SCOPES = [['chat:turn', 'cred.scope.turn'], ['chat:suggest', 'cred.scope.suggest'],
                         ['chat:answer', 'cred.scope.answer'], ['chat:sync', 'cred.scope.sync']];
    const CRED_OVERLAP_DAYS = 7;          // how long a rotated-out key keeps working
    let CREDS = [];

    // One error path for every call. The server's own `detail` comes first because it names
    // WHICH grant or name was refused; a bare 404 is explained as "not deployed" rather than
    // as a generic failure, since this console can be newer than the api it talks to. The
    // message goes both into a .msg and a toast: the modal that triggered it may be closing.
    async function credCall(url, init, msgEl, fallbackKey = 'toast.error') {
      const m = msgEl || $('connMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(url, init);
      const d = await r.json().catch(() => ({}));
      if (r.ok) return d ?? {};
      const detail = typeof d.detail === 'string' ? d.detail
        : Array.isArray(d.detail) ? d.detail.map(e => (e && e.msg) || String(e)).join('; ') : '';
      const msg = detail || (r.status === 404 ? t('cred.unavailable') : t(fallbackKey));
      m.className = 'msg err'; m.textContent = msg; CQ.toast(msg, 'err');
      return null;
    }

    async function loadConnections() {
      const d = await credCall(CRED_URL, { headers: hdr() }, null, 'cred.loadfail');
      if (d === null) { CREDS = []; $('connList').innerHTML = ''; return; }
      CREDS = Array.isArray(d.integrations) ? d.integrations : [];
      renderConnections();
    }

    async function credActiveTenants() {
      const r = await adminFetch(`${API}/admin/tenants`, { headers: hdr() });
      const l = r.ok ? await r.json().catch(() => []) : [];
      return (Array.isArray(l) ? l : []).filter(x => x.is_active);
    }
    const credName = x => x.name || x.id;
    const credActiveGrants = x => (x.grants || []).filter(g => g.is_active);
    const credWsLabel = g => g.name || g.slug || g.client_id;

    // A secret has three terminal looks: revoked (deactivated or rotated out and past its
    // overlap), expired, and "still valid until" — the rotated-out key during its overlap,
    // which is the one an operator is actually watching while the chat service switches over.
    function credKeyBlock(s) {
      const exp = s.expires_at ? new Date(s.expires_at) : null;
      const hasExp = exp && !isNaN(exp);
      let pill = '';
      if (s.revoked_at) pill = `<span class="pill off">${esc(t('cred.key.revoked'))}</span>`;
      else if (hasExp && exp.getTime() <= Date.now()) pill = `<span class="pill off">${esc(t('cred.key.expired'))}</span>`;
      else if (hasExp) pill = `<span class="pill pending">${esc(t('cred.key.expires').replace('{when}', () => fmtWhen(s.expires_at)))}</span>`;
      return `<div style="white-space:nowrap"><code>${esc(s.key_id)}</code> ${pill}
        <div class="hint">${esc(t('cred.key.created'))} ${esc(fmtWhen(s.created_at))} · ${esc(t('cred.key.lastused'))} ${s.last_used_at ? esc(fmtWhen(s.last_used_at)) : esc(t('pb.never'))}</div></div>`;
    }

    function renderConnections() {
      const box = $('connList');
      if (!CREDS.length) { box.innerHTML = `<div class="empty">${esc(t('cred.empty'))}</div>`; return; }
      // The × lives INSIDE the chip so it reads as "this workspace, removable" rather than as
      // a row action; the reset makes it a glyph, not a second pill-shaped button.
      const X_STYLE = 'background:none; border:0; padding:0 0 0 6px; margin:0; color:inherit; cursor:pointer; font:inherit; line-height:1';
      box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${t('th.name')}</th><th>${t('th.status')}</th><th>${esc(t('cred.scopes'))}</th><th>${esc(t('cred.workspaces'))}</th><th>${esc(t('cred.keys'))}</th><th></th></tr></thead><tbody>` +
        CREDS.map(x => {
          const off = !x.is_active, id = esc(x.id);
          const chips = credActiveGrants(x).map(g => `<span class="chip" title="${esc((g.scopes || []).join(', '))}">${esc(credWsLabel(g))}${off ? '' :
            `<button data-ungrant="${id}" data-client="${esc(g.client_id)}" title="${esc(t('cred.grant.remove'))}" aria-label="${esc(t('cred.grant.remove'))}" style="${X_STYLE}">×</button>`}</span>`).join('');
          const secrets = (x.secrets || []).map(credKeyBlock).join('');
          return `<tr${off ? ' style="opacity:.5"' : ''}>
            <td><b>${esc(credName(x))}</b><div class="hint"><code>${id}</code></div></td>
            <td><span class="pill ${off ? 'off' : 'on'}">${esc(t(off ? 'cred.state.off' : 'cred.state.on'))}</span></td>
            <td>${(x.scopes || []).map(s => `<span class="chip">${esc(s)}</span>`).join('') || '—'}</td>
            <td>${chips || `<span class="hint">${esc(t('cred.grant.none'))}</span>`}${off ? '' :
              ` <button class="ghost" data-grant="${id}" title="${esc(t('cred.grant.add'))}" aria-label="${esc(t('cred.grant.add'))}" style="padding:3px 10px; margin-top:3px">+</button>`}</td>
            <td>${secrets || `<span class="hint">${esc(t('cred.keys.none'))}</span>`}</td>
            <td class="inline">${off ? '' : `<button class="ghost" data-rotate="${id}">${esc(t('btn.rotate'))}</button><button class="danger" data-deact="${id}">${esc(t('cred.deactivate'))}</button>`}</td>
          </tr>`;
        }).join('') + `</tbody></table></div>`;
      const byId = id => CREDS.find(x => String(x.id) === id);
      box.querySelectorAll('button[data-grant]').forEach(b => b.addEventListener('click', () => credGrantModal(byId(b.dataset.grant))));
      box.querySelectorAll('button[data-ungrant]').forEach(b => b.addEventListener('click', () => credRemoveGrant(byId(b.dataset.ungrant), b.dataset.client)));
      box.querySelectorAll('button[data-rotate]').forEach(b => b.addEventListener('click', () => credRotate(byId(b.dataset.rotate))));
      box.querySelectorAll('button[data-deact]').forEach(b => b.addEventListener('click', () => credDeactivate(byId(b.dataset.deact))));
    }

    // Scopes default to all four: a connection that cannot do something fails at 3am in the
    // chat service's logs, not here, so the safe default is "can", and narrowing is a choice.
    async function credCreateModal() {
      const tenants = await credActiveTenants();
      const scopeRows = CRED_SCOPES.map(([s, k]) =>
        `<label class="inline" style="gap:8px; margin:8px 0 0"><input type="checkbox" data-scope="${s}" checked /> <span><code>${s}</code> — ${esc(t(k))}</span></label>`).join('');
      const wsRows = tenants.length ? tenants.map(x =>
        `<label class="inline" style="gap:8px; margin:8px 0 0"><input type="checkbox" data-ws="${esc(x.id)}" /> <span>${esc(x.name)} <code>${esc(x.slug)}</code></span></label>`).join('')
        : `<p class="hint">${esc(t('cred.workspaces.none'))}</p>`;
      const bg = showModal(`<h3 style="margin-top:0">${esc(t('cred.new'))}</h3>
        <label>${esc(t('f.name'))}</label><input id="ccName" maxlength="120" placeholder="${esc(t('cred.name.ph'))}" />
        <label>${esc(t('cred.scopes'))}</label>${scopeRows}
        <label>${esc(t('cred.workspaces'))}</label><div style="max-height:220px; overflow:auto">${wsRows}</div>
        <p class="hint">${esc(t('cred.workspaces.hint'))}</p>
        <div class="msg" id="ccMsg"></div>
        <div class="actions"><button class="ghost" id="ccCancel">${esc(t('btn.cancel'))}</button>
          <button class="primary" id="ccCreate">${esc(t('cred.create'))}</button></div>`, '560px');
      const name = bg.querySelector('#ccName'), m = bg.querySelector('#ccMsg'), b = bg.querySelector('#ccCreate');
      bg.querySelector('#ccCancel').addEventListener('click', () => bg.remove());
      const submit = async () => {
        const nm = name.value.trim();
        const scopes = [...bg.querySelectorAll('input[data-scope]:checked')].map(i => i.dataset.scope);
        const grants = [...bg.querySelectorAll('input[data-ws]:checked')].map(i => i.dataset.ws);
        if (!nm) { m.className = 'msg err'; m.textContent = t('cred.name.required'); name.focus(); return; }
        if (!scopes.length) { m.className = 'msg err'; m.textContent = t('cred.scopes.required'); return; }
        b.disabled = true;
        try {
          const d = await credCall(CRED_URL, { method: 'POST', headers: jhdr(), body: JSON.stringify({ name: nm, scopes, grants }) }, m);
          if (!d) return;
          bg.remove(); CQ.toast(t('cred.created'), 'ok');
          credRevealModal(d, nm, 0);
          loadConnections();
        } finally { b.disabled = false; }
      };
      b.addEventListener('click', submit);
      name.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      name.focus();
    }

    // The only place a key is ever in the clear. `d.warning` is the server's own sentence
    // about that and is preferred; the built-in wording covers an api that sends none. The
    // header snippet is here, next to the key, because the operator pastes both into the
    // chat service's config in the same minute — a separate docs page would be one more tab.
    function credRevealModal(d, name, overlapDays) {
      const key = d.api_key || '';
      const mono = 'font-family:ui-monospace,SFMono-Regular,Menlo,monospace';
      const snippet = [`X-CQ-Key: ${esc(key)}`,
        `X-CQ-Tenant: &lt;${esc(t('cred.snippet.tenant'))}&gt;`,
        `X-CQ-Expect-Tenant: &lt;${esc(t('cred.snippet.same'))}&gt;`].join('\n');
      const bg = showModal(`<h3 style="margin-top:0">${esc(t('cred.reveal.title'))}</h3>
        <p class="hint" style="margin-top:-6px">${esc(name)}</p>
        <div class="inline" style="gap:8px">
          <input id="crKey" readonly value="${esc(key)}" style="${mono}; flex:1" />
          <button class="ghost" id="crCopy" style="flex:0 0 auto">${esc(t('pb.copy'))}</button>
        </div>
        <p class="msg err" style="margin-top:10px">${esc(d.warning || t('cred.reveal.once'))}</p>
        ${overlapDays ? `<p class="hint">${esc(t('cred.reveal.overlap').replace('{days}', () => String(overlapDays)))}</p>` : ''}
        <p class="hint">${esc(t('cred.reveal.headers'))}</p>
        <pre class="tx" style="margin:0; ${mono}">${snippet}</pre>
        <p class="hint">${esc(t('cred.reveal.serverside'))}</p>
        <div class="actions"><button class="primary" id="crClose">${esc(t('pb.close'))}</button></div>`, '640px');
      const inp = bg.querySelector('#crKey');
      inp.addEventListener('focus', () => inp.select());
      bg.querySelector('#crCopy').addEventListener('click', async () => {
        inp.select();                                   // a failed copy still leaves the key selected
        const ok = await copyText(key);
        CQ.toast(ok ? t('pb.copied') : t('cred.copyfail'), ok ? 'ok' : 'err');
      });
      bg.querySelector('#crClose').addEventListener('click', () => bg.remove());
    }

    // Rotation is not dangerous — the old key keeps working through the overlap — so the
    // confirm is the plain kind; the reveal that follows is the whole point of the click.
    async function credRotate(x) {
      if (!x) return;
      const msg = t('cred.rotate.confirm').replace('{name}', () => credName(x)).replace('{days}', () => String(CRED_OVERLAP_DAYS));
      if (!(await CQ.confirm(msg, { ok: t('btn.rotate'), danger: false }))) return;
      const d = await credCall(`${CRED_URL}/${encodeURIComponent(x.id)}/rotate?overlap_days=${CRED_OVERLAP_DAYS}`, { method: 'POST', headers: hdr() });
      if (!d) return;
      CQ.toast(t('cred.rotated'), 'ok');
      credRevealModal(d, credName(x), d.overlap_days ?? CRED_OVERLAP_DAYS);
      loadConnections();
    }

    async function credDeactivate(x) {
      if (!x) return;
      if (!(await CQ.confirm(t('cred.deactivate.confirm').replace('{name}', () => credName(x)), { ok: t('cred.deactivate'), danger: true }))) return;
      const d = await credCall(`${CRED_URL}/${encodeURIComponent(x.id)}`, { method: 'DELETE', headers: hdr() });
      if (!d) return;
      CQ.toast(t('cred.deactivated'), 'ok'); loadConnections();
    }

    // Only workspaces that are active AND not already granted are offered: re-granting is a
    // server error the operator would otherwise have to read, and an inactive workspace
    // cannot be served no matter what the grant says.
    async function credGrantModal(x) {
      if (!x) return;
      const granted = new Set(credActiveGrants(x).map(g => String(g.client_id)));
      const free = (await credActiveTenants()).filter(w => !granted.has(String(w.id)));
      const body = free.length
        ? `<label>${esc(t('cred.grant.pick'))}</label><select id="agWs">${free.map(w => `<option value="${esc(w.id)}">${esc(w.name)} (${esc(w.slug)})</option>`).join('')}</select>`
        : `<p class="hint">${esc(t('cred.grant.allgranted'))}</p>`;
      const bg = showModal(`<h3 style="margin-top:0">${esc(t('cred.grant.title').replace('{name}', () => credName(x)))}</h3>
        ${body}
        <div class="msg" id="agMsg"></div>
        <div class="actions"><button class="ghost" id="agCancel">${esc(t('btn.cancel'))}</button>
          ${free.length ? `<button class="primary" id="agOk">${esc(t('cred.grant.submit'))}</button>` : ''}</div>`);
      CQ.enhanceSelects(bg);
      bg.querySelector('#agCancel').addEventListener('click', () => bg.remove());
      const ok = bg.querySelector('#agOk');
      if (ok) ok.addEventListener('click', async () => {
        ok.disabled = true;
        try {
          const d = await credCall(`${CRED_URL}/${encodeURIComponent(x.id)}/grants`, { method: 'POST', headers: jhdr(),
            body: JSON.stringify({ tenant: bg.querySelector('#agWs').value }) }, bg.querySelector('#agMsg'));
          if (!d) return;
          bg.remove(); CQ.toast(t('cred.grant.added'), 'ok'); loadConnections();
        } finally { ok.disabled = false; }
      });
    }

    async function credRemoveGrant(x, clientId) {
      if (!x) return;
      const g = credActiveGrants(x).find(g => String(g.client_id) === String(clientId));
      const msg = t('cred.grant.remove.confirm').replace('{ws}', () => g ? credWsLabel(g) : clientId).replace('{name}', () => credName(x));
      if (!(await CQ.confirm(msg, { ok: t('btn.remove'), danger: true }))) return;
      const d = await credCall(`${CRED_URL}/${encodeURIComponent(x.id)}/grants/${encodeURIComponent(clientId)}`, { method: 'DELETE', headers: hdr() });
      if (!d) return;
      CQ.toast(t('cred.grant.removed'), 'ok'); loadConnections();
    }

    $('newConnBtn').addEventListener('click', credCreateModal);
    $('reloadConn').addEventListener('click', loadConnections);
    // Loaded when the tab opens, like the kill switch beside it, rather than in loadAll():
    // this is the least-visited card in the console and nothing else depends on its data.
    document.querySelector('.tab[data-tab="bot"]').addEventListener('click', loadConnections);

    boot();
  </script>
</body>
</html>
