<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CommuniQ — Console</title>
  <script>document.documentElement.setAttribute('data-theme', (function(){try{return localStorage.getItem('cq_theme')||'dark'}catch(e){return 'dark'}})());</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="icon" href="favicon.png" />
  <script src="brand.js"></script>
</head>
<body>
  <div id="cq-header"></div>
  <main class="console">
    <div id="app" class="hidden">
      <div class="tabs">
        <div class="tab active" data-tab="tenants" data-i18n="adm.tenants"></div>
        <div class="tab" data-tab="users" data-i18n="pb.users"></div>
        <div class="tab" data-tab="embeddings" data-i18n="adm.embeddings"></div>
        <div class="tab" data-tab="anon" data-i18n="adm.anon"></div>
        <div class="tab" data-tab="storage" data-i18n="pb.storage"></div>
        <div class="tab" data-tab="defrubric" data-i18n="pb.defrubric"></div>
        <div class="tab" data-tab="defbot" data-i18n="pb.defbot"></div>
        <div class="tab" data-tab="integrations" data-i18n="adm.integrations"></div>
        <div class="tab" data-tab="voices" data-i18n="adm.voices"></div>
        <div class="tab" data-tab="bot" data-i18n="adm.bot"></div>
      </div>

      <!-- TENANTS -->
      <section class="panel active" id="panel-tenants">
        <div class="card">
          <h3 data-i18n="adm.createtenant"></h3>
          <div class="row">
            <div><label data-i18n="f.name"></label><input id="t_name" placeholder="Acme Bank" /></div>
            <div><label data-i18n="f.industry"></label><input id="t_industry" placeholder="banking" /></div>
            <div><label data-i18n="f.region"></label><input id="t_region" placeholder="ge" /></div>
          </div>
          <div class="actions"><button class="primary" id="createTenantBtn" data-i18n="btn.create"></button></div>
          <div class="msg" id="createTenantMsg"></div>
        </div>
        <div class="card">
          <div class="inline" style="justify-content:space-between"><h3 style="margin:0" data-i18n="adm.tenants"></h3>
            <button class="ghost" id="reloadTenants" data-i18n="btn.refresh"></button></div>
          <div id="tenantList" style="margin-top:12px"></div>
        </div>
      </section>

      <!-- REGISTERED ACCOUNTS -->
      <!-- Two cards, in the order an operator needs them: the tier first (what a new account
           gets by default), then the accounts themselves. There is no mail provider, so the
           reset button here is the ONLY password-recovery path a registered user has. -->
      <section class="panel" id="panel-users">
        <div class="card">
          <h3 data-i18n="pb.reg.heading"></h3>
          <p class="hint" data-i18n="pb.reg.desc"></p>
          <!-- "Sign-ups open" is NOT a master switch over existing accounts: the tip says so,
               because the obvious reading of a checkbox called "enabled" is the wrong one and
               an operator reaching for it at 3am is trying to stop new sign-ups, not to lock
               out everyone who already has an account. -->
          <label class="inline" style="gap:8px"><input type="checkbox" id="r_enabled" /> <span data-i18n="pb.reg.signups"></span><button class="tip" data-tip-i18n="pb.reg.signups.hint" style="margin-left:0"></button></label>
          <div class="row" style="margin-top:12px">
            <div><label data-i18n="adm.maxanalyses"></label><input id="r_analyses" type="number" min="0" /></div>
            <div><label data-i18n="adm.maxmb"></label><input id="r_mb" type="number" min="0" /></div>
            <div><label data-i18n="adm.maxtts"></label><input id="r_tts" type="number" min="0" /></div>
            <div><label data-i18n="pb.reg.maxconv"></label><input id="r_conv" type="number" min="0" /></div>
          </div>
          <h4 data-i18n="adm.features"></h4>
          <div class="inline" style="gap:18px; flex-wrap:wrap; row-gap:8px">
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_analyze" /> <span data-i18n="feat.analyze"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_tts" /> <span data-i18n="feat.tts"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_convert" /> <span data-i18n="pb.feat.convert"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_score" /> <span data-i18n="pb.feat.score"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_semantic" /> <span data-i18n="pb.feat.semantic"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_summarise" /> <span data-i18n="pb.feat.summarise"></span></label>
          </div>
          <div class="actions"><button class="primary" id="saveReg" data-i18n="btn.savelimits"></button></div>
          <div class="msg" id="regMsg"></div>
        </div>
        <div class="card">
          <div class="inline" style="justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px">
            <h3 style="margin:0" data-i18n="pb.users.heading"></h3>
            <div class="inline" style="gap:8px">
              <input id="u_search" data-i18n-ph="pb.users.search" style="width:220px" />
              <button class="ghost" id="reloadUsers" data-i18n="btn.refresh"></button>
            </div>
          </div>
          <p class="hint" data-i18n="pb.users.legend"></p>
          <div id="userList" style="margin-top:6px"></div>
          <div class="msg" id="userMsg"></div>
        </div>
      </section>

      <!-- EMBEDDINGS -->
      <section class="panel" id="panel-embeddings">
        <div class="card">
          <h3 data-i18n="adm.embprov"></h3>
          <div class="row">
            <div><label data-i18n="f.provider"></label>
              <select id="e_provider"><option value="tei">tei (self-hosted BGE-M3)</option><option value="openai">openai</option></select></div>
            <!-- The label text sits in its own span: applyI18n rewrites a [data-i18n]
                 element's whole textContent, so an ⓘ appended to the label itself would
                 vanish on the first language switch. Same shape everywhere below. -->
            <div><label><span data-i18n="f.dimension"></span><button class="tip" data-tip-i18n="adm.embnote"></button></label><input id="e_dim" type="number" /></div>
          </div>
          <label data-i18n="f.model"></label><input id="e_model" placeholder="BAAI/bge-m3" />
          <label data-i18n="f.baseurl"></label><input id="e_base_url" placeholder="http://embeddings:80" />
          <label data-i18n="f.openaikey"></label><input id="e_api_key" type="password" />
          <div class="hint" id="e_hint"></div>
          <div class="actions">
            <button class="primary" id="saveEmb" data-i18n="btn.save"></button>
            <button class="ghost" id="testEmb" data-i18n="btn.test"></button>
          </div>
          <div id="embTest"></div><div class="msg" id="embMsg"></div>
        </div>
      </section>

      <!-- ANONYMOUS -->
      <section class="panel" id="panel-anon">
        <div class="card">
          <h3 data-i18n="adm.anonheading"></h3>
          <label class="inline" style="gap:8px"><input type="checkbox" id="a_enabled" /> <span data-i18n="adm.allowanon"></span></label>
          <div class="row" style="margin-top:12px">
            <div><label data-i18n="adm.maxanalyses"></label><input id="a_analyses" type="number" /></div>
            <div><label data-i18n="adm.maxmb"></label><input id="a_mb" type="number" /></div>
            <div><label data-i18n="adm.maxtts"></label><input id="a_tts" type="number" /></div>
          </div>
          <!-- Retention used to live here as a fourth number. It governs EVERY stored
               recording now, not just an anonymous visitor's, so it moved to its own tab
               rather than staying under a heading that understates what it deletes. The
               line stays because an operator who knew where the field was needs to be told
               where it went, not left to conclude the setting was dropped. -->
          <p class="hint" data-i18n="pb.storage.moved"></p>
          <h4 data-i18n="adm.features"></h4>
          <div class="inline" style="gap:18px">
            <label class="inline" style="gap:6px"><input type="checkbox" id="f_analyze" /> <span data-i18n="feat.analyze"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="f_tts" /> <span data-i18n="feat.tts"></span></label>
          </div>
          <div class="actions"><button class="primary" id="saveAnon" data-i18n="btn.savelimits"></button></div>
          <div class="msg" id="anonMsg"></div>
        </div>
        <div class="card">
          <h3 data-i18n="adm.sentiment.heading"></h3>
          <label class="inline" style="gap:8px"><input type="checkbox" id="sn_enabled" /> <span data-i18n="sn.enabled"></span></label>
          <label data-i18n="sn.guidance"></label>
          <textarea id="sn_guidance" data-i18n-ph="sn.guidance.ph" style="min-height:80px"></textarea>
          <div class="actions"><button class="primary" id="saveSentiment" data-i18n="sn.save"></button></div>
          <div class="msg" id="sentimentMsg"></div>
        </div>
      </section>

      <!-- STORAGE -->
      <!-- One field, its own tab. It is here rather than on Anonymous because the number
           now decides when a paying tenant's call recording stops being replayable, and a
           control that dangerous should not be read as "settings for guests". -->
      <section class="panel" id="panel-storage">
        <div class="card">
          <h3 data-i18n="pb.storage.heading"></h3>
          <p class="hint" data-i18n="pb.storage.desc"></p>
          <div class="row" style="margin-top:6px">
            <div class="w-num"><label><span data-i18n="pb.storage.days"></span><button class="tip" data-tip-i18n="pb.storage.hint"></button></label>
              <input id="st_days" type="number" min="0" max="3650" /></div>
          </div>
          <div class="actions"><button class="primary" id="saveStorage" data-i18n="btn.save"></button></div>
          <div class="msg" id="storageMsg"></div>
        </div>
      </section>

      <!-- DEFAULT RUBRIC -->
      <!-- The same editor as the tenant portal's Rubric panel, one level up: this is what
           every owner WITHOUT a rubric of their own is scored against. The source pill is
           the important half — until an operator saves here, what is on screen is only a
           proposal (the demo tenant's rubric, or the built-in starter). -->
      <section class="panel" id="panel-defrubric">
        <div class="card">
          <div class="inline" style="justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; row-gap:6px">
            <h3 style="margin:0" data-i18n="pb.defrubric.heading"></h3>
            <span class="inline" style="gap:8px"><span class="pill" id="drSource">—</span><span class="hint" id="drUpdated"></span></span>
          </div>
          <p class="hint" data-i18n="pb.defrubric.desc"></p>
          <div id="drDims"></div>
          <div class="actions" style="justify-content:space-between; align-items:center">
            <div class="inline" style="gap:8px">
              <button class="ghost" id="drAdd" data-i18n="sc.adddim"></button>
              <button class="ghost" id="drNormalize" data-i18n="sc.normalize"></button>
            </div>
            <span class="hint"><span data-i18n="sc.sum"></span>: <b id="drSum">0</b>% <span id="drSumFlag"></span></span>
          </div>
          <hr class="sep" />
          <label data-i18n="sc.rubric"></label>
          <textarea id="drRubric" style="min-height:80px" data-i18n-ph="sc.rubric.ph"></textarea>
          <div class="actions"><button class="primary" id="drSave" data-i18n="sc.save"></button></div>
          <div class="msg" id="drMsg"></div>
        </div>
      </section>

      <!-- DEFAULT BOT -->
      <!-- The tenant portal's Bot form one level up: what every workspace WITHOUT saved bot
           settings of its own inherits. Deliberately no autopilot switch — the default may
           shape HOW a bot answers, never WHETHER one is answering; that stays a per-workspace
           decision, taken after the workspace has shared at least one document with it. -->
      <section class="panel" id="panel-defbot">
        <div class="card">
          <div class="inline" style="justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; row-gap:6px">
            <h3 style="margin:0" data-i18n="pb.defbot.heading"></h3>
            <span class="inline" style="gap:8px"><span class="pill" id="dbSource">—</span><span class="hint" id="dbUpdated"></span></span>
          </div>
          <p class="hint" data-i18n="pb.defbot.desc"></p>
          <p class="hint" data-i18n="bot.autopilot.default.note"></p>
        </div>

        <div class="card">
          <label data-i18n="bot.persona"></label>
          <textarea id="db_persona" data-i18n-ph="bot.persona.ph" style="min-height:90px"></textarea>
          <h4 data-i18n="bot.languages"></h4>
          <div class="inline" style="gap:18px">
            <label class="inline" style="gap:6px"><input type="checkbox" class="db-lang" data-lang="en" style="width:auto" /> <span data-i18n="bot.lang.en"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" class="db-lang" data-lang="ka" style="width:auto" /> <span data-i18n="bot.lang.ka"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" class="db-lang" data-lang="ru" style="width:auto" /> <span data-i18n="bot.lang.ru"></span></label>
          </div>
        </div>

        <!-- Greeting + refusal in all three languages, as in the portal: a missing translation
             in the default is a missing translation for every workspace that never wrote its own. -->
        <div class="card">
          <h3 data-i18n="bot.greeting"></h3>
          <div class="row stack-md">
            <div><label data-i18n="bot.lang.en"></label><textarea id="db_greet_en"></textarea></div>
            <div><label data-i18n="bot.lang.ka"></label><textarea id="db_greet_ka"></textarea></div>
            <div><label data-i18n="bot.lang.ru"></label><textarea id="db_greet_ru"></textarea></div>
          </div>
        </div>
        <div class="card">
          <h3><span data-i18n="bot.refusal"></span><button class="tip" data-tip-i18n="bot.refusal.hint"></button></h3>
          <div class="row stack-md">
            <div><label data-i18n="bot.lang.en"></label><textarea id="db_ref_en"></textarea></div>
            <div><label data-i18n="bot.lang.ka"></label><textarea id="db_ref_ka"></textarea></div>
            <div><label data-i18n="bot.lang.ru"></label><textarea id="db_ref_ru"></textarea></div>
          </div>
        </div>

        <div class="card">
          <h3><span data-i18n="bot.escalation"></span><button class="tip" data-tip-i18n="bot.escalation.hint"></button></h3>
          <input id="db_escalation" data-i18n-ph="bot.escalation.ph" />
          <h4 data-i18n="bot.retrieval"></h4>
          <div class="row">
            <div><label data-i18n="bot.minscore"></label><input id="db_minscore" type="number" step="0.01" min="0" max="1" /></div>
            <div><label data-i18n="bot.minhits"></label><input id="db_minhits" type="number" min="0" /></div>
            <div><label data-i18n="bot.topk"></label><input id="db_topk" type="number" min="1" /></div>
            <div><label data-i18n="bot.suggestions"></label><input id="db_sugg" type="number" min="1" /></div>
            <div><label data-i18n="bot.maxchars"></label><input id="db_maxchars" type="number" min="1" /></div>
          </div>
          <!-- The portal shows only the copilot (draft) caps; the answer caps exist only here
               because an operator, not a customer, decides how fast an unattended bot may talk. -->
          <h4 data-i18n="bot.caps"></h4>
          <div class="row">
            <div><label data-i18n="bot.cap.tenant"></label><input id="db_cap_tenant" type="number" min="0" /></div>
            <div><label data-i18n="bot.cap.enduser"></label><input id="db_cap_enduser" type="number" min="0" /></div>
          </div>
          <div class="row">
            <div><label data-i18n="bot.cap.answer_tenant"></label><input id="db_cap_answer_tenant" type="number" min="0" /></div>
            <div><label data-i18n="bot.cap.answer_enduser"></label><input id="db_cap_answer_enduser" type="number" min="0" /></div>
          </div>
          <div class="hint" data-i18n="bot.cap.hint"></div>
        </div>

        <!-- Disclosure is appended by code after generation, so it is the one line of bot copy
             a customer's prompt cannot talk the model out of — which is why it is set here. -->
        <div class="card">
          <h3><span data-i18n="bot.disclosure"></span><button class="tip" data-tip-i18n="bot.disclosure.hint"></button></h3>
          <label data-i18n="bot.disclosure.mode"></label>
          <select id="db_disclosure_mode">
            <option value="first" data-i18n="bot.disclosure.first"></option>
            <option value="always" data-i18n="bot.disclosure.always"></option>
            <option value="off" data-i18n="bot.disclosure.off"></option>
          </select>
          <div class="hint" style="margin-top:10px" data-i18n="bot.disclosure.text"></div>
          <div class="row stack-md">
            <div><label data-i18n="bot.lang.en"></label><textarea id="db_disc_en"></textarea></div>
            <div><label data-i18n="bot.lang.ka"></label><textarea id="db_disc_ka"></textarea></div>
            <div><label data-i18n="bot.lang.ru"></label><textarea id="db_disc_ru"></textarea></div>
          </div>
        </div>

        <!-- The refusal-vs-general-knowledge choice, stated as the risk it is. Off by default. -->
        <div class="card">
          <label class="inline" style="gap:8px"><input type="checkbox" id="db_general" style="width:auto" /> <span data-i18n="bot.general"></span><button class="tip" data-tip-i18n="bot.general.risk"></button></label>
          <label class="inline" style="gap:8px; margin-top:14px"><input type="checkbox" id="db_handoff" style="width:auto" /> <span data-i18n="bot.handoff"></span><button class="tip" data-tip-i18n="bot.handoff.hint"></button></label>
        </div>

        <div class="card">
          <div class="actions"><button class="primary" id="dbSave" data-i18n="sc.save"></button></div>
          <div class="msg" id="dbMsg"></div>
        </div>
      </section>

      <!-- INTEGRATIONS -->
      <section class="panel" id="panel-integrations">
        <div class="card">
          <h3 data-i18n="adm.intkeys"></h3>
          <label data-i18n="f.anthropic"></label><input type="password" id="anthropic_api_key" placeholder="sk-ant-…" />
          <div class="hint" id="anthropicHint"></div>
          <label data-i18n="f.eleven"></label><input type="password" id="elevenlabs_api_key" />
          <div class="hint" id="elevenlabsHint"></div>
        </div>
        <div class="card">
          <h3 data-i18n="adm.models"></h3>
          <div class="row">
            <div><label data-i18n="f.claudemodel"></label>
              <select id="llm_model"><option>claude-opus-4-8</option><option>claude-sonnet-5</option><option>claude-haiku-4-5</option></select></div>
            <div><label data-i18n="f.sttmodel"></label><input id="stt_model" placeholder="scribe_v1" /></div>
          </div>
          <div class="row">
            <div><label data-i18n="f.ttsmodel"></label><input id="tts_model" placeholder="eleven_multilingual_v2" /></div>
            <div><label data-i18n="f.voiceid"></label>
              <div class="inline"><input id="tts_voice_id" style="flex:1" /><button class="ghost" id="voicePreviewBtn" type="button">▶</button></div>
              <div id="voicePreviewAudio"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="adm.instructions"></h3>
          <textarea id="analysis_instructions"></textarea>
          <!-- The ⓘ rides in the actions row rather than on a label: what it warns about
               (every click really transcribes and really synthesises, so it costs
               ElevenLabs credit) belongs to the two Test buttons, not to a field. -->
          <div class="actions"><button class="primary" id="saveInt" data-i18n="btn.savesettings"></button><button class="ghost" id="testInt" data-i18n="btn.testconn"></button><button class="ghost" id="testDeep" data-i18n="btn.testdeep"></button><button class="tip" data-tip-i18n="adm.testnote" data-tip-for="testInt testDeep" style="align-self:center"></button></div>
          <div class="msg" id="intMsg"></div><div id="intTest"></div>
        </div>
      </section>

      <!-- VOICES -->
      <section class="panel" id="panel-voices">
        <div class="card">
          <h3 data-i18n="adm.voicevis"></h3>
          <!-- margin-left:0 so the ⓘ sits on the row's own 8px gap instead of adding its
               default 6px to it. A <button> inside a <label> does not activate the label,
               so this cannot toggle the checkbox by accident. -->
          <label class="inline" style="gap:8px"><input type="checkbox" id="v_restrict" /><span data-i18n="f.restrictvoices"></span><button class="tip" data-tip-i18n="v.hint" style="margin-left:0"></button></label>
          <div class="row" style="margin-top:10px">
            <div style="flex:2"><input id="v_search" data-i18n-ph="v.search" /></div>
            <div style="flex:0; align-self:center" class="hint"><b id="v_count">0</b> <span data-i18n="v.selected"></span></div>
          </div>
          <!-- one shared player for all previews (no second play bar) -->
          <div id="voicesPlayer" style="margin-top:8px"></div>
          <div id="voicesList" style="margin-top:8px; max-height:52vh; overflow:auto"></div>
          <div class="actions"><button class="primary" id="saveVoices" data-i18n="btn.savesettings"></button></div>
          <div class="msg" id="voicesMsg"></div>
        </div>
      </section>
      <!-- BOT CONTROL — the 3am brake. State first, one click to act, no settings blob. -->
      <section class="panel" id="panel-bot">
        <div class="card">
          <div class="row" style="justify-content:space-between; align-items:flex-start">
            <div style="flex:1">
              <h3 style="margin:0"><span data-i18n="kill.heading"></span><button class="tip" data-tip-i18n="kill.desc"></button></h3>
            </div>
            <div class="inline" style="flex:0; gap:8px">
              <span class="pill" id="killGlobalPill">—</span>
              <button class="ghost" id="reloadKill" data-i18n="btn.refresh"></button>
            </div>
          </div>
          <div class="actions"><button class="danger" id="killGlobalBtn" data-i18n="kill.global"></button></div>
          <div class="msg" id="killMsg"></div>
        </div>
        <div class="card">
          <h3 data-i18n="kill.tenants"></h3>
          <div id="killList" style="margin-top:12px"></div>
        </div>
        <!-- CHAT CONNECTIONS — the credentials chat services authenticate with, and the
             workspaces each may act for. A key is hashed at rest, so its clear text exists in
             exactly one place, the reveal modal, once; the table never shows more than key_ids. -->
        <div class="card">
          <div class="row" style="justify-content:space-between; align-items:flex-start">
            <div style="flex:1">
              <h3 style="margin:0" data-i18n="cred.heading"></h3>
              <p class="hint" data-i18n="cred.lead"></p>
            </div>
            <div class="inline" style="flex:0; gap:8px">
              <button class="ghost" id="reloadConn" data-i18n="btn.refresh"></button>
              <button class="primary" id="newConnBtn" data-i18n="cred.new"></button>
            </div>
          </div>
          <div id="connList" style="margin-top:12px"></div>
          <div class="msg" id="connMsg"></div>
        </div>
      </section>
    </div>
  </main>
  <div id="modalHost"></div>

  <script>
    const API = CQ.API, t = CQ.t;
    CQ.mountHeader({ tag: 'Console' });
    let TOKEN = sessionStorage.getItem('cq_admin_token') || '';
    const $ = id => document.getElementById(id);
    const hdr = (extra={}) => ({ 'X-Admin-Token': TOKEN, ...extra });
    const jhdr = () => hdr({ 'Content-Type': 'application/json' });
    const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    $('logout').addEventListener('click', e => { e.preventDefault();
      sessionStorage.removeItem('cq_admin_token'); sessionStorage.removeItem('cq_tenant_token');
      location.replace('tenant.html'); });
    // Central 401 interception: an expired admin token lands on the sign-in page instead of
    // silently no-op'ing every Refresh and turning saves into 'Save failed'.
    async function adminFetch(url, init) {
      const r = await fetch(url, init);
      if (r.status === 401) { sessionStorage.removeItem('cq_admin_token'); location.replace('tenant.html?next=admin.html'); throw new Error('unauthorized'); }
      return r;
    }
    CQ.enhanceSelects();

    document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      tb.classList.add('active'); $('panel-' + tb.dataset.tab).classList.add('active');
      if (tb.dataset.tab === 'bot') loadKill();
      if (tb.dataset.tab === 'defbot') loadDefBot();
    }));
    document.addEventListener('cq:lang', () => { if ($('app').classList.contains('hidden')) return;
      loadTenants();
      // The kill-switch pills/buttons are built in JS, so data-i18n cannot retranslate them.
      if ($('panel-bot').classList.contains('active')) { renderKillGlobal(true); renderKillTenants(); loadConnections(); }
      // Same reason for these two: their rows and their source pill are painted in JS, so
      // data-i18n cannot reach them. Repainted whether or not their panel is on screen —
      // nothing re-renders them on tab activation, so a table left stale while hidden would
      // still be stale in the old language when the operator finally opens it.
      renderUsers();
      // Read the editor back first: a language switch mid-edit must not throw away the
      // dimensions someone has typed but not saved.
      if ($('drDims').querySelector('.sc-edit')) drReadDom();
      drRenderDims(); drPaintSource();
      // The default-bot source pill is painted in JS too, and the custom <select> caches its
      // option labels — neither notices applyI18n on its own. Only once something has loaded:
      // before that the pill's "—" must not turn into a claim about where the defaults came from.
      if (dbCfg) { dbPaintSource(); CQ.syncSelect($('db_disclosure_mode')); } });

    async function loadAll() { await Promise.all([loadIntegrations(), loadEmbeddings(), loadAnon(), loadSentimentSettings(),
      loadTenants(), loadVoices(), loadRegistered(), loadUsers(), loadStorage(), loadDefaultRubric()]); }

    // Login happens on the unified sign-in page; this console is token-gated only.
    let settingsLoaded = false;   // guards saveInt: never PUT fields that never loaded
    async function boot() {
      if (!TOKEN) { location.replace('tenant.html?next=admin.html'); return; }
      try {
        const r = await fetch(`${API}/admin/settings`, { headers: hdr() });
        if (r.status === 401) { sessionStorage.removeItem('cq_admin_token'); location.replace('tenant.html?next=admin.html'); return; }
        if (!r.ok) throw new Error('http ' + r.status);
      } catch {
        // API/proxy down: a visible retry state, not a permanently blank page.
        const main = document.querySelector('main');
        const box = document.createElement('div');
        box.className = 'card'; box.style.textAlign = 'center';
        box.innerHTML = `<p>${t('err.unavailable')}</p>`;
        const rb = document.createElement('button'); rb.className = 'primary'; rb.textContent = t('btn.retry');
        rb.addEventListener('click', () => location.reload());
        box.appendChild(rb); main.prepend(box);
        return;
      }
      $('app').classList.remove('hidden');
      await loadAll().catch(() => {});
    }

    // integrations
    const INT_FIELDS = ['llm_model','stt_model','tts_model','tts_voice_id','analysis_instructions'];
    async function loadIntegrations() {
      const r = await adminFetch(`${API}/admin/settings`, { headers: hdr() }); if (!r.ok) return; const d = await r.json();
      INT_FIELDS.forEach(f => { if ($(f)) $(f).value = d[f] ?? ''; }); CQ.syncSelect($('llm_model'));
      settingsLoaded = true;   // fields are populated — Save is safe from here on
      $('anthropicHint').textContent = d.anthropic_api_key_set ? `Key set (${d.anthropic_api_key_hint}).` : 'No key set.';
      $('elevenlabsHint').textContent = d.elevenlabs_api_key_set ? `Key set (${d.elevenlabs_api_key_hint}).` : 'No key set.';
    }
    $('saveInt').addEventListener('click', async () => {
      const m = $('intMsg'); m.className='msg'; m.textContent='';
      if (!settingsLoaded) { m.className='msg err'; m.textContent = t('err.unavailable'); return; }
      const patch = {}; INT_FIELDS.forEach(f => patch[f] = $(f).value);
      if ($('anthropic_api_key').value.trim()) patch.anthropic_api_key = $('anthropic_api_key').value.trim();
      if ($('elevenlabs_api_key').value.trim()) patch.elevenlabs_api_key = $('elevenlabs_api_key').value.trim();
      const r = await adminFetch(`${API}/admin/settings`, { method:'PUT', headers: jhdr(), body: JSON.stringify(patch) });
      if (r.ok) { $('anthropic_api_key').value=''; $('elevenlabs_api_key').value=''; await loadIntegrations();
        // a new ElevenLabs key may mean a different account -> refresh the voice list + preview map
        voicesFetched = false; voiceMap = {}; await loadVoices();
        m.className='msg ok'; m.textContent=t('toast.saved'); CQ.toast(t('toast.saved'),'ok'); }
      else { const d = await r.json().catch(()=>({})); m.className='msg err'; m.textContent = d.detail || t('toast.error'); }
    });
    // One row per CAPABILITY, not per vendor. A single green "ElevenLabs" row used to hide a
    // key that could list voices but not transcribe — the capabilities carry separate
    // permissions, so each is probed and reported on its own line.
    const CAP_LABEL = { database:'cap.database', ffmpeg:'cap.ffmpeg', elevenlabs_voices:'cap.voices',
      elevenlabs_stt:'cap.stt', elevenlabs_tts:'cap.tts', elevenlabs_tts_ka:'cap.ttska',
      embeddings:'cap.embeddings', claude_analysis:'cap.claude', claude_factcheck:'cap.factcheck',
      claude_scoring:'cap.scoring' };
    const CAP_ICON = { ok:'✅', warn:'⚠️', fail:'❌' };
    async function runTest(deep, btn) {
      const box = $('intTest'), prev = btn.textContent;
      box.innerHTML=''; $('testInt').disabled=true; $('testDeep').disabled=true;
      btn.innerHTML='<span class="spinner"></span>'+t('btn.test')+'…';
      try {
        const r = await adminFetch(`${API}/admin/test${deep?'?deep=true':''}`, { method:'POST', headers: hdr() });
        const d = await r.json();
        const order = Array.isArray(d.order) ? d.order : Object.keys(CAP_LABEL).filter(k => d[k]);
        box.innerHTML = order.map(k => {
          const x = d[k] || {}, lvl = x.level || (x.ok ? 'ok' : 'fail');
          // A missing permission is the one failure the operator can fix in 30 seconds —
          // name the scope instead of leaving it buried in the message.
          const hint = x.code === 'missing_permission' && x.scope
            ? `<div class="hint">${esc(t('cap.fixscope').replace('{scope}', x.scope))}</div>` : '';
          return `<div class="test"><b>${esc(t(CAP_LABEL[k]||k))}</b> ${CAP_ICON[lvl]||'❌'} ${esc(x.detail||'')}${hint}</div>`;
        }).join('');
      } catch(e){ box.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
      finally { $('testInt').disabled=false; $('testDeep').disabled=false; btn.textContent=prev; }
    }
    $('testInt').addEventListener('click', e => runTest(false, e.currentTarget));
    $('testDeep').addEventListener('click', e => runTest(true, e.currentTarget));
    let voiceMap = {}, voicesFetched = false;
    // Admin-side map MUST come from /admin/voices (unfiltered): the public /voices is now
    // curated, so a hidden voice would miss the map and fall through to a paid POST /tts.
    async function fetchVoices(){ if (voicesFetched) return; try { const r = await adminFetch(`${API}/admin/voices`, { headers: hdr() }); if(!r.ok) return;
      const d = await r.json(); (Array.isArray(d.voices) ? d.voices : []).forEach(v => { if (v.preview_url) voiceMap[v.voice_id] = v.preview_url; }); voicesFetched = true; } catch{} }
    $('voicePreviewBtn').addEventListener('click', async () => {
      const box = $('voicePreviewAudio'); box.innerHTML=''; const vid = $('tts_voice_id').value.trim(); if(!vid) return;
      await fetchVoices();
      if (voiceMap[vid]) { CQ.player(box, voiceMap[vid], {name:'preview.mp3'}); return; }
      try { const r = await fetch(`${API}/tts`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text:'Hello.', voice_id: vid}) });
        if (r.ok) CQ.player(box, URL.createObjectURL(await r.blob()), {name:'preview.mp3'}); } catch{}
    });

    // ---- Voices: pre-listen every voice, pick which customers see ----
    let VOICES = [], voicesPlayer = null, voicesCurSrc = null;
    function playVoice(url) {   // one shared bar; re-clicking the same row toggles
      const box = $('voicesPlayer');
      if (voicesCurSrc === url && voicesPlayer) { voicesPlayer.toggle(); return; }
      voicesPlayer = CQ.player(box, url, { name: 'preview.mp3' }); voicesCurSrc = url;
    }
    function voiceRow(v, missing) {
      const sys = v.system ? `<span class="chip" data-i18n="v.system"></span>` : '';
      const gone = missing ? `<span class="chip" data-i18n="v.unavailable"></span>` : '';
      const prev = v.preview_url
        ? `<button class="ghost v-prev" type="button" data-id="${esc(v.voice_id)}" aria-label="Preview">▶</button>`
        : `<span class="chip" data-i18n="v.nopreview"></span>`;
      return `<div class="inline v-row" style="gap:10px; padding:7px 0; border-bottom:1px solid var(--hairline); flex-wrap:wrap; row-gap:4px">
        <input type="checkbox" class="v-tick" data-id="${esc(v.voice_id)}" ${v.selected?'checked':''} ${v.system?'disabled':''} />
        ${prev}
        <span style="flex:1">${esc(v.name || v.voice_id)}</span>
        <span class="pill">${esc(v.category||'')}</span>
        <span class="pill" title="${esc(v.voice_id)}">${esc((v.voice_id||'').slice(0,8))}…</span>
        ${sys}${gone}</div>`;
    }
    function renderVoices(d) {
      const miss = new Set(d.missing||[]);
      const q = ($('v_search').value||'').trim().toLowerCase();
      const rows = VOICES.filter(v => !q || (v.name||'').toLowerCase().includes(q) || (v.category||'').toLowerCase().includes(q));
      $('voicesList').innerHTML = rows.length ? rows.map(v => voiceRow(v, miss.has(v.voice_id))).join('')
        : `<div class="empty">${t('kb.nomatch')}</div>`;
      CQ.applyI18n($('voicesList'));   // injected HTML isn't auto-translated
      updateVCount();
    }
    function updateVCount(){ $('v_count').textContent = $('voicesList').querySelectorAll('.v-tick:checked').length; }
    async function loadVoices() {
      const m = $('voicesMsg'); m.className='msg'; m.textContent='';
      const r = await adminFetch(`${API}/admin/voices`, { headers: hdr() });
      if (!r.ok) { m.className='msg err'; m.textContent = t('v.loadfail'); return; }
      const d = await r.json();
      VOICES = Array.isArray(d.voices) ? d.voices : [];
      $('v_restrict').checked = d.mode === 'allowlist';
      if (d.error) { m.className='msg err'; m.textContent = t('v.loadfail') + ' ' + esc(d.error); }
      renderVoices(d); window._vd = d;
    }
    $('v_search').addEventListener('input', () => renderVoices(window._vd || {}));
    $('voicesList').addEventListener('click', e => {
      const b = e.target.closest('.v-prev');
      if (b) { const v = VOICES.find(x => x.voice_id === b.dataset.id); if (v && v.preview_url) playVoice(v.preview_url); return; }
      if (e.target.classList.contains('v-tick')) {
        const v = VOICES.find(x => x.voice_id === e.target.dataset.id); if (v) v.selected = e.target.checked;
        updateVCount();
      }
    });
    $('saveVoices').addEventListener('click', async () => {
      const m = $('voicesMsg'); m.className='msg'; m.textContent='';
      const ids = VOICES.filter(v => v.selected && !v.system).map(v => v.voice_id);
      const mode = $('v_restrict').checked ? 'allowlist' : 'all';
      if (mode === 'allowlist' && !ids.length) { m.className='msg err'; m.textContent = t('v.pickone'); return; }
      const b = $('saveVoices'); b.disabled=true; b.innerHTML='<span class="spinner"></span>';
      const r = await adminFetch(`${API}/admin/voices`, { method:'PUT', headers: jhdr(), body: JSON.stringify({ mode, voice_ids: ids }) });
      const d = await r.json(); b.disabled=false; b.textContent=t('btn.savesettings');
      if (r.ok) { VOICES = d.voices||[]; $('v_restrict').checked = d.mode==='allowlist'; window._vd = d; renderVoices(d);
        voicesFetched = false; voiceMap = {};   // integrations preview map may be stale
        m.className='msg ok'; m.textContent=t('toast.saved'); CQ.toast(t('toast.saved'),'ok'); }
      else { m.className='msg err'; m.textContent = d.detail || t('toast.error'); }
    });

    // embeddings
    async function loadEmbeddings() {
      const r = await adminFetch(`${API}/admin/embeddings`, { headers: hdr() }); if (!r.ok) return; const d = await r.json();
      $('e_provider').value = d.provider || 'tei'; CQ.syncSelect($('e_provider'));
      $('e_model').value = d.model || ''; $('e_base_url').value = d.base_url || '';
      $('e_dim').value = d.dim || ''; $('e_hint').textContent = d.api_key_set ? `API key set (${d.api_key_hint}).` : 'No API key set.';
    }
    $('saveEmb').addEventListener('click', async () => {
      const m = $('embMsg'); m.className='msg'; m.textContent='';
      const patch = { provider: $('e_provider').value, model: $('e_model').value, base_url: $('e_base_url').value, dim: parseInt($('e_dim').value)||undefined };
      if ($('e_api_key').value.trim()) patch.api_key = $('e_api_key').value.trim();
      const r = await adminFetch(`${API}/admin/embeddings`, { method:'PUT', headers: jhdr(), body: JSON.stringify(patch) });
      if (r.ok) { $('e_api_key').value=''; await loadEmbeddings(); m.className='msg ok'; m.textContent=t('toast.saved'); CQ.toast(t('toast.saved'),'ok'); }
      else { m.className='msg err'; m.textContent=t('toast.error'); }
    });
    $('testEmb').addEventListener('click', async () => {
      const box = $('embTest'), b = $('testEmb'); box.innerHTML=''; b.disabled=true; b.innerHTML='<span class="spinner"></span>'+t('btn.test')+'…';
      try { const r = await adminFetch(`${API}/admin/embeddings/test`, { method:'POST', headers: hdr() }); const d = await r.json();
        box.innerHTML = `<div class="test">${d.ok?'✅':'❌'} ${esc(d.detail||'')}</div>`; }
      finally { b.disabled=false; b.textContent=t('btn.test'); }
    });

    // anonymous
    async function loadAnon() {
      const r = await adminFetch(`${API}/admin/anonymous-limits`, { headers: hdr() }); if (!r.ok) return; const d = await r.json();
      $('a_enabled').checked = !!d.enabled; $('a_analyses').value = d.max_analyses_per_day ?? 0;
      $('a_mb').value = d.max_audio_mb ?? 0; $('a_tts').value = d.max_tts_per_day ?? 0;
      $('f_analyze').checked = !!(d.features||{}).analyze; $('f_tts').checked = !!(d.features||{}).tts;
    }
    $('saveAnon').addEventListener('click', async () => {
      const m = $('anonMsg'); m.className='msg'; m.textContent='';
      const patch = { enabled: $('a_enabled').checked, max_analyses_per_day: parseInt($('a_analyses').value)||0,
        max_audio_mb: parseInt($('a_mb').value)||0, max_tts_per_day: parseInt($('a_tts').value)||0,
        features: { analyze: $('f_analyze').checked, tts: $('f_tts').checked, kb: false } };
      const r = await adminFetch(`${API}/admin/anonymous-limits`, { method:'PUT', headers: jhdr(), body: JSON.stringify(patch) });
      m.className = r.ok ? 'msg ok' : 'msg err'; m.textContent = r.ok ? t('toast.saved') : t('toast.error'); if (r.ok) CQ.toast(t('toast.saved'),'ok');
    });

    // Public-app sentiment config — governs the public site's standalone Sentiment tab only;
    // per-tenant configs are edited by each tenant (owner) or superadmin via KB-admin.
    async function loadSentimentSettings() {
      const r = await adminFetch(`${API}/admin/public-sentiment-config`, { headers: hdr() }); if (!r.ok) return; const d = await r.json();
      $('sn_enabled').checked = !!d.enabled; $('sn_guidance').value = d.guidance || '';
    }
    $('saveSentiment').addEventListener('click', async () => {
      const m = $('sentimentMsg'); m.className='msg'; m.textContent='';
      const patch = { enabled: $('sn_enabled').checked, guidance: $('sn_guidance').value };
      const r = await adminFetch(`${API}/admin/public-sentiment-config`, { method:'PUT', headers: jhdr(), body: JSON.stringify(patch) });
      m.className = r.ok ? 'msg ok' : 'msg err'; m.textContent = r.ok ? t('toast.saved') : t('toast.error'); if (r.ok) CQ.toast(t('toast.saved'),'ok');
    });

    // tenants
    $('reloadTenants').addEventListener('click', loadTenants);
    $('createTenantBtn').addEventListener('click', async () => {
      const m = $('createTenantMsg'); m.className='msg'; m.textContent='';
      const r = await adminFetch(`${API}/admin/tenants`, { method:'POST', headers: jhdr(),
        body: JSON.stringify({ name: $('t_name').value.trim(), industry: $('t_industry').value.trim(), region: $('t_region').value.trim() }) });
      const d = await r.json();
      if (!r.ok) { m.className='msg err'; m.textContent = d.detail || t('toast.error'); return; }
      m.className='msg ok'; m.innerHTML = `${t('toast.created')}: <b>${esc(d.name)}</b> · API key: <code>${esc(d.api_key)}</code>`;
      CQ.toast(t('toast.created'),'ok');
      $('t_name').value=$('t_industry').value=$('t_region').value=''; loadTenants();
    });
    async function loadTenants() {
      const r = await adminFetch(`${API}/admin/tenants`, { headers: hdr() }); if (!r.ok) return;
      const l = await r.json(); const box = $('tenantList');
      box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${t('th.name')}</th><th>${t('th.slug')}</th><th>${t('th.industry')}</th><th>${t('th.active')}</th><th>${t('th.users')}</th><th>${t('th.docs')}</th><th></th></tr></thead><tbody>` +
        l.map(x => `<tr>
          <td>${esc(x.name)}</td><td><code>${esc(x.slug)}</code></td><td>${esc(x.industry||'—')}</td>
          <td><span class="pill ${x.is_active?'on':'off'}">${x.is_active?'●':'○'}</span></td>
          <td>${x.users}</td><td>${x.documents}</td>
          <td class="inline"><button class="ghost" data-act="key" data-id="${x.id}">${t('btn.apikey')}</button>
            <button class="ghost" data-act="users" data-id="${x.id}" data-name="${esc(x.name)}">${t('btn.users')}</button>
            <button class="ghost" data-act="edit" data-id="${x.id}" data-name="${esc(x.name)}">${t('kba.edit')}</button>
            <button class="danger" data-act="del" data-id="${x.id}" data-name="${esc(x.name)}">${t('btn.delete')}</button></td>
        </tr><tr><td colspan="7"><div id="sub-${x.id}"></div></td></tr>`).join('') + `</tbody></table></div>`;
      box.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => tenantAction(b.dataset.act, b.dataset.id, b.dataset.name)));
    }
    async function tenantAction(act, id, name) {
      const sub = $('sub-' + id);
      if (act === 'del') {
        if (!(await CQ.confirm(t('adm.deltenant.confirm').replace('{name}', () => name), {ok:t('btn.delete')}))) return;
        await adminFetch(`${API}/admin/tenants/${id}`, { method:'DELETE', headers: hdr() }); CQ.toast(t('toast.deleted'),'ok'); loadTenants(); return;
      }
      if (act === 'key') {
        const r = await adminFetch(`${API}/admin/tenants/${id}/key`, { headers: hdr() }); const d = await r.json();
        sub.innerHTML = `<div class="sub inline" style="justify-content:space-between">
          <span>${t('btn.apikey')}: <code>${esc(d.api_key||'—')}</code></span>
          <button class="ghost" id="rot-${id}">${t('btn.rotate')}</button></div>`;
        $('rot-'+id).addEventListener('click', async () => {
          if (!(await CQ.confirm(t('adm.rotate.confirm'), {ok:t('btn.rotate')}))) return;
          const rr = await adminFetch(`${API}/admin/tenants/${id}/rotate-key`, { method:'POST', headers: hdr() });
          if (rr.ok) { CQ.toast(t('adm.rotate.done'),'ok'); tenantAction('key', id, name); }
          else CQ.toast(t('toast.error'),'err');
        });
        return;
      }
      if (act === 'edit') {
        const r = await adminFetch(`${API}/admin/tenants`, { headers: hdr() });
        const tn = (await r.json()).find(x => x.id === id) || {};
        sub.innerHTML = `<div class="sub">
          <h4 style="margin-top:0">${t('kba.edit')} · ${esc(tn.name || name)}</h4>
          <div class="row" style="align-items:flex-end">
            <div><label>${t('f.name')}</label><input id="te-name-${id}" value="${esc(tn.name||'')}" /></div>
            <div><label>${t('f.industry')}</label><input id="te-ind-${id}" value="${esc(tn.industry||'')}" /></div>
            <div><label>${t('f.region')}</label><input id="te-reg-${id}" value="${esc(tn.region||'')}" /></div>
            <div style="flex:0"><label class="inline" style="gap:5px"><input type="checkbox" id="te-act-${id}" ${tn.is_active?'checked':''} style="width:auto"/> <span>${t('th.active')}</span></label></div>
            <div style="flex:0"><button class="primary" id="te-save-${id}">${t('btn.save')}</button></div>
          </div><div class="msg" id="te-msg-${id}"></div></div>`;
        $('te-save-'+id).addEventListener('click', async () => {
          const m = $('te-msg-'+id); m.className='msg'; m.textContent='';
          const rr = await adminFetch(`${API}/admin/tenants/${id}`, { method:'PUT', headers: jhdr(),
            body: JSON.stringify({ name: $('te-name-'+id).value.trim(), industry: $('te-ind-'+id).value.trim(),
              region: $('te-reg-'+id).value.trim(), is_active: $('te-act-'+id).checked }) });
          const dd = await rr.json().catch(() => ({}));
          if (!rr.ok) { m.className='msg err'; m.textContent = dd.detail || t('toast.error'); }
          else { CQ.toast(t('toast.saved'),'ok'); loadTenants(); }
        });
        return;
      }
      if (act === 'users') {
        const r = await adminFetch(`${API}/admin/tenants/${id}/users`, { headers: hdr() }); const users = await r.json();
        const roleSel = (uid, cur) => `<select data-urole="${uid}" style="width:auto; padding:7px 10px">
            <option value="member" ${cur==='member'?'selected':''}>${t('role.member')}</option>
            <option value="owner" ${cur==='owner'?'selected':''}>${t('role.owner')}</option></select>`;
        sub.innerHTML = `<div class="sub">
          <h4 style="margin-top:0">${t('btn.users')} · ${esc(name)}</h4>
          <div id="ulist-${id}">${users.map(u=>`<div class="inline wrap" style="justify-content:space-between; padding:6px 0; border-bottom:1px solid color-mix(in oklab,var(--hairline) 60%,transparent)">
            <span style="min-width:140px"><b>${esc(u.username)}</b></span>
            <span class="inline wrap" style="gap:8px">
              ${roleSel(u.id, u.role)}
              <label class="inline" style="gap:5px; margin:0"><input type="checkbox" data-uactive="${u.id}" ${u.is_active?'checked':''} style="width:auto"/> <span>${t('th.active')}</span></label>
              <input type="password" data-upw="${u.id}" placeholder="${esc(t('adm.user.newpw'))}" style="width:210px" autocomplete="new-password"/>
              <button class="ghost" data-usave="${u.id}">${t('btn.save')}</button>
              <button class="act danger" data-uid="${u.id}" data-uname="${esc(u.username)}" title="${t('btn.remove')}" aria-label="${t('btn.remove')}">🗑</button>
            </span></div>`).join('') || `<span class="hint">—</span>`}</div>
          <div class="row" style="margin-top:12px; align-items:flex-end">
            <div><label>${t('f.username')}</label><input id="nu-${id}" /></div>
            <div><label>${t('f.password')}</label><input id="np-${id}" type="password" autocomplete="new-password" /></div>
            <div class="w-sel"><label>${t('f.role')}</label><select id="nr-${id}">
              <option value="member">${t('role.member')}</option><option value="owner">${t('role.owner')}</option></select></div>
            <div style="flex:0"><button class="primary" id="addu-${id}">${t('btn.adduser')}</button></div>
          </div><div class="msg" id="umsg-${id}"></div></div>`;
        CQ.applyI18n(sub);
        sub.querySelectorAll('button[data-usave]').forEach(b => b.addEventListener('click', async () => {
          const uid = b.dataset.usave, m = $('umsg-'+id); m.className='msg'; m.textContent='';
          const body = {
            role: sub.querySelector(`[data-urole="${uid}"]`).value,
            is_active: sub.querySelector(`[data-uactive="${uid}"]`).checked,
          };
          const pw = sub.querySelector(`[data-upw="${uid}"]`).value;
          if (pw) body.password = pw;
          b.disabled = true;
          try {
            const rr = await adminFetch(`${API}/admin/tenants/${id}/users/${uid}`, { method:'PUT', headers: jhdr(), body: JSON.stringify(body) });
            const dd = await rr.json().catch(() => ({}));
            if (!rr.ok) { m.className='msg err'; m.textContent = dd.detail || t('toast.error'); }
            else { CQ.toast(t('adm.user.saved'),'ok'); sub.querySelector(`[data-upw="${uid}"]`).value=''; }
          } finally { b.disabled = false; }
        }));
        sub.querySelectorAll('button[data-uid]').forEach(b => b.addEventListener('click', async () => {
          if (!(await CQ.confirm(t('adm.rmuser.confirm').replace('{u}', () => b.dataset.uname || ''), {ok:t('btn.remove')}))) return;
          await adminFetch(`${API}/admin/tenants/${id}/users/${b.dataset.uid}`, { method:'DELETE', headers: hdr() });
          CQ.toast(t('toast.deleted'),'ok'); tenantAction('users', id, name);
        }));
        $('addu-'+id).addEventListener('click', async () => {
          const m = $('umsg-'+id); m.className='msg';
          const rr = await adminFetch(`${API}/admin/tenants/${id}/users`, { method:'POST', headers: jhdr(),
            body: JSON.stringify({ username: $('nu-'+id).value.trim(), password: $('np-'+id).value, role: $('nr-'+id).value }) });
          const dd = await rr.json();
          if (!rr.ok) { m.className='msg err'; m.textContent = dd.detail || t('toast.error'); }
          else { CQ.toast(t('toast.created'),'ok'); tenantAction('users', id, name); loadTenants(); }
        });
      }
    }

    // ---- Modal host ---------------------------------------------------------------------
    // Same helper the tenant portal and the KB console use: a brand dialog, dismissed by
    // clicking the backdrop. Never a native prompt() — those cannot be translated, cannot be
    // styled, and cannot hold a copy button.
    function showModal(inner, max = '520px') {
      const bg = document.createElement('div'); bg.className = 'cq-modal-bg';
      bg.innerHTML = `<div class="cq-modal" style="max-width:${max}; max-height:86vh; overflow:auto">${inner}</div>`;
      bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
      $('modalHost').appendChild(bg); return bg;
    }
    const fmtWhen = v => { if (!v) return '—'; const d = new Date(v); return isNaN(d) ? '—' : d.toLocaleString(); };

    // navigator.clipboard needs a secure context, and this app is served over plain HTTP on
    // the server. The textarea fallback is not decoration — it is the path that actually runs
    // in production, and a password the operator cannot copy is a password they retype wrong.
    //
    // The branch order is load-bearing: execCommand only works INSIDE the click's user
    // gesture, and an `await` spends that gesture. So the insecure-origin case takes the
    // synchronous path FIRST, before this function has awaited anything, instead of
    // discovering it needs the fallback after the async clipboard has already rejected.
    function copyFallback(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      } catch { return false; }
    }
    async function copyText(text) {
      let pending = null;
      try { if (navigator.clipboard && window.isSecureContext) pending = navigator.clipboard.writeText(text); } catch {}
      if (!pending) return copyFallback(text);          // still inside the gesture
      try { await pending; return true; } catch {}
      return copyFallback(text);                        // a denied permission on a secure origin
    }

    // ---- Registered tier: what a self-service account gets by default ---------------------
    const REG_FEATURES = ['analyze','tts','convert','score','semantic','summarise'];
    let REG = {};                       // the effective tier — also feeds the override modal's placeholders
    async function loadRegistered() {
      const r = await adminFetch(`${API}/admin/registered-limits`, { headers: hdr() }); if (!r.ok) return;
      const d = await r.json(); REG = d || {};
      $('r_enabled').checked = !!d.enabled;
      $('r_analyses').value = d.max_analyses_per_day ?? 0; $('r_mb').value = d.max_audio_mb ?? 0;
      $('r_tts').value = d.max_tts_per_day ?? 0; $('r_conv').value = d.max_conversions_per_day ?? 0;
      const f = d.features || {};
      REG_FEATURES.forEach(k => { const el = $('rf_' + k); if (el) el.checked = !!f[k]; });
    }
    $('saveReg').addEventListener('click', async () => {
      const m = $('regMsg'); m.className = 'msg'; m.textContent = '';
      const features = {}; REG_FEATURES.forEach(k => features[k] = $('rf_' + k).checked);
      const patch = { enabled: $('r_enabled').checked,
        max_analyses_per_day: parseInt($('r_analyses').value) || 0,
        max_audio_mb: parseInt($('r_mb').value) || 0,
        max_tts_per_day: parseInt($('r_tts').value) || 0,
        max_conversions_per_day: parseInt($('r_conv').value) || 0,
        features };
      const b = $('saveReg'); b.disabled = true;
      try {
        const r = await adminFetch(`${API}/admin/registered-limits`, { method: 'PUT', headers: jhdr(), body: JSON.stringify(patch) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); return; }
        REG = d || REG; m.className = 'msg ok'; m.textContent = t('toast.saved'); CQ.toast(t('toast.saved'), 'ok');
      } finally { b.disabled = false; }
    });

    // ---- Registered accounts ---------------------------------------------------------------
    // The table is the operator's only view of self-service users, so it carries the four facts
    // a support call starts from: is the account on, when was it made, when did they last get
    // in, and what have they spent today.
    let USERS = [], userQ = '', userTimer = 0;
    const OVERRIDE_KEYS = [['max_analyses_per_day','adm.maxanalyses'], ['max_audio_mb','adm.maxmb'],
                           ['max_tts_per_day','adm.maxtts'], ['max_conversions_per_day','pb.reg.maxconv']];
    const findUser = id => USERS.find(u => String(u.id) === String(id));

    async function loadUsers() {
      const m = $('userMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(`${API}/admin/users?limit=200&q=${encodeURIComponent(userQ)}`, { headers: hdr() });
      if (!r.ok) { m.className = 'msg err'; m.textContent = t('toast.error'); return; }
      const d = await r.json().catch(() => ({}));
      USERS = Array.isArray(d && d.users) ? d.users : [];
      renderUsers();
    }
    function renderUsers() {
      const box = $('userList');
      if (!USERS.length) { box.innerHTML = `<div class="empty">${esc(userQ ? t('pb.users.nomatch') : t('pb.users.none'))}</div>`; return; }
      box.innerHTML = `<div class="table-wrap"><table><thead><tr>
          <th>${t('pb.th.email')}</th><th>${t('pb.th.name')}</th><th>${t('th.active')}</th>
          <th>${t('pb.th.created')}</th><th>${t('pb.th.lastlogin')}</th><th>${t('pb.th.today')}</th><th></th>
        </tr></thead><tbody>` + USERS.map(u => {
          const used = u.used || {};
          // A dot on the Limits button so an account that already has an override is visible
          // without opening four modals to find it.
          const ov = Object.keys(u.limits || {}).length ? ' ●' : '';
          return `<tr>
            <td>${esc(u.email)}</td>
            <td>${esc(u.display_name || '—')}</td>
            <td><span class="pill ${u.is_active ? 'on' : 'off'}">${u.is_active ? '●' : '○'}</span></td>
            <td class="hint">${esc(fmtWhen(u.created_at))}</td>
            <td class="hint">${u.last_login_at ? esc(fmtWhen(u.last_login_at)) : esc(t('pb.never'))}</td>
            <td class="hint">${(used.analyses ?? 0)} · ${(used.tts ?? 0)} · ${(used.conversions ?? 0)}</td>
            <td class="inline">
              <button class="ghost" data-uact="active" data-id="${esc(u.id)}">${u.is_active ? t('pb.act.deactivate') : t('pb.act.activate')}</button>
              <button class="ghost" data-uact="limits" data-id="${esc(u.id)}">${t('pb.act.limits')}${ov}</button>
              <button class="ghost" data-uact="pw" data-id="${esc(u.id)}">${t('pb.act.resetpw')}</button>
              <button class="danger" data-uact="del" data-id="${esc(u.id)}">${t('btn.delete')}</button>
            </td></tr>`;
        }).join('') + `</tbody></table></div>`;
      box.querySelectorAll('button[data-uact]').forEach(b =>
        b.addEventListener('click', () => userAction(b.dataset.uact, b.dataset.id, b)));
    }
    $('reloadUsers').addEventListener('click', loadUsers);
    $('u_search').addEventListener('input', e => {
      userQ = e.target.value.trim();
      clearTimeout(userTimer); userTimer = setTimeout(loadUsers, 250);   // one request per pause, not per keystroke
    });

    async function putUser(id, body) {
      const m = $('userMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(`${API}/admin/users/${id}`, { method: 'PUT', headers: jhdr(), body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); CQ.toast(d.detail || t('toast.error'), 'err'); return null; }
      const i = USERS.findIndex(u => String(u.id) === String(id));
      if (i >= 0 && d && d.id) USERS[i] = d;
      renderUsers(); return d;
    }

    async function userAction(act, id, btn) {
      const u = findUser(id); if (!u) return;
      if (act === 'active') {
        btn.disabled = true;
        try { if (await putUser(id, { is_active: !u.is_active })) CQ.toast(t('pb.user.saved'), 'ok'); }
        finally { btn.disabled = false; }
        return;
      }
      if (act === 'limits') return userLimitsModal(u);
      if (act === 'pw') return resetUserPassword(u);
      if (act === 'del') {
        // The confirm says what SURVIVES the delete, because the surprising half of this
        // action is not what it removes — it is what it leaves behind.
        if (!(await CQ.confirm(t('pb.del.confirm').replace('{email}', () => u.email), { ok: t('btn.delete') }))) return;
        const r = await adminFetch(`${API}/admin/users/${id}`, { method: 'DELETE', headers: hdr() });
        if (!r.ok) { CQ.toast(t('toast.error'), 'err'); return; }
        CQ.toast(t('pb.del.done'), 'ok');
        USERS = USERS.filter(x => String(x.id) !== String(id)); renderUsers();
      }
    }

    // Per-account overrides. The PUT REPLACES the blob, so this form is the whole truth for
    // one account: a field left empty is not "unchanged", it is "use the tier's number", and
    // the placeholder shows which number that would be.
    function userLimitsModal(u) {
      const L = u.limits || {};
      const fields = OVERRIDE_KEYS.map(([key, labelKey]) =>
        `<div><label>${esc(t(labelKey))}</label>
           <input id="ul-${key}" type="number" min="0" value="${L[key] ?? ''}" placeholder="${esc(String(REG[key] ?? ''))}" /></div>`).join('');
      const bg = showModal(`<h3 style="margin-top:0">${esc(t('pb.lim.title'))}</h3>
        <p class="hint" style="margin-top:-6px">${esc(u.email)}</p>
        <div class="row">${fields}</div>
        <p class="hint">${esc(t('pb.lim.note'))}</p>
        <div class="msg" id="ulMsg"></div>
        <div class="actions"><button class="ghost" id="ulCancel">${esc(t('btn.cancel'))}</button>
          <button class="primary" id="ulSave">${esc(t('btn.save'))}</button></div>`);
      bg.querySelector('#ulCancel').addEventListener('click', () => bg.remove());
      bg.querySelector('#ulSave').addEventListener('click', async () => {
        const limits = {};
        for (const [key] of OVERRIDE_KEYS) {
          const raw = (bg.querySelector('#ul-' + key).value || '').trim();
          if (raw === '') continue;                    // no override — the tier decides
          const n = parseInt(raw, 10);
          if (!isFinite(n) || n < 0) { const m = bg.querySelector('#ulMsg'); m.className = 'msg err'; m.textContent = t('toast.error'); return; }
          limits[key] = n;
        }
        const b = bg.querySelector('#ulSave'); b.disabled = true;
        const d = await putUser(u.id, { limits });
        b.disabled = false;
        if (d) { CQ.toast(t('pb.lim.saved'), 'ok'); bg.remove(); }
        else { const m = bg.querySelector('#ulMsg'); m.className = 'msg err'; m.textContent = $('userMsg').textContent || t('toast.error'); }
      });
    }

    // The only password-recovery path a registered user has: there is no mail provider, so
    // the operator reads the new password out. It is shown once and never stored in the
    // clear — the modal says so, because an operator who closes it without copying has to
    // reset again, and they should learn that BEFORE they close it.
    async function resetUserPassword(u) {
      if (!(await CQ.confirm(t('pb.pw.confirm').replace('{email}', () => u.email), { ok: t('pb.act.resetpw') }))) return;
      const r = await adminFetch(`${API}/admin/users/${u.id}/reset-password`, { method: 'POST', headers: hdr() });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.password) { CQ.toast((d && d.detail) || t('toast.error'), 'err'); return; }
      const bg = showModal(`<h3 style="margin-top:0">${esc(t('pb.pw.title'))}</h3>
        <p class="hint" style="margin-top:-6px">${esc(u.email)}</p>
        <div class="inline" style="gap:10px; flex-wrap:wrap">
          <code id="pwVal" style="font-size:16px; user-select:all">${esc(d.password)}</code>
          <button class="ghost" id="pwCopy">${esc(t('pb.copy'))}</button>
        </div>
        <p class="hint">${esc(t('pb.pw.once'))}</p>
        <div class="actions"><button class="primary" id="pwClose">${esc(t('pb.close'))}</button></div>`);
      bg.querySelector('#pwCopy').addEventListener('click', async () => {
        const ok = await copyText(d.password);
        CQ.toast(ok ? t('pb.copied') : t('pb.copyfail'), ok ? 'ok' : 'err');
      });
      bg.querySelector('#pwClose').addEventListener('click', () => bg.remove());
    }

    // ---- Storage retention ----------------------------------------------------------------
    async function loadStorage() {
      const r = await adminFetch(`${API}/admin/storage`, { headers: hdr() }); if (!r.ok) return;
      const d = await r.json().catch(() => ({}));
      $('st_days').value = d.retention_days ?? 30;
    }
    $('saveStorage').addEventListener('click', async () => {
      const m = $('storageMsg'); m.className = 'msg'; m.textContent = '';
      // 0 is a real, storable answer here ("keep forever"), so it is parsed rather than
      // ||-defaulted into 30 the way a truthiness test would.
      const n = parseInt($('st_days').value, 10);
      if (!isFinite(n) || n < 0 || n > 3650) { m.className = 'msg err'; m.textContent = t('toast.error'); return; }
      const b = $('saveStorage'); b.disabled = true;
      try {
        const r = await adminFetch(`${API}/admin/storage`, { method: 'PUT', headers: jhdr(), body: JSON.stringify({ retention_days: n }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); return; }
        $('st_days').value = d.retention_days ?? n;
        m.className = 'msg ok'; m.textContent = t('toast.saved'); CQ.toast(t('toast.saved'), 'ok');
      } finally { b.disabled = false; }
    });

    // ---- Default rubric --------------------------------------------------------------------
    // The tenant portal's dimension editor, one level up. Deliberately without the AI import:
    // this rubric is the fallback every owner inherits, and it is written once by hand rather
    // than drafted from a customer's document.
    let drDims = [];
    function drRow(d, i) {
      return `<div class="sc-edit" data-i="${i}">
        <div class="inline" style="justify-content:space-between; margin-bottom:8px">
          <span class="sc-edit-num">${i + 1}</span>
          <button class="act danger dr-del" data-i="${i}" title="${esc(t('sc.remove'))}" aria-label="${esc(t('sc.remove'))}">🗑</button>
        </div>
        <div class="row">
          <div style="flex:2"><label>${esc(t('sc.dname'))}</label><input class="dr-name" value="${esc(d.name || '')}" placeholder="${esc(t('sc.dname.ph'))}" /></div>
          <div class="w-num"><label>${esc(t('sc.dweight'))}</label><input class="dr-weight" type="number" min="0" step="1" value="${d.weight ?? 0}" /></div>
        </div>
        <label>${esc(t('sc.ddesc'))}</label><input class="dr-desc" value="${esc(d.description || '')}" />
        <label>${esc(t('sc.dguide'))}</label><textarea class="dr-guide" style="min-height:54px" placeholder="${esc(t('sc.dguide.ph'))}">${esc(d.guidance || '')}</textarea>
      </div>`;
    }
    function drReadDom() {
      drDims = [...$('drDims').querySelectorAll('.sc-edit[data-i]')].map(el => ({
        key: (drDims[+el.dataset.i] || {}).key,
        name: el.querySelector('.dr-name').value.trim(),
        weight: parseFloat(el.querySelector('.dr-weight').value) || 0,
        description: el.querySelector('.dr-desc').value.trim(),
        guidance: el.querySelector('.dr-guide').value.trim(),
      }));
    }
    function drRenderDims() {
      const box = $('drDims');
      box.innerHTML = drDims.length ? drDims.map(drRow).join('') : `<div class="empty">${esc(t('sc.nodims'))}</div>`;
      box.querySelectorAll('.dr-del').forEach(b => b.addEventListener('click', () => { drReadDom(); drDims.splice(+b.dataset.i, 1); drRenderDims(); }));
      box.querySelectorAll('.dr-weight').forEach(inp => inp.addEventListener('input', drSum));
      drSum();
      CQ.autogrowBind(box, '.dr-guide');
    }
    function drSum() {
      let s = 0; $('drDims').querySelectorAll('.dr-weight').forEach(i => s += parseFloat(i.value) || 0);
      s = Math.round(s * 10) / 10;
      const ok = Math.abs(s - 100) <= 0.5;
      $('drSum').textContent = s; $('drSum').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      $('drSumFlag').textContent = ok ? '✓' : '✗'; $('drSumFlag').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      return ok;
    }
    // 'demo' and 'builtin' both mean "nothing is saved here yet" — the editor is showing a
    // proposal. Saying that in the pill is the difference between an operator editing the
    // default and an operator believing they already have one.
    const DR_SRC = { stored: ['pb.src.stored', 'ready'], demo: ['pb.src.demo', 'processing'], builtin: ['pb.src.builtin', 'notinkb'] };
    let drMeta = { source: '', updated_at: null, updated_by: '' };
    function drPaintSource() {
      const [key, cls] = DR_SRC[drMeta.source] || ['pb.src.builtin', 'notinkb'];
      $('drSource').className = 'pill ' + cls; $('drSource').textContent = t(key);
      $('drUpdated').textContent = drMeta.updated_at
        ? t('pb.defrubric.updated').replace('{when}', () => fmtWhen(drMeta.updated_at)).replace('{who}', () => drMeta.updated_by || '—')
        : '';
    }
    function drApply(d) {
      drDims = (Array.isArray(d.dimensions) ? d.dimensions : []).map(x => ({
        key: x.key, name: x.name || '', weight: x.weight || 0, description: x.description || '', guidance: x.guidance || '' }));
      $('drRubric').value = d.rubric || '';
      drMeta = { source: d.source || '', updated_at: d.updated_at || null, updated_by: d.updated_by || '' };
      drPaintSource(); drRenderDims();
    }
    async function loadDefaultRubric() {
      const m = $('drMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(`${API}/admin/default-rubric`, { headers: hdr() });
      if (!r.ok) { m.className = 'msg err'; m.textContent = t('toast.error'); return; }
      drApply(await r.json().catch(() => ({})));
    }
    $('drAdd').addEventListener('click', () => { drReadDom(); drDims.push({ name: '', weight: 0, description: '', guidance: '' }); drRenderDims(); });
    $('drNormalize').addEventListener('click', () => {
      drReadDom(); const n = drDims.length; if (!n) return;
      const total = drDims.reduce((a, d) => a + (d.weight || 0), 0);
      if (total <= 0) drDims.forEach(d => d.weight = Math.round(100 / n));
      else drDims.forEach(d => d.weight = Math.round((d.weight / total) * 100));
      drDims[n - 1].weight += 100 - drDims.reduce((a, d) => a + d.weight, 0);
      drRenderDims();
    });
    $('drSave').addEventListener('click', async () => {
      drReadDom();
      const m = $('drMsg'); m.className = 'msg'; m.textContent = '';
      if (!drDims.length) { m.className = 'msg err'; m.textContent = t('sc.needone'); return; }
      if (drDims.some(d => !d.name)) { m.className = 'msg err'; m.textContent = t('sc.needname'); return; }
      const total = Math.round(drDims.reduce((a, d) => a + (d.weight || 0), 0) * 10) / 10;
      if (Math.abs(total - 100) > 0.5) { m.className = 'msg err'; m.textContent = t('sc.mustbe100').replace('{total}', () => total); return; }
      const b = $('drSave'); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await adminFetch(`${API}/admin/default-rubric`, { method: 'PUT', headers: jhdr(),
          body: JSON.stringify({ dimensions: drDims, rubric: $('drRubric').value }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); return; }
        drApply(d);
        m.className = 'msg ok'; m.textContent = t('pb.defrubric.saved'); CQ.toast(t('pb.defrubric.saved'), 'ok');
      } finally { b.disabled = false; b.textContent = t('sc.save'); }
    });

    // ---- DEFAULT BOT: the baseline every workspace inherits ------------------------------
    // The portal's saveBot, field for field, so a knob cannot mean one thing to a customer and
    // another to the operator. Loaded on tab activation rather than in loadAll(): the route
    // ships with the bot, and a console that fails to open because one tab's endpoint is not
    // deployed yet would take the kill switch down with it.
    const DEFBOT = `${API}/admin/chat/default-config`;
    const DB_LANGS = ['en', 'ka', 'ru'];
    const DB_CAPS = [['db_cap_tenant', 'tenant_per_minute'], ['db_cap_enduser', 'enduser_per_hour'],
                     ['db_cap_answer_tenant', 'answer_tenant_per_minute'], ['db_cap_answer_enduser', 'answer_enduser_per_hour']];
    // 'builtin' means nothing is saved here yet — the form is showing the code's own defaults.
    const DB_SRC = { stored: ['pb.defbot.source.stored', 'ready'], builtin: ['pb.defbot.source.builtin', 'notinkb'] };
    let dbCfg = null, dbMeta = { source: '', updated_at: null, updated_by: '' };

    function dbPaintSource() {
      const [key, cls] = DB_SRC[dbMeta.source] || DB_SRC.builtin;
      $('dbSource').className = 'pill ' + cls; $('dbSource').textContent = t(key);
      $('dbUpdated').textContent = dbMeta.updated_at
        ? t('pb.defbot.updated').replace('{when}', () => fmtWhen(dbMeta.updated_at)).replace('{who}', () => dbMeta.updated_by || '—')
        : '';
    }
    function fillDefBot(cfg) {
      dbCfg = (cfg && typeof cfg === 'object') ? cfg : {};
      const obj = v => (v && typeof v === 'object') ? v : {};
      const s = obj(dbCfg.settings), g = obj(dbCfg.greeting), rf = obj(dbCfg.refusal_copy);
      const disc = obj(s.disclosure), limits = obj(s.limits);
      const langs = Array.isArray(dbCfg.languages) && dbCfg.languages.length ? dbCfg.languages : DB_LANGS;
      $('db_persona').value = dbCfg.persona || '';
      DB_LANGS.forEach(l => { $('db_greet_' + l).value = g[l] || ''; $('db_ref_' + l).value = rf[l] || ''; $('db_disc_' + l).value = disc[l] || ''; });
      document.querySelectorAll('.db-lang').forEach(cb => { cb.checked = langs.includes(cb.dataset.lang); });
      const kw = s.escalation_keywords;
      $('db_escalation').value = Array.isArray(kw) ? kw.join(', ') : (typeof kw === 'string' ? kw : '');
      $('db_minscore').value = dbCfg.min_score ?? 0.35;
      $('db_minhits').value  = dbCfg.min_hits ?? 1;
      $('db_topk').value     = dbCfg.top_k ?? 8;
      $('db_sugg').value     = dbCfg.suggestion_count ?? 2;
      $('db_maxchars').value = s.max_reply_chars ?? 1200;
      DB_CAPS.forEach(([id, k]) => { $(id).value = limits[k] ?? ''; });
      // An unknown mode falls back to disclosing, not to silence: the safe direction.
      $('db_disclosure_mode').value = ['first', 'always', 'off'].includes(s.disclosure_mode) ? s.disclosure_mode : 'first';
      CQ.syncSelect($('db_disclosure_mode'));
      // Never `??`-default this to true: the safe value is false and a missing key means false.
      $('db_general').checked = s.allow_general_knowledge === true;
      $('db_handoff').checked = s.handoff_summary !== false;
      dbMeta = { source: dbCfg.source || '', updated_at: dbCfg.updated_at || null, updated_by: dbCfg.updated_by || '' };
      dbPaintSource();
    }
    async function loadDefBot() {
      const m = $('dbMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(DEFBOT, { headers: hdr() });
      // 404/405 is the server without this route, not a broken console — say which.
      if (!r.ok) { m.className = 'msg err'; m.textContent = (r.status === 404 || r.status === 405) ? t('bot.unavailable') : t('toast.error'); return; }
      fillDefBot(await r.json().catch(() => ({})));
    }

    // Turning general knowledge ON is a deliberate risk decision — here it is one taken for
    // every workspace that never chose otherwise — so it costs a confirmation. Turning it OFF
    // never does: the safe direction is always one click.
    $('db_general').addEventListener('change', async () => {
      if (!$('db_general').checked) return;
      $('db_general').checked = false;
      if (await CQ.confirm(t('bot.general.confirm'), { ok: t('bot.general.on') })) $('db_general').checked = true;
    });

    $('dbSave').addEventListener('click', async () => {
      const m = $('dbMsg'); m.className = 'msg'; m.textContent = '';
      const langs = [...document.querySelectorAll('.db-lang')].filter(cb => cb.checked).map(cb => cb.dataset.lang);
      if (!langs.length) { m.className = 'msg err'; m.textContent = t('bot.languages.pickone'); return; }
      // Only languages with text are sent: an empty string would shadow the built-in wording
      // with silence for every workspace inheriting this, which is never what an empty box means.
      const greeting = {}, refusal = {}, disclosure = {};
      DB_LANGS.forEach(l => {
        const g = $('db_greet_' + l).value.trim(), rf = $('db_ref_' + l).value.trim(), dc = $('db_disc_' + l).value.trim();
        if (g) greeting[l] = g; if (rf) refusal[l] = rf; if (dc) disclosure[l] = dc;
      });
      const num = (id, dflt) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : dflt; };
      const optInt = id => { const v = parseInt($(id).value, 10); return Number.isFinite(v) ? v : undefined; };
      const prev = (dbCfg && typeof dbCfg.settings === 'object' && dbCfg.settings) ? dbCfg.settings : {};
      // Rebuilt rather than spread from prev: a cap the operator cleared must go back to the
      // built-in default, not survive as the number it used to be.
      const limits = {};
      DB_CAPS.forEach(([id, k]) => { const v = optInt(id); if (v !== undefined) limits[k] = v; });
      const body = {
        persona: $('db_persona').value.trim() || null,
        greeting, refusal_copy: refusal, languages: langs,
        canned: Array.isArray(dbCfg && dbCfg.canned) ? dbCfg.canned : [],
        settings: { ...prev,                                   // unknown knobs survive a save
          min_score: num('db_minscore', 0.35), min_hits: num('db_minhits', 1),
          top_k: num('db_topk', 8), suggestion_count: num('db_sugg', 2),
          max_reply_chars: num('db_maxchars', 1200),
          escalation_keywords: $('db_escalation').value.split(',').map(s => s.trim()).filter(Boolean),
          allow_general_knowledge: $('db_general').checked,
          handoff_summary: $('db_handoff').checked,
          disclosure_mode: $('db_disclosure_mode').value,
          disclosure,
          limits },
      };
      const b = $('dbSave'); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await adminFetch(DEFBOT, { method: 'PUT', headers: jhdr(), body: JSON.stringify(body) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          // A 422 carries pydantic's list, which stringifies to "[object Object]"; only a
          // real sentence is worth showing verbatim.
          const why = typeof d.detail === 'string' ? d.detail : t('toast.error');
          m.className = 'msg err'; m.textContent = why; CQ.toast(why, 'err'); return;
        }
        fillDefBot(d);
        m.className = 'msg ok'; m.textContent = t('pb.defbot.saved'); CQ.toast(t('pb.defbot.saved'), 'ok');
      } catch (e) {
        if (e.message === 'unauthorized') throw e;   // adminFetch is already redirecting
