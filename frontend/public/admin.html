<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CommuniQ — Console</title>
  <script>document.documentElement.setAttribute('data-theme', (function(){try{return localStorage.getItem('cq_theme')||'dark'}catch(e){return 'dark'}})());</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="icon" href="favicon.png" />
  <script src="brand.js"></script>
</head>
<body>
  <div id="cq-header"></div>
  <main class="console">
    <div id="app" class="hidden">
      <div class="tabs">
        <div class="tab active" data-tab="tenants" data-i18n="adm.tenants"></div>
        <div class="tab" data-tab="users" data-i18n="pb.users"></div>
        <div class="tab" data-tab="embeddings" data-i18n="adm.embeddings"></div>
        <div class="tab" data-tab="anon" data-i18n="adm.anon"></div>
        <div class="tab" data-tab="storage" data-i18n="pb.storage"></div>
        <div class="tab" data-tab="defrubric" data-i18n="pb.defrubric"></div>
        <div class="tab" data-tab="integrations" data-i18n="adm.integrations"></div>
        <div class="tab" data-tab="voices" data-i18n="adm.voices"></div>
        <div class="tab" data-tab="bot" data-i18n="adm.bot"></div>
      </div>

      <!-- TENANTS -->
      <section class="panel active" id="panel-tenants">
        <div class="card">
          <h3 data-i18n="adm.createtenant"></h3>
          <div class="row">
            <div><label data-i18n="f.name"></label><input id="t_name" placeholder="Acme Bank" /></div>
            <div><label data-i18n="f.industry"></label><input id="t_industry" placeholder="banking" /></div>
            <div><label data-i18n="f.region"></label><input id="t_region" placeholder="ge" /></div>
          </div>
          <div class="actions"><button class="primary" id="createTenantBtn" data-i18n="btn.create"></button></div>
          <div class="msg" id="createTenantMsg"></div>
        </div>
        <div class="card">
          <div class="inline" style="justify-content:space-between"><h3 style="margin:0" data-i18n="adm.tenants"></h3>
            <button class="ghost" id="reloadTenants" data-i18n="btn.refresh"></button></div>
          <div id="tenantList" style="margin-top:12px"></div>
        </div>
      </section>

      <!-- REGISTERED ACCOUNTS -->
      <!-- Two cards, in the order an operator needs them: the tier first (what a new account
           gets by default), then the accounts themselves. There is no mail provider, so the
           reset button here is the ONLY password-recovery path a registered user has. -->
      <section class="panel" id="panel-users">
        <div class="card">
          <h3 data-i18n="pb.reg.heading"></h3>
          <p class="hint" data-i18n="pb.reg.desc"></p>
          <!-- "Sign-ups open" is NOT a master switch over existing accounts: the tip says so,
               because the obvious reading of a checkbox called "enabled" is the wrong one and
               an operator reaching for it at 3am is trying to stop new sign-ups, not to lock
               out everyone who already has an account. -->
          <label class="inline" style="gap:8px"><input type="checkbox" id="r_enabled" /> <span data-i18n="pb.reg.signups"></span><button class="tip" data-tip-i18n="pb.reg.signups.hint" style="margin-left:0"></button></label>
          <div class="row" style="margin-top:12px">
            <div><label data-i18n="adm.maxanalyses"></label><input id="r_analyses" type="number" min="0" /></div>
            <div><label data-i18n="adm.maxmb"></label><input id="r_mb" type="number" min="0" /></div>
            <div><label data-i18n="adm.maxtts"></label><input id="r_tts" type="number" min="0" /></div>
            <div><label data-i18n="pb.reg.maxconv"></label><input id="r_conv" type="number" min="0" /></div>
          </div>
          <h4 data-i18n="adm.features"></h4>
          <div class="inline" style="gap:18px; flex-wrap:wrap; row-gap:8px">
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_analyze" /> <span data-i18n="feat.analyze"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_tts" /> <span data-i18n="feat.tts"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_convert" /> <span data-i18n="pb.feat.convert"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_score" /> <span data-i18n="pb.feat.score"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_semantic" /> <span data-i18n="pb.feat.semantic"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="rf_summarise" /> <span data-i18n="pb.feat.summarise"></span></label>
          </div>
          <div class="actions"><button class="primary" id="saveReg" data-i18n="btn.savelimits"></button></div>
          <div class="msg" id="regMsg"></div>
        </div>
        <div class="card">
          <div class="inline" style="justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; row-gap:8px">
            <h3 style="margin:0" data-i18n="pb.users.heading"></h3>
            <div class="inline" style="gap:8px">
              <input id="u_search" data-i18n-ph="pb.users.search" style="width:220px" />
              <button class="ghost" id="reloadUsers" data-i18n="btn.refresh"></button>
            </div>
          </div>
          <p class="hint" data-i18n="pb.users.legend"></p>
          <div id="userList" style="margin-top:6px"></div>
          <div class="msg" id="userMsg"></div>
        </div>
      </section>

      <!-- EMBEDDINGS -->
      <section class="panel" id="panel-embeddings">
        <div class="card">
          <h3 data-i18n="adm.embprov"></h3>
          <div class="row">
            <div><label data-i18n="f.provider"></label>
              <select id="e_provider"><option value="tei">tei (self-hosted BGE-M3)</option><option value="openai">openai</option></select></div>
            <!-- The label text sits in its own span: applyI18n rewrites a [data-i18n]
                 element's whole textContent, so an ⓘ appended to the label itself would
                 vanish on the first language switch. Same shape everywhere below. -->
            <div><label><span data-i18n="f.dimension"></span><button class="tip" data-tip-i18n="adm.embnote"></button></label><input id="e_dim" type="number" /></div>
          </div>
          <label data-i18n="f.model"></label><input id="e_model" placeholder="BAAI/bge-m3" />
          <label data-i18n="f.baseurl"></label><input id="e_base_url" placeholder="http://embeddings:80" />
          <label data-i18n="f.openaikey"></label><input id="e_api_key" type="password" />
          <div class="hint" id="e_hint"></div>
          <div class="actions">
            <button class="primary" id="saveEmb" data-i18n="btn.save"></button>
            <button class="ghost" id="testEmb" data-i18n="btn.test"></button>
          </div>
          <div id="embTest"></div><div class="msg" id="embMsg"></div>
        </div>
      </section>

      <!-- ANONYMOUS -->
      <section class="panel" id="panel-anon">
        <div class="card">
          <h3 data-i18n="adm.anonheading"></h3>
          <label class="inline" style="gap:8px"><input type="checkbox" id="a_enabled" /> <span data-i18n="adm.allowanon"></span></label>
          <div class="row" style="margin-top:12px">
            <div><label data-i18n="adm.maxanalyses"></label><input id="a_analyses" type="number" /></div>
            <div><label data-i18n="adm.maxmb"></label><input id="a_mb" type="number" /></div>
            <div><label data-i18n="adm.maxtts"></label><input id="a_tts" type="number" /></div>
          </div>
          <!-- Retention used to live here as a fourth number. It governs EVERY stored
               recording now, not just an anonymous visitor's, so it moved to its own tab
               rather than staying under a heading that understates what it deletes. The
               line stays because an operator who knew where the field was needs to be told
               where it went, not left to conclude the setting was dropped. -->
          <p class="hint" data-i18n="pb.storage.moved"></p>
          <h4 data-i18n="adm.features"></h4>
          <div class="inline" style="gap:18px">
            <label class="inline" style="gap:6px"><input type="checkbox" id="f_analyze" /> <span data-i18n="feat.analyze"></span></label>
            <label class="inline" style="gap:6px"><input type="checkbox" id="f_tts" /> <span data-i18n="feat.tts"></span></label>
          </div>
          <div class="actions"><button class="primary" id="saveAnon" data-i18n="btn.savelimits"></button></div>
          <div class="msg" id="anonMsg"></div>
        </div>
        <div class="card">
          <h3 data-i18n="adm.sentiment.heading"></h3>
          <label class="inline" style="gap:8px"><input type="checkbox" id="sn_enabled" /> <span data-i18n="sn.enabled"></span></label>
          <label data-i18n="sn.guidance"></label>
          <textarea id="sn_guidance" data-i18n-ph="sn.guidance.ph" style="min-height:80px"></textarea>
          <div class="actions"><button class="primary" id="saveSentiment" data-i18n="sn.save"></button></div>
          <div class="msg" id="sentimentMsg"></div>
        </div>
      </section>

      <!-- STORAGE -->
      <!-- One field, its own tab. It is here rather than on Anonymous because the number
           now decides when a paying tenant's call recording stops being replayable, and a
           control that dangerous should not be read as "settings for guests". -->
      <section class="panel" id="panel-storage">
        <div class="card">
          <h3 data-i18n="pb.storage.heading"></h3>
          <p class="hint" data-i18n="pb.storage.desc"></p>
          <div class="row" style="margin-top:6px">
            <div class="w-num"><label><span data-i18n="pb.storage.days"></span><button class="tip" data-tip-i18n="pb.storage.hint"></button></label>
              <input id="st_days" type="number" min="0" max="3650" /></div>
          </div>
          <div class="actions"><button class="primary" id="saveStorage" data-i18n="btn.save"></button></div>
          <div class="msg" id="storageMsg"></div>
        </div>
      </section>

      <!-- DEFAULT RUBRIC -->
      <!-- The same editor as the tenant portal's Rubric panel, one level up: this is what
           every owner WITHOUT a rubric of their own is scored against. The source pill is
           the important half — until an operator saves here, what is on screen is only a
           proposal (the demo tenant's rubric, or the built-in starter). -->
      <section class="panel" id="panel-defrubric">
        <div class="card">
          <div class="inline" style="justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; row-gap:6px">
            <h3 style="margin:0" data-i18n="pb.defrubric.heading"></h3>
            <span class="inline" style="gap:8px"><span class="pill" id="drSource">—</span><span class="hint" id="drUpdated"></span></span>
          </div>
          <p class="hint" data-i18n="pb.defrubric.desc"></p>
          <div id="drDims"></div>
          <div class="actions" style="justify-content:space-between; align-items:center">
            <div class="inline" style="gap:8px">
              <button class="ghost" id="drAdd" data-i18n="sc.adddim"></button>
              <button class="ghost" id="drNormalize" data-i18n="sc.normalize"></button>
            </div>
            <span class="hint"><span data-i18n="sc.sum"></span>: <b id="drSum">0</b>% <span id="drSumFlag"></span></span>
          </div>
          <hr class="sep" />
          <label data-i18n="sc.rubric"></label>
          <textarea id="drRubric" style="min-height:80px" data-i18n-ph="sc.rubric.ph"></textarea>
          <div class="actions"><button class="primary" id="drSave" data-i18n="sc.save"></button></div>
          <div class="msg" id="drMsg"></div>
        </div>
      </section>

      <!-- INTEGRATIONS -->
      <section class="panel" id="panel-integrations">
        <div class="card">
          <h3 data-i18n="adm.intkeys"></h3>
          <label data-i18n="f.anthropic"></label><input type="password" id="anthropic_api_key" placeholder="sk-ant-…" />
          <div class="hint" id="anthropicHint"></div>
          <label data-i18n="f.eleven"></label><input type="password" id="elevenlabs_api_key" />
          <div class="hint" id="elevenlabsHint"></div>
        </div>
        <div class="card">
          <h3 data-i18n="adm.models"></h3>
          <div class="row">
            <div><label data-i18n="f.claudemodel"></label>
              <select id="llm_model"><option>claude-opus-4-8</option><option>claude-sonnet-5</option><option>claude-haiku-4-5</option></select></div>
            <div><label data-i18n="f.sttmodel"></label><input id="stt_model" placeholder="scribe_v1" /></div>
          </div>
          <div class="row">
            <div><label data-i18n="f.ttsmodel"></label><input id="tts_model" placeholder="eleven_multilingual_v2" /></div>
            <div><label data-i18n="f.voiceid"></label>
              <div class="inline"><input id="tts_voice_id" style="flex:1" /><button class="ghost" id="voicePreviewBtn" type="button">▶</button></div>
              <div id="voicePreviewAudio"></div>
            </div>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="adm.instructions"></h3>
          <textarea id="analysis_instructions"></textarea>
          <!-- The ⓘ rides in the actions row rather than on a label: what it warns about
               (every click really transcribes and really synthesises, so it costs
               ElevenLabs credit) belongs to the two Test buttons, not to a field. -->
          <div class="actions"><button class="primary" id="saveInt" data-i18n="btn.savesettings"></button><button class="ghost" id="testInt" data-i18n="btn.testconn"></button><button class="ghost" id="testDeep" data-i18n="btn.testdeep"></button><button class="tip" data-tip-i18n="adm.testnote" data-tip-for="testInt testDeep" style="align-self:center"></button></div>
          <div class="msg" id="intMsg"></div><div id="intTest"></div>
        </div>
      </section>

      <!-- VOICES -->
      <section class="panel" id="panel-voices">
        <div class="card">
          <h3 data-i18n="adm.voicevis"></h3>
          <!-- margin-left:0 so the ⓘ sits on the row's own 8px gap instead of adding its
               default 6px to it. A <button> inside a <label> does not activate the label,
               so this cannot toggle the checkbox by accident. -->
          <label class="inline" style="gap:8px"><input type="checkbox" id="v_restrict" /><span data-i18n="f.restrictvoices"></span><button class="tip" data-tip-i18n="v.hint" style="margin-left:0"></button></label>
          <div class="row" style="margin-top:10px">
            <div style="flex:2"><input id="v_search" data-i18n-ph="v.search" /></div>
            <div style="flex:0; align-self:center" class="hint"><b id="v_count">0</b> <span data-i18n="v.selected"></span></div>
          </div>
          <!-- one shared player for all previews (no second play bar) -->
          <div id="voicesPlayer" style="margin-top:8px"></div>
          <div id="voicesList" style="margin-top:8px; max-height:52vh; overflow:auto"></div>
          <div class="actions"><button class="primary" id="saveVoices" data-i18n="btn.savesettings"></button></div>
          <div class="msg" id="voicesMsg"></div>
        </div>
      </section>
      <!-- BOT CONTROL — the 3am brake. State first, one click to act, no settings blob. -->
      <section class="panel" id="panel-bot">
        <!-- The bot has not launched: tenants see a "Coming soon" tab. The brake below stays
             visible for the operator (it is a safety control), with this banner for context. -->
        <div class="card">
          <div class="soon-card" style="border:none; padding:26px 20px">
            <span class="soon-emoji">🤖</span>
            <h3 data-i18n="bot.soon.title"></h3>
            <p data-i18n="bot.soon.desc.admin"></p>
          </div>
        </div>
        <div class="card">
          <div class="row" style="justify-content:space-between; align-items:flex-start">
            <div style="flex:1">
              <h3 style="margin:0"><span data-i18n="kill.heading"></span><button class="tip" data-tip-i18n="kill.desc"></button></h3>
            </div>
            <div class="inline" style="flex:0; gap:8px">
              <span class="pill" id="killGlobalPill">—</span>
              <button class="ghost" id="reloadKill" data-i18n="btn.refresh"></button>
            </div>
          </div>
          <div class="actions"><button class="danger" id="killGlobalBtn" data-i18n="kill.global"></button></div>
          <div class="msg" id="killMsg"></div>
        </div>
        <div class="card">
          <h3 data-i18n="kill.tenants"></h3>
          <div id="killList" style="margin-top:12px"></div>
        </div>
      </section>
    </div>
  </main>
  <div id="modalHost"></div>

  <script>
    const API = CQ.API, t = CQ.t;
    CQ.mountHeader({ tag: 'Console' });
    let TOKEN = sessionStorage.getItem('cq_admin_token') || '';
    const $ = id => document.getElementById(id);
    const hdr = (extra={}) => ({ 'X-Admin-Token': TOKEN, ...extra });
    const jhdr = () => hdr({ 'Content-Type': 'application/json' });
    const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    $('logout').addEventListener('click', e => { e.preventDefault();
      sessionStorage.removeItem('cq_admin_token'); sessionStorage.removeItem('cq_tenant_token');
      location.replace('tenant.html'); });
    // Central 401 interception: an expired admin token lands on the sign-in page instead of
    // silently no-op'ing every Refresh and turning saves into 'Save failed'.
    async function adminFetch(url, init) {
      const r = await fetch(url, init);
      if (r.status === 401) { sessionStorage.removeItem('cq_admin_token'); location.replace('tenant.html?next=admin.html'); throw new Error('unauthorized'); }
      return r;
    }
    CQ.enhanceSelects();

    document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      tb.classList.add('active'); $('panel-' + tb.dataset.tab).classList.add('active');
      if (tb.dataset.tab === 'bot') loadKill();
    }));
    document.addEventListener('cq:lang', () => { if ($('app').classList.contains('hidden')) return;
      loadTenants();
      // The kill-switch pills/buttons are built in JS, so data-i18n cannot retranslate them.
      if ($('panel-bot').classList.contains('active')) { renderKillGlobal(true); renderKillTenants(); }
      // Same reason for these two: their rows and their source pill are painted in JS, so
      // data-i18n cannot reach them. Repainted whether or not their panel is on screen —
      // nothing re-renders them on tab activation, so a table left stale while hidden would
      // still be stale in the old language when the operator finally opens it.
      renderUsers();
      // Read the editor back first: a language switch mid-edit must not throw away the
      // dimensions someone has typed but not saved.
      if ($('drDims').querySelector('.sc-edit')) drReadDom();
      drRenderDims(); drPaintSource(); });

    async function loadAll() { await Promise.all([loadIntegrations(), loadEmbeddings(), loadAnon(), loadSentimentSettings(),
      loadTenants(), loadVoices(), loadRegistered(), loadUsers(), loadStorage(), loadDefaultRubric()]); }

    // Login happens on the unified sign-in page; this console is token-gated only.
    let settingsLoaded = false;   // guards saveInt: never PUT fields that never loaded
    async function boot() {
      if (!TOKEN) { location.replace('tenant.html?next=admin.html'); return; }
      try {
        const r = await fetch(`${API}/admin/settings`, { headers: hdr() });
        if (r.status === 401) { sessionStorage.removeItem('cq_admin_token'); location.replace('tenant.html?next=admin.html'); return; }
        if (!r.ok) throw new Error('http ' + r.status);
      } catch {
        // API/proxy down: a visible retry state, not a permanently blank page.
        const main = document.querySelector('main');
        const box = document.createElement('div');
        box.className = 'card'; box.style.textAlign = 'center';
        box.innerHTML = `<p>${t('err.unavailable')}</p>`;
        const rb = document.createElement('button'); rb.className = 'primary'; rb.textContent = t('btn.retry');
        rb.addEventListener('click', () => location.reload());
        box.appendChild(rb); main.prepend(box);
        return;
      }
      $('app').classList.remove('hidden');
      await loadAll().catch(() => {});
    }

    // integrations
    const INT_FIELDS = ['llm_model','stt_model','tts_model','tts_voice_id','analysis_instructions'];
    async function loadIntegrations() {
      const r = await adminFetch(`${API}/admin/settings`, { headers: hdr() }); if (!r.ok) return; const d = await r.json();
      INT_FIELDS.forEach(f => { if ($(f)) $(f).value = d[f] ?? ''; }); CQ.syncSelect($('llm_model'));
      settingsLoaded = true;   // fields are populated — Save is safe from here on
      $('anthropicHint').textContent = d.anthropic_api_key_set ? `Key set (${d.anthropic_api_key_hint}).` : 'No key set.';
      $('elevenlabsHint').textContent = d.elevenlabs_api_key_set ? `Key set (${d.elevenlabs_api_key_hint}).` : 'No key set.';
    }
    $('saveInt').addEventListener('click', async () => {
      const m = $('intMsg'); m.className='msg'; m.textContent='';
      if (!settingsLoaded) { m.className='msg err'; m.textContent = t('err.unavailable'); return; }
      const patch = {}; INT_FIELDS.forEach(f => patch[f] = $(f).value);
      if ($('anthropic_api_key').value.trim()) patch.anthropic_api_key = $('anthropic_api_key').value.trim();
      if ($('elevenlabs_api_key').value.trim()) patch.elevenlabs_api_key = $('elevenlabs_api_key').value.trim();
      const r = await adminFetch(`${API}/admin/settings`, { method:'PUT', headers: jhdr(), body: JSON.stringify(patch) });
      if (r.ok) { $('anthropic_api_key').value=''; $('elevenlabs_api_key').value=''; await loadIntegrations();
        // a new ElevenLabs key may mean a different account -> refresh the voice list + preview map
        voicesFetched = false; voiceMap = {}; await loadVoices();
        m.className='msg ok'; m.textContent=t('toast.saved'); CQ.toast(t('toast.saved'),'ok'); }
      else { const d = await r.json().catch(()=>({})); m.className='msg err'; m.textContent = d.detail || t('toast.error'); }
    });
    // One row per CAPABILITY, not per vendor. A single green "ElevenLabs" row used to hide a
    // key that could list voices but not transcribe — the capabilities carry separate
    // permissions, so each is probed and reported on its own line.
    const CAP_LABEL = { database:'cap.database', ffmpeg:'cap.ffmpeg', elevenlabs_voices:'cap.voices',
      elevenlabs_stt:'cap.stt', elevenlabs_tts:'cap.tts', elevenlabs_tts_ka:'cap.ttska',
      embeddings:'cap.embeddings', claude_analysis:'cap.claude', claude_factcheck:'cap.factcheck',
      claude_scoring:'cap.scoring' };
    const CAP_ICON = { ok:'✅', warn:'⚠️', fail:'❌' };
    async function runTest(deep, btn) {
      const box = $('intTest'), prev = btn.textContent;
      box.innerHTML=''; $('testInt').disabled=true; $('testDeep').disabled=true;
      btn.innerHTML='<span class="spinner"></span>'+t('btn.test')+'…';
      try {
        const r = await adminFetch(`${API}/admin/test${deep?'?deep=true':''}`, { method:'POST', headers: hdr() });
        const d = await r.json();
        const order = Array.isArray(d.order) ? d.order : Object.keys(CAP_LABEL).filter(k => d[k]);
        box.innerHTML = order.map(k => {
          const x = d[k] || {}, lvl = x.level || (x.ok ? 'ok' : 'fail');
          // A missing permission is the one failure the operator can fix in 30 seconds —
          // name the scope instead of leaving it buried in the message.
          const hint = x.code === 'missing_permission' && x.scope

    function showModal(inner, max = '520px') {

    // navigator.clipboard needs a secure context, and this app is served over plain HTTP on
    // the server. The textarea fallback is not decoration — it is the path that actually runs
    // in production, and a password the operator cannot copy is a password they retype wrong.
    //
    // The branch order is load-bearing: execCommand only works INSIDE the click's user
    // gesture, and an `await` spends that gesture. So the insecure-origin case takes the
    // synchronous path FIRST, before this function has awaited anything, instead of
    // discovering it needs the fallback after the async clipboard has already rejected.
    function copyFallback(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      } catch { return false; }
    }
    async function copyText(text) {
      let pending = null;
      try { if (navigator.clipboard && window.isSecureContext) pending = navigator.clipboard.writeText(text); } catch {}
      if (!pending) return copyFallback(text);          // still inside the gesture
      try { await pending; return true; } catch {}
      return copyFallback(text);                        // a denied permission on a secure origin
    }

        const d = await r.json().catch(() => ({}));
        if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); return; }
        REG = d || REG; m.className = 'msg ok'; m.textContent = t('toast.saved'); CQ.toast(t('toast.saved'), 'ok');
      } finally { b.disabled = false; }
    });

    // ---- Registered accounts ---------------------------------------------------------------
    // The table is the operator's only view of self-service users, so it carries the four facts
    // a support call starts from: is the account on, when was it made, when did they last get
    // in, and what have they spent today.
    let USERS = [], userQ = '', userTimer = 0;
    const OVERRIDE_KEYS = [['max_analyses_per_day','adm.maxanalyses'], ['max_audio_mb','adm.maxmb'],
                           ['max_tts_per_day','adm.maxtts'], ['max_conversions_per_day','pb.reg.maxconv']];
    const findUser = id => USERS.find(u => String(u.id) === String(id));

    async function loadUsers() {
      const m = $('userMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(`${API}/admin/users?limit=200&q=${encodeURIComponent(userQ)}`, { headers: hdr() });
      if (!r.ok) { m.className = 'msg err'; m.textContent = t('toast.error'); return; }
      const d = await r.json().catch(() => ({}));
      USERS = Array.isArray(d && d.users) ? d.users : [];
      renderUsers();
    }
    function renderUsers() {
      const box = $('userList');
      if (!USERS.length) { box.innerHTML = `<div class="empty">${esc(userQ ? t('pb.users.nomatch') : t('pb.users.none'))}</div>`; return; }
      box.innerHTML = `<div class="table-wrap"><table><thead><tr>
          <th>${t('pb.th.email')}</th><th>${t('pb.th.name')}</th><th>${t('th.active')}</th>
          <th>${t('pb.th.created')}</th><th>${t('pb.th.lastlogin')}</th><th>${t('pb.th.today')}</th><th></th>
        </tr></thead><tbody>` + USERS.map(u => {
          const used = u.used || {};
          // A dot on the Limits button so an account that already has an override is visible
          // without opening four modals to find it.
          const ov = Object.keys(u.limits || {}).length ? ' ●' : '';
          return `<tr>
            <td>${esc(u.email)}</td>
            <td>${esc(u.display_name || '—')}</td>
            <td><span class="pill ${u.is_active ? 'on' : 'off'}">${u.is_active ? '●' : '○'}</span></td>
            <td class="hint">${esc(fmtWhen(u.created_at))}</td>
            <td class="hint">${u.last_login_at ? esc(fmtWhen(u.last_login_at)) : esc(t('pb.never'))}</td>
            <td class="hint">${(used.analyses ?? 0)} · ${(used.tts ?? 0)} · ${(used.conversions ?? 0)}</td>
            <td class="inline">
              <button class="ghost" data-uact="active" data-id="${esc(u.id)}">${u.is_active ? t('pb.act.deactivate') : t('pb.act.activate')}</button>
              <button class="ghost" data-uact="limits" data-id="${esc(u.id)}">${t('pb.act.limits')}${ov}</button>
              <button class="ghost" data-uact="pw" data-id="${esc(u.id)}">${t('pb.act.resetpw')}</button>
              <button class="danger" data-uact="del" data-id="${esc(u.id)}">${t('btn.delete')}</button>
            </td></tr>`;
        }).join('') + `</tbody></table></div>`;
      box.querySelectorAll('button[data-uact]').forEach(b =>
        b.addEventListener('click', () => userAction(b.dataset.uact, b.dataset.id, b)));
    }
    $('reloadUsers').addEventListener('click', loadUsers);
    $('u_search').addEventListener('input', e => {
      userQ = e.target.value.trim();
      clearTimeout(userTimer); userTimer = setTimeout(loadUsers, 250);   // one request per pause, not per keystroke
    });

    async function putUser(id, body) {
      const m = $('userMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(`${API}/admin/users/${id}`, { method: 'PUT', headers: jhdr(), body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); CQ.toast(d.detail || t('toast.error'), 'err'); return null; }
      const i = USERS.findIndex(u => String(u.id) === String(id));
      if (i >= 0 && d && d.id) USERS[i] = d;
      renderUsers(); return d;
    }

    async function userAction(act, id, btn) {
      const u = findUser(id); if (!u) return;
      if (act === 'active') {
        btn.disabled = true;
        try { if (await putUser(id, { is_active: !u.is_active })) CQ.toast(t('pb.user.saved'), 'ok'); }
        finally { btn.disabled = false; }
        return;
      }
      if (act === 'limits') return userLimitsModal(u);
      if (act === 'pw') return resetUserPassword(u);
      if (act === 'del') {
        // The confirm says what SURVIVES the delete, because the surprising half of this
        // action is not what it removes — it is what it leaves behind.
        if (!(await CQ.confirm(t('pb.del.confirm').replace('{email}', () => u.email), { ok: t('btn.delete') }))) return;
        const r = await adminFetch(`${API}/admin/users/${id}`, { method: 'DELETE', headers: hdr() });
        if (!r.ok) { CQ.toast(t('toast.error'), 'err'); return; }
        CQ.toast(t('pb.del.done'), 'ok');
        USERS = USERS.filter(x => String(x.id) !== String(id)); renderUsers();
      }
    }

    // Per-account overrides. The PUT REPLACES the blob, so this form is the whole truth for
    // one account: a field left empty is not "unchanged", it is "use the tier's number", and
    // the placeholder shows which number that would be.
    function userLimitsModal(u) {
      const L = u.limits || {};
      const fields = OVERRIDE_KEYS.map(([key, labelKey]) =>
        `<div><label>${esc(t(labelKey))}</label>
           <input id="ul-${key}" type="number" min="0" value="${L[key] ?? ''}" placeholder="${esc(String(REG[key] ?? ''))}" /></div>`).join('');
      const bg = showModal(`<h3 style="margin-top:0">${esc(t('pb.lim.title'))}</h3>
        <p class="hint" style="margin-top:-6px">${esc(u.email)}</p>
        <div class="row">${fields}</div>
        <p class="hint">${esc(t('pb.lim.note'))}</p>
        <div class="msg" id="ulMsg"></div>
        <div class="actions"><button class="ghost" id="ulCancel">${esc(t('btn.cancel'))}</button>
          <button class="primary" id="ulSave">${esc(t('btn.save'))}</button></div>`);
      bg.querySelector('#ulCancel').addEventListener('click', () => bg.remove());
      bg.querySelector('#ulSave').addEventListener('click', async () => {
        const limits = {};
        for (const [key] of OVERRIDE_KEYS) {
          const raw = (bg.querySelector('#ul-' + key).value || '').trim();
          if (raw === '') continue;                    // no override — the tier decides
          const n = parseInt(raw, 10);
          if (!isFinite(n) || n < 0) { const m = bg.querySelector('#ulMsg'); m.className = 'msg err'; m.textContent = t('toast.error'); return; }
          limits[key] = n;
        }
        const b = bg.querySelector('#ulSave'); b.disabled = true;
        const d = await putUser(u.id, { limits });
        b.disabled = false;
        if (d) { CQ.toast(t('pb.lim.saved'), 'ok'); bg.remove(); }
        else { const m = bg.querySelector('#ulMsg'); m.className = 'msg err'; m.textContent = $('userMsg').textContent || t('toast.error'); }
      });
    }

    // The only password-recovery path a registered user has: there is no mail provider, so
    // the operator reads the new password out. It is shown once and never stored in the
    // clear — the modal says so, because an operator who closes it without copying has to
    // reset again, and they should learn that BEFORE they close it.
    async function resetUserPassword(u) {
      if (!(await CQ.confirm(t('pb.pw.confirm').replace('{email}', () => u.email), { ok: t('pb.act.resetpw') }))) return;
      const r = await adminFetch(`${API}/admin/users/${u.id}/reset-password`, { method: 'POST', headers: hdr() });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.password) { CQ.toast((d && d.detail) || t('toast.error'), 'err'); return; }
      const bg = showModal(`<h3 style="margin-top:0">${esc(t('pb.pw.title'))}</h3>
        <p class="hint" style="margin-top:-6px">${esc(u.email)}</p>
        <div class="inline" style="gap:10px; flex-wrap:wrap">
          <code id="pwVal" style="font-size:16px; user-select:all">${esc(d.password)}</code>
          <button class="ghost" id="pwCopy">${esc(t('pb.copy'))}</button>
        </div>
        <p class="hint">${esc(t('pb.pw.once'))}</p>
        <div class="actions"><button class="primary" id="pwClose">${esc(t('pb.close'))}</button></div>`);
      bg.querySelector('#pwCopy').addEventListener('click', async () => {
        const ok = await copyText(d.password);
        CQ.toast(ok ? t('pb.copied') : t('pb.copyfail'), ok ? 'ok' : 'err');
      });
      bg.querySelector('#pwClose').addEventListener('click', () => bg.remove());
    }

    // ---- Storage retention ----------------------------------------------------------------
    async function loadStorage() {
      const r = await adminFetch(`${API}/admin/storage`, { headers: hdr() }); if (!r.ok) return;
      const d = await r.json().catch(() => ({}));
      $('st_days').value = d.retention_days ?? 30;
    }
    $('saveStorage').addEventListener('click', async () => {
      const m = $('storageMsg'); m.className = 'msg'; m.textContent = '';
      // 0 is a real, storable answer here ("keep forever"), so it is parsed rather than
      // ||-defaulted into 30 the way a truthiness test would.
      const n = parseInt($('st_days').value, 10);
      if (!isFinite(n) || n < 0 || n > 3650) { m.className = 'msg err'; m.textContent = t('toast.error'); return; }
      const b = $('saveStorage'); b.disabled = true;
      try {
        const r = await adminFetch(`${API}/admin/storage`, { method: 'PUT', headers: jhdr(), body: JSON.stringify({ retention_days: n }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); return; }
        $('st_days').value = d.retention_days ?? n;
        m.className = 'msg ok'; m.textContent = t('toast.saved'); CQ.toast(t('toast.saved'), 'ok');
      } finally { b.disabled = false; }
    });

    // ---- Default rubric --------------------------------------------------------------------
    // The tenant portal's dimension editor, one level up. Deliberately without the AI import:
    // this rubric is the fallback every owner inherits, and it is written once by hand rather
    // than drafted from a customer's document.
    let drDims = [];
    function drRow(d, i) {
      return `<div class="sc-edit" data-i="${i}">
        <div class="inline" style="justify-content:space-between; margin-bottom:8px">
          <span class="sc-edit-num">${i + 1}</span>
          <button class="act danger dr-del" data-i="${i}" title="${esc(t('sc.remove'))}" aria-label="${esc(t('sc.remove'))}">🗑</button>
        </div>
        <div class="row">
          <div style="flex:2"><label>${esc(t('sc.dname'))}</label><input class="dr-name" value="${esc(d.name || '')}" placeholder="${esc(t('sc.dname.ph'))}" /></div>
          <div class="w-num"><label>${esc(t('sc.dweight'))}</label><input class="dr-weight" type="number" min="0" step="1" value="${d.weight ?? 0}" /></div>
        </div>
        <label>${esc(t('sc.ddesc'))}</label><input class="dr-desc" value="${esc(d.description || '')}" />
        <label>${esc(t('sc.dguide'))}</label><textarea class="dr-guide" style="min-height:54px" placeholder="${esc(t('sc.dguide.ph'))}">${esc(d.guidance || '')}</textarea>
      </div>`;
    }
    function drReadDom() {
      drDims = [...$('drDims').querySelectorAll('.sc-edit[data-i]')].map(el => ({
        key: (drDims[+el.dataset.i] || {}).key,
        name: el.querySelector('.dr-name').value.trim(),
        weight: parseFloat(el.querySelector('.dr-weight').value) || 0,
        description: el.querySelector('.dr-desc').value.trim(),
        guidance: el.querySelector('.dr-guide').value.trim(),
      }));
    }
    function drRenderDims() {
      const box = $('drDims');
      box.innerHTML = drDims.length ? drDims.map(drRow).join('') : `<div class="empty">${esc(t('sc.nodims'))}</div>`;
      box.querySelectorAll('.dr-del').forEach(b => b.addEventListener('click', () => { drReadDom(); drDims.splice(+b.dataset.i, 1); drRenderDims(); }));
      box.querySelectorAll('.dr-weight').forEach(inp => inp.addEventListener('input', drSum));
      drSum();
      CQ.autogrowBind(box, '.dr-guide');
    }
    function drSum() {
      let s = 0; $('drDims').querySelectorAll('.dr-weight').forEach(i => s += parseFloat(i.value) || 0);
      s = Math.round(s * 10) / 10;
      const ok = Math.abs(s - 100) <= 0.5;
      $('drSum').textContent = s; $('drSum').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      $('drSumFlag').textContent = ok ? '✓' : '✗'; $('drSumFlag').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      return ok;
    }
    // 'demo' and 'builtin' both mean "nothing is saved here yet" — the editor is showing a
    // proposal. Saying that in the pill is the difference between an operator editing the
    // default and an operator believing they already have one.
    const DR_SRC = { stored: ['pb.src.stored', 'ready'], demo: ['pb.src.demo', 'processing'], builtin: ['pb.src.builtin', 'notinkb'] };
    let drMeta = { source: '', updated_at: null, updated_by: '' };
    function drPaintSource() {
      const [key, cls] = DR_SRC[drMeta.source] || ['pb.src.builtin', 'notinkb'];
      $('drSource').className = 'pill ' + cls; $('drSource').textContent = t(key);
      $('drUpdated').textContent = drMeta.updated_at
        ? t('pb.defrubric.updated').replace('{when}', () => fmtWhen(drMeta.updated_at)).replace('{who}', () => drMeta.updated_by || '—')
        : '';
    }
    function drApply(d) {
      drDims = (Array.isArray(d.dimensions) ? d.dimensions : []).map(x => ({
        key: x.key, name: x.name || '', weight: x.weight || 0, description: x.description || '', guidance: x.guidance || '' }));
      $('drRubric').value = d.rubric || '';
      drMeta = { source: d.source || '', updated_at: d.updated_at || null, updated_by: d.updated_by || '' };
      drPaintSource(); drRenderDims();
    }
    async function loadDefaultRubric() {
      const m = $('drMsg'); m.className = 'msg'; m.textContent = '';
      const r = await adminFetch(`${API}/admin/default-rubric`, { headers: hdr() });
      if (!r.ok) { m.className = 'msg err'; m.textContent = t('toast.error'); return; }
      drApply(await r.json().catch(() => ({})));
    }
    $('drAdd').addEventListener('click', () => { drReadDom(); drDims.push({ name: '', weight: 0, description: '', guidance: '' }); drRenderDims(); });
    $('drNormalize').addEventListener('click', () => {
      drReadDom(); const n = drDims.length; if (!n) return;
      const total = drDims.reduce((a, d) => a + (d.weight || 0), 0);
      if (total <= 0) drDims.forEach(d => d.weight = Math.round(100 / n));
      else drDims.forEach(d => d.weight = Math.round((d.weight / total) * 100));
      drDims[n - 1].weight += 100 - drDims.reduce((a, d) => a + d.weight, 0);
      drRenderDims();
    });
    $('drSave').addEventListener('click', async () => {
      drReadDom();
      const m = $('drMsg'); m.className = 'msg'; m.textContent = '';
      if (!drDims.length) { m.className = 'msg err'; m.textContent = t('sc.needone'); return; }
      if (drDims.some(d => !d.name)) { m.className = 'msg err'; m.textContent = t('sc.needname'); return; }
      const total = Math.round(drDims.reduce((a, d) => a + (d.weight || 0), 0) * 10) / 10;
      if (Math.abs(total - 100) > 0.5) { m.className = 'msg err'; m.textContent = t('sc.mustbe100').replace('{total}', () => total); return; }
      const b = $('drSave'); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await adminFetch(`${API}/admin/default-rubric`, { method: 'PUT', headers: jhdr(),
          body: JSON.stringify({ dimensions: drDims, rubric: $('drRubric').value }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { m.className = 'msg err'; m.textContent = d.detail || t('toast.error'); return; }
        drApply(d);
        m.className = 'msg ok'; m.textContent = t('pb.defrubric.saved'); CQ.toast(t('pb.defrubric.saved'), 'ok');
      } finally { b.disabled = false; b.textContent = t('sc.save'); }
    });

    // ---- BOT CONTROL: autopilot kill switch + per-tenant state -------------------------
    // The switch itself is one `app_settings` blob: {global_disabled, disabled_clients:[id]}.
    // The per-tenant column is read from each tenant's own chat config, so this page shows the
    // two facts an operator needs at 3am — is it allowed to answer, and is it stopped — with no
    // third place to look. N+1 by design: the tenant list is tens of rows, not thousands.
    const KILL = `${API}/admin/chat/kill-switch`;
    let killState = { global_disabled: false, disabled_clients: [] }, killTenants = [];

    async function loadKill() {
      const m = $('killMsg'); m.className = 'msg'; m.textContent = '';
      let ok = true;
      try {
        const r = await fetch(KILL, { headers: hdr() });
        if (!r.ok) throw new Error(r.status === 404 ? t('kill.unavailable') : t('kill.loadfail'));
        const d = await r.json();
        killState = {
          global_disabled: !!(d && d.global_disabled),
          disabled_clients: (d && Array.isArray(d.disabled_clients)) ? d.disabled_clients.map(String) : [],
        };
      } catch (e) { ok = false; m.className = 'msg err'; m.textContent = e.message || t('kill.loadfail'); }
      renderKillGlobal(ok);
      await loadKillTenants();
    }

    function renderKillGlobal(reachable) {
      const p = $('killGlobalPill');
      p.className = 'pill ' + (!reachable ? 'error' : killState.global_disabled ? 'error' : 'ready');
      p.textContent = !reachable ? '—' : killState.global_disabled ? t('kill.global.on') : t('kill.global.off');
      const b = $('killGlobalBtn');
      b.className = killState.global_disabled ? 'primary' : 'danger';
      b.textContent = killState.global_disabled ? t('kill.resume') : t('kill.global');
      b.disabled = !reachable;
    }

    async function loadKillTenants() {
      const box = $('killList');
      const r = await adminFetch(`${API}/admin/tenants`, { headers: hdr() });
      if (!r.ok) { box.innerHTML = `<div class="msg err">${esc(t('kill.overviewfail'))}</div>`; return; }
      const l = await r.json();
      const tenants = Array.isArray(l) ? l : [];
      killTenants = await Promise.all(tenants.map(async x => {
        let on = false, reachable = true;
        try {
          const rr = await adminFetch(`${API}/admin/chat/${x.id}/config`, { headers: hdr() });
          if (rr.ok) { const c = await rr.json(); on = !!(c && c.autopilot_enabled); } else reachable = false;
        } catch { reachable = false; }
        return { id: String(x.id), name: x.name, autopilot: on, reachable };
      }));
      renderKillTenants();
    }

    function killRowState(x) {
      if (!x.autopilot) return { cls: 'notinkb', label: t('kill.state.off') };
      if (killState.global_disabled || killState.disabled_clients.includes(x.id))
        return { cls: 'error', label: t('kill.state.stopped') };
      return { cls: 'ready', label: t('kill.state.live') };
    }

    function renderKillTenants() {
      const box = $('killList');
      if (!killTenants.length) { box.innerHTML = `<div class="empty">—</div>`; return; }
      box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${t('th.name')}</th><th>${t('th.autopilot')}</th><th>${t('th.status')}</th><th></th></tr></thead><tbody>` +
        killTenants.map(x => {
          const st = killRowState(x);
          const stopped = killState.disabled_clients.includes(x.id);
          return `<tr>
            <td>${esc(x.name)}${x.reachable ? '' : ` <span class="hint">${esc(t('kill.overviewfail'))}</span>`}</td>
            <td><span class="pill ${x.autopilot ? 'on' : 'off'}">${x.autopilot ? '●' : '○'}</span></td>
            <td><span class="pill ${st.cls}">${esc(st.label)}</span></td>
            <td class="inline"><button class="${stopped ? 'primary' : 'danger'}" data-kill="${stopped ? 'resume' : 'stop'}" data-id="${esc(x.id)}" data-name="${esc(x.name)}">${stopped ? t('kill.resume') : t('kill.stop')}</button></td>
          </tr>`;
        }).join('') + `</tbody></table></div>`;
      box.querySelectorAll('button[data-kill]').forEach(b => b.addEventListener('click', () => killTenant(b.dataset.kill, b.dataset.id, b.dataset.name)));
    }

    async function putKill(patch) {
      const m = $('killMsg'); m.className = 'msg'; m.textContent = '';
      const r = await fetch(KILL, { method: 'PUT', headers: jhdr(), body: JSON.stringify(patch) });
      if (!r.ok) { m.className = 'msg err';
        m.textContent = r.status === 404 ? t('kill.unavailable') : t('toast.error');
        CQ.toast(m.textContent, 'err'); return false; }
      m.className = 'msg ok'; m.textContent = t('kill.saved'); CQ.toast(t('kill.saved'), 'ok');
      await loadKill(); return true;
    }

    $('reloadKill').addEventListener('click', loadKill);
    $('killGlobalBtn').addEventListener('click', async () => {
      const next = !killState.global_disabled;
      const msg = next ? t('kill.confirm.global') : t('kill.confirm.resume.global');
      if (!(await CQ.confirm(msg, { ok: next ? t('kill.stop') : t('kill.resume'), danger: next }))) return;
      await putKill({ global_disabled: next });
    });

    async function killTenant(act, id, name) {
      const stop = act === 'stop';
      const msg = (stop ? t('kill.confirm.tenant') : t('kill.confirm.resume')).replace('{name}', name || '');
      if (!(await CQ.confirm(msg, { ok: stop ? t('kill.stop') : t('kill.resume'), danger: stop }))) return;
      const set = new Set(killState.disabled_clients);
      stop ? set.add(id) : set.delete(id);
      await putKill({ disabled_clients: [...set] });
    }

    boot();
  </script>
</body>
</html>
