<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CommuniQ — Knowledge base</title>
  <link rel="icon" href="favicon.png" />
  <!--
    The operator KB console used to live here as a second, hand-maintained implementation of
    the tenant portal's console. The two drifted — same feature, two behaviours, two sets of
    bugs — so there is now ONE page: `tenant.html` renders the operator view when a superadmin
    token is present, with a workspace picker in place of the tenant's own name.

    This file stays as a redirect rather than being deleted: it is linked from the console nav
    and is in operators' bookmarks and browser history. `?tenant=<id>` is carried through so a
    shared deep link still opens on the workspace it names, and `replace` keeps Back working
    (it goes where the operator came from, not into a redirect loop).
  -->
  <script>
    (function () {
      var q = location.search || '';
      location.replace('tenant.html' + q + location.hash);
    })();
  </script>
</head>
<body>
  <noscript>
    This console needs JavaScript. Open <a href="tenant.html">tenant.html</a>.
  </noscript>
</body>
</html>
