<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CommuniQ — KB Admin Console</title>
  <script>document.documentElement.setAttribute('data-theme', (function(){try{return localStorage.getItem('cq_theme')||'dark'}catch(e){return 'dark'}})());</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand.css" />
  <link rel="icon" href="favicon.png" />
  <script src="brand.js"></script>
  <style>
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
    .stat { background:var(--input-bg); border:1px solid var(--hairline); border-radius:var(--r-md); padding:14px; }
    .stat .n { font-family:var(--font-display); font-weight:800; font-size:24px; color:var(--paper); }
    .stat .l { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .kv-line { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid color-mix(in oklab,var(--hairline) 60%,transparent); font-size:13px; }
    .kv-line b { color:var(--mist); font-weight:600; } .kv-line span { color:var(--paper); }
    .scorebar { height:5px; border-radius:999px; background:var(--hairline); overflow:hidden; margin-top:5px; }
    .scorebar i { display:block; height:100%; background:var(--beam); }
    .selbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; }
    td.tight, th.tight { white-space:nowrap; }
    .warn-flag { color:var(--coral); font-weight:600; }
    /* KB Health (curation review queue) — mirrors the tenant portal's markup. */
    .cur-q { background:var(--input-bg); border:1px solid var(--hairline); border-left:3px solid var(--beam);
      border-radius:var(--r-md); padding:9px 11px; margin:7px 0; }
    .cur-q q { display:block; color:var(--paper); font-style:normal; }
    .cur-q .cur-src { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:5px; }
    .cur-a { margin-top:5px; padding-left:10px; border-left:2px solid var(--hairline); color:var(--mist); font-size:13px; }
    .cur-diff { white-space:pre-wrap; word-break:break-word; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:12.5px; line-height:1.55; background:var(--input-bg); border:1px solid var(--hairline);
      border-radius:var(--r-md); padding:10px; max-height:300px; overflow:auto; }
    .cur-diff ins { background:color-mix(in oklab,var(--ok) 26%,transparent); color:var(--paper); text-decoration:none; }
    .cur-diff del { background:color-mix(in oklab,var(--alert) 22%,transparent); color:var(--coral); }
    .cur-meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--muted); }
    .cur-reason { display:flex; align-items:center; gap:8px; padding:7px 2px; cursor:pointer; }
    /* Publishability. Deliberately NOT the ok/error palette: "public" is not "good" and
       "internal" is not "broken" — the badge states a fact about who may be quoted this. */
    .pill.vis-public { background:color-mix(in oklab,var(--beam) 20%,transparent); color:var(--beam); }
    .pill.vis-internal { background:color-mix(in oklab,var(--muted) 20%,transparent); color:var(--muted); }
    /* Retrieval confidence banner (mirrors tenant.html). Amber = "this tenant's knowledge base
       has a gap here"; `.hard` (red) = the embedding service is down, so the scores next to it
       do not mean what they usually mean. Deliberately NOT the .msg ok/err palette used for
       saves: nothing failed here, the answer is simply not trustworthy. */
    .retr-flag { border:1px solid color-mix(in oklab,var(--pending) 42%,transparent);
      border-left:3px solid var(--pending); background:color-mix(in oklab,var(--pending) 9%,transparent);
      border-radius:var(--r-md); padding:11px 13px; margin:0 0 10px; font-size:13px; color:var(--mist); }
    .retr-flag b { display:block; color:var(--paper); font-size:13.5px; margin-bottom:3px; }
    .retr-flag .retr-nums { display:block; margin-top:6px; font-size:11.5px; color:var(--muted); }
    .retr-flag.hard { border-color:color-mix(in oklab,var(--alert) 45%,transparent);
      border-left-color:var(--alert); background:color-mix(in oklab,var(--alert) 8%,transparent); }
  </style>
</head>
<body>
  <div id="cq-header"></div>
  <main class="console">
    <div class="card">
      <div class="row" style="align-items:flex-end">
        <div class="w-name" style="flex:2"><label data-i18n="kba.tenant"></label><select id="tenantSel"><option value="">—</option></select></div>
        <div style="flex:1; min-width:200px" id="healthStrip"></div>
      </div>
    </div>
    <div class="empty" id="tenantEmpty" data-i18n="kba.selecttenant"></div>

    <div id="tenantApp" class="hidden">
      <div class="tabs">
        <div class="tab active" data-tab="overview" data-i18n="kba.tab.overview"></div>
        <div class="tab" data-tab="documents" data-i18n="kba.tab.documents"></div>
        <div class="tab" data-tab="import" data-i18n="kba.tab.import"></div>
        <div class="tab" data-tab="playground" data-i18n="kba.tab.playground"></div>
        <div class="tab" data-tab="duplicates" data-i18n="kba.tab.duplicates"></div>
        <div class="tab" data-tab="curation" data-i18n="cur.tab"></div>
        <div class="tab" data-tab="activity" data-i18n="kba.tab.activity"></div>
        <div class="tab" data-tab="scoring" data-i18n="kba.tab.scoring"></div>
      </div>

      <!-- OVERVIEW -->
      <section class="panel active" id="panel-overview">
        <div class="card"><div class="stat-grid" id="statGrid"></div>
          <div class="actions">
            <button class="ghost" id="exportJson" data-i18n="kba.export"></button>
            <button class="ghost" id="exportCsv" data-i18n="kba.exportcsv"></button>
            <button class="ghost" id="reembedAll" data-i18n="kba.reembedall"></button>
            <button class="ghost" id="reloadOverview" data-i18n="kba.refresh"></button>
          </div>
        </div>
        <div class="card"><h3 data-i18n="kba.params"></h3><div id="paramsBox"></div></div>
      </section>

      <!-- DOCUMENTS -->
      <section class="panel" id="panel-documents">
        <div class="card">
          <div class="row">
            <div><label data-i18n="kba.f.status"></label><select id="fStatus"><option value=""></option><option>ready</option><option>processing</option><option>pending</option><option>error</option></select></div>
            <div><label data-i18n="kba.f.type"></label><input id="fType" /></div>
            <div><label data-i18n="kba.f.tag"></label><input id="fTag" /></div>
            <div><label id="fVisLabel"></label><select id="fVis"><option value=""></option><option value="public"></option><option value="internal"></option></select></div>
            <div style="flex:2"><label data-i18n="kba.f.search"></label><input id="fSearch" /></div>
            <div style="flex:0; align-self:flex-end"><button class="ghost" id="applyFilter" data-i18n="kba.refresh"></button></div>
          </div>
          <div class="selbar hidden" id="selBar">
            <span><b id="selCount">0</b> <span data-i18n="kba.selected"></span></span>
            <button class="ghost" id="bulkPublish"></button>
            <button class="ghost" id="bulkUnpublish"></button>
            <button class="ghost" id="bulkReembed" data-i18n="kba.bulk.reembed"></button>
            <button class="ghost" id="bulkRetag" data-i18n="kba.bulk.retag"></button>
            <button class="danger" id="bulkDelete" data-i18n="kba.bulk.delete"></button>
          </div>
          <div id="docList" style="margin-top:10px"></div>
          <div id="docPager" class="inline" style="justify-content:center; margin-top:10px"></div>
        </div>
      </section>

      <!-- IMPORT -->
      <section class="panel" id="panel-import">
        <div class="card">
          <div class="subtabs">
            <div class="subtab active" data-imp="file" data-i18n="imp.file"></div>
            <div class="subtab" data-imp="text" data-i18n="imp.paste"></div>
            <div class="subtab" data-imp="csv" data-i18n="imp.csv"></div>
          </div>
          <div class="row">
            <div><label data-i18n="kba.doc.type"></label><input id="i_type" placeholder="policy" /></div>
            <div><label data-i18n="kba.doc.title"></label><input id="i_title" /></div>
            <div><label data-i18n="kba.doc.tags"></label><input id="i_tags" placeholder="a, b" /></div>
          </div>
          <label data-i18n="kba.doc.meta"></label><input id="i_meta" placeholder='{"region":"ge"}' />
          <div id="imp-file" style="margin-top:8px"><label data-i18n="kb.filelabel"></label><input type="file" id="i_file" accept=".pdf,.docx,.xlsx,.xlsm,.csv,.txt,.md" multiple /><div class="hint" style="margin-top:8px"><span data-i18n="kb.templates"></span>
            <span class="tpl-links"></span></div>
            <label class="inline" style="gap:8px; margin-top:12px"><input type="checkbox" id="i_restr" style="width:auto" /> <span data-i18n="kb.restr"></span></label>
            <div class="hint" style="margin-top:6px" data-i18n="kb.restr.hint"></div></div>
          <div id="imp-text" class="hidden" style="margin-top:8px"><label data-i18n="f.text"></label><textarea id="i_text"></textarea></div>
          <div id="imp-csv" class="hidden" style="margin-top:8px"><label data-i18n="kb.csvlabel"></label><input type="file" id="i_csv" accept=".csv" multiple /><div class="hint" style="margin-top:8px"><span data-i18n="kb.templates"></span>
            <span class="tpl-links"></span></div></div>
          <div class="actions"><button class="primary" id="importBtn" data-i18n="btn.import"></button></div>
          <div class="msg" id="importMsg"></div>
        </div>
      </section>

      <!-- PLAYGROUND -->
      <section class="panel" id="panel-playground">
        <div class="card">
          <div class="subtabs" id="pgOuterTabs">
            <div class="subtab active" data-pg="retrieval" data-i18n="pg.tab.retrieval"></div>
            <div class="subtab" data-pg="score" data-i18n="pg.tab.score"></div>
            <div class="subtab" data-pg="sentiment" data-i18n="pg.tab.sentiment"></div>
          </div>

          <div id="pg-retrieval">
            <label data-i18n="kba.pg.query"></label><input id="pgQuery" />
            <div class="row" style="margin-top:10px">
              <div class="w-num"><label data-i18n="kba.pg.topk"></label><input id="pgTopk" type="number" value="8" /></div>
              <div class="w-num"><label data-i18n="kba.pg.threshold"></label><input id="pgThresh" type="number" step="0.05" value="0" /></div>
              <div style="flex:0; align-self:flex-end"><button class="primary" id="pgRun" data-i18n="kba.pg.run"></button></div>
            </div>
            <div id="pgResults" style="margin-top:12px"></div>
          </div>

          <div id="pg-score" class="hidden">
            <div class="subtabs" id="ansModeTabs">
              <div class="subtab active" data-ansmode="text" data-i18n="pg.mode.text"></div>
              <div class="subtab" data-ansmode="audio" data-i18n="pg.mode.audio"></div>
            </div>
            <div id="ans-text">
              <label data-i18n="pg.ans.label"></label>
              <textarea id="ansText" style="min-height:120px" data-i18n-ph="pg.ans.ph"></textarea>
              <div class="hint" style="margin-top:6px" data-i18n="pg.ans.hint"></div>
            </div>
            <div id="ans-audio" class="hidden">
              <label data-i18n="pg.audiolabel"></label>
              <div class="drop" id="ansDrop">
                <input type="file" id="ansFile" accept="audio/*,video/*,.m4a,.aac,.flac,.opus,.wma,.amr,.aiff,.oga,.3gp" />
                <div class="drop-title" id="ansDropTitle" data-i18n="drop.title"></div>
                <div class="drop-sub" data-i18n="drop.sub_kb"></div>
              </div>
            </div>
            <div class="actions"><button class="primary" id="ansRun" data-i18n="pg.ans.run"></button></div>
            <div class="msg" id="ansMsg"></div>
          </div>

          <!-- SENTIMENT — standalone: this tenant's own config (superadmin can always edit
               it here, unlike the tenant's own owner-only view) plus a plain analyze tool. -->
          <div id="pg-sentiment" class="hidden">
            <div class="sub" style="margin-bottom:14px">
              <div class="inline" style="justify-content:space-between; align-items:baseline">
                <b style="color:var(--mist)" data-i18n="sn.config"></b>
                <span class="hint" id="snCfgMsg"></span>
              </div>
              <p class="hint" data-i18n="sn.config.desc"></p>
              <label class="inline" style="gap:8px"><input type="checkbox" id="snEnabled" /> <span data-i18n="sn.enabled"></span></label>
              <label data-i18n="sn.guidance"></label>
              <textarea id="snGuidance" data-i18n-ph="sn.guidance.ph" style="min-height:70px"></textarea>
              <div class="actions"><button class="ghost" id="snCfgSave" data-i18n="sn.save"></button></div>
            </div>
            <label data-i18n="sn.audiolabel"></label>
            <div class="drop" id="snDrop">
              <input type="file" id="snFile" accept="audio/*,video/*,.m4a,.aac,.flac,.opus,.wma,.amr,.aiff,.oga,.3gp" />
              <div class="drop-title" id="snDropTitle" data-i18n="drop.title"></div>
              <div class="drop-sub" data-i18n="drop.sub_sn"></div>
            </div>
            <div class="actions"><button class="primary" id="snRun" data-i18n="sn.run"></button></div>
            <div class="msg err" id="snErr"></div>
          </div>
        </div>
        <div id="ansResults"></div>
        <div id="snResults"></div>
      </section>

      <!-- DUPLICATES -->
      <section class="panel" id="panel-duplicates">
        <div class="card">
          <div class="inline" style="justify-content:space-between"><h3 style="margin:0" data-i18n="kba.tab.duplicates"></h3><button class="ghost" id="scanDup" data-i18n="kba.refresh"></button></div>
          <div id="dupBox" style="margin-top:10px"></div>
        </div>
      </section>

      <!-- CURATION (KB Health) -->
      <section class="panel" id="panel-curation">
        <div class="card">
          <div class="row" style="justify-content:space-between; align-items:flex-start">
            <div style="flex:1">
              <h3 style="margin:0" data-i18n="cur.heading"></h3>
              <p class="hint" style="margin:6px 0 0" data-i18n="cur.desc"></p>
            </div>
            <div style="flex:0" class="inline">
              <button class="ghost" id="curRun" data-i18n="cur.run"></button>
              <button class="ghost" id="reloadCur" data-i18n="kba.refresh"></button>
            </div>
          </div>
          <div class="row" style="align-items:flex-end; margin-top:8px">
            <div style="flex:0; min-width:190px"><label data-i18n="cur.filter.state"></label>
              <select id="curState">
                <option value="pending" data-i18n="cur.st.pending"></option>
                <option value="accepted" data-i18n="cur.st.accepted"></option>
                <option value="declined" data-i18n="cur.st.declined"></option>
                <option value="apply_failed" data-i18n="cur.st.apply_failed"></option>
                <option value="superseded" data-i18n="cur.st.superseded"></option>
              </select></div>
          </div>
          <div class="selbar hidden" id="curSelBar">
            <span><b id="curSelCount">0</b> <span data-i18n="kba.selected"></span></span>
            <button class="primary" id="curBulkAccept" data-i18n="cur.bulk.accept"></button>
            <span class="hint" data-i18n="cur.bulk.note"></span>
          </div>
          <div id="curList" style="margin-top:12px"></div>
        </div>
      </section>

      <!-- ACTIVITY -->
      <section class="panel" id="panel-activity">
        <div class="card">
          <div class="inline" style="justify-content:space-between"><h3 style="margin:0" data-i18n="kba.tab.activity"></h3><button class="ghost" id="reloadAct" data-i18n="kba.refresh"></button></div>
          <div id="actBox" style="margin-top:10px"></div>
        </div>
      </section>

      <!-- SCORING -->
      <section class="panel" id="panel-scoring">
        <div class="card">
          <div class="inline" style="justify-content:space-between; align-items:baseline">
            <h3 style="margin:0" data-i18n="sc.heading"></h3>
            <span class="hint" id="scVersion"></span>
          </div>
          <p class="hint" data-i18n="sc.desc"></p>
          <div id="scDims"></div>
          <div class="actions" style="justify-content:space-between; align-items:center">
            <div class="inline" style="gap:8px">
              <button class="ghost" id="scAdd" data-i18n="sc.adddim"></button>
              <button class="ghost" id="scNormalize" data-i18n="sc.normalize"></button>
              <button class="ghost" id="scImport" data-i18n="sc.import"></button>
              <input type="file" id="scImportFile" accept=".pdf,.docx,.xlsx,.xlsm,.csv,.txt,.md" class="hidden" />
            </div>
            <span class="hint"><span data-i18n="sc.sum"></span>: <b id="scSum">0</b>% <span id="scSumFlag"></span></span>
          </div>
          <!-- Import progress — mirrors the tenant editor. The caption says WHICH work is
               running; the bar is only ever a real fraction (uploaded bytes, then output
               tokens produced against what the document needs) and goes indeterminate where
               no denominator exists. -->
          <div class="imp-prog hidden" id="scProg">
            <div class="imp-prog-head">
              <span id="scProgLabel" aria-live="polite"></span>
              <span class="imp-prog-pct" id="scProgPct" aria-hidden="true"></span>
            </div>
            <div class="sc-bar" id="scProgBar" role="progressbar" aria-labelledby="scProgLabel"
                 aria-valuemin="0" aria-valuemax="100"><span></span></div>
          </div>
          <hr class="sep" />
          <label data-i18n="sc.rubric"></label>
          <textarea id="scRubric" style="min-height:80px" data-i18n-ph="sc.rubric.ph"></textarea>
          <div class="actions"><button class="primary" id="scSave" data-i18n="sc.save"></button></div>
          <div class="msg" id="scMsg"></div>
        </div>
      </section>
    </div>
  </main>
  <div id="modalHost"></div>

  <script>
    const API = CQ.API, t = CQ.t;
    CQ.mountHeader({ tag: 'KB', nav: [
      { i18n: 'nav.console', href: 'admin.html' },
      { i18n: 'nav.kb', href: 'kb-admin.html' },
      { i18n: 'nav.logout', href: '#', id: 'logout' },
      { i18n: 'nav.public', href: 'index.html' },
    ]});
    let TOKEN = sessionStorage.getItem('cq_admin_token') || '';
    if (!TOKEN) location.replace('tenant.html?next=kb-admin.html');
    const $ = id => document.getElementById(id);
    const H = (extra={}) => ({ 'X-Admin-Token': TOKEN, ...extra });
    const JH = () => H({ 'Content-Type': 'application/json' });
    const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    let TID = '';
    const K = () => `${API}/admin/kb/${TID}`;

    /* ---- Publishability strings (page-local) ----------------------------------------
       These live here rather than in brand.js's DICT because this console is the only
       surface that carries them and brand.js is owned elsewhere; `vt()` falls back to
       English so a missing translation degrades to a readable label, never to a raw key.
       If these ever need to appear in the tenant portal too, promote them to the DICT. */
    const VT = {
      en: { 'col':'Visibility', 'public':'Shared with bot', 'internal':'Internal', 'all':'All',
            'filter':'Visibility', 'publish':'Share with bot', 'unpublish':'Stop sharing',
            'bulk.publish':'Share selected with bot', 'bulk.unpublish':'Stop sharing selected',
            'stat.public':'Shared with bot',
            'confirm.publish':'Share {n} document(s) with the bot? The bot may quote shared documents word for word to end customers. Nothing is made public on the internet.',
            'confirm.unpublish':'Stop sharing {n} document(s)? The bot will no longer use them.',
            'confirm.publish.one':'Share “{title}” with the bot? The bot may quote it word for word to end customers. Nothing is made public on the internet.',
            'confirm.unpublish.one':'Stop sharing “{title}”? The bot will no longer use it.',
            'done.publish':'Shared with bot', 'done.unpublish':'Sharing stopped' },
      ka: { 'col':'ხილვადობა', 'public':'ბოტისთვის დაშვებული', 'internal':'შიდა', 'all':'ყველა',
            'filter':'ხილვადობა', 'publish':'ბოტისთვის დაშვება', 'unpublish':'დაშვების მოხსნა',
            'bulk.publish':'მონიშნულის დაშვება ბოტისთვის', 'bulk.unpublish':'მონიშნულისთვის დაშვების მოხსნა',
            'stat.public':'ბოტისთვის დაშვებული',
            'confirm.publish':'დაეშვას {n} დოკუმენტი ბოტისთვის? ბოტი დაშვებულ დოკუმენტებს კლიენტებთან სიტყვასიტყვით ციტირებს. ინტერნეტში არაფერი ქვეყნდება.',
            'confirm.unpublish':'მოეხსნას დაშვება {n} დოკუმენტს? ბოტი მათ აღარ გამოიყენებს.',
            'confirm.publish.one':'დაეშვას „{title}“ ბოტისთვის? ბოტი მას კლიენტებთან სიტყვასიტყვით ციტირებს. ინტერნეტში არაფერი ქვეყნდება.',
            'confirm.unpublish.one':'მოეხსნას დაშვება „{title}“-ს? ბოტი მას აღარ გამოიყენებს.',
            'done.publish':'დაშვებულია ბოტისთვის', 'done.unpublish':'დაშვება მოხსნილია' },
      ru: { 'col':'Видимость', 'public':'Доступен боту', 'internal':'Внутренний', 'all':'Все',
            'filter':'Видимость', 'publish':'Открыть боту', 'unpublish':'Закрыть от бота',
            'bulk.publish':'Открыть боту выбранные', 'bulk.unpublish':'Закрыть от бота выбранные',

    async function loadOverview() {
      let st, pa;
      try {
        [st, pa] = await Promise.all([
          adminFetch(`${K()}/stats`, { headers: H() }).then(r => r.ok ? r.json() : null),
          adminFetch(`${K()}/params`, { headers: H() }).then(r => r.ok ? r.json() : null),
        ]);
      } catch { return; }
      if (!st || !pa) { $('statGrid').innerHTML = `<div class="msg err">${t('toast.error')}</div>`; $('paramsBox').innerHTML = ''; $('healthStrip').innerHTML = ''; return; }
      const tile = (n,l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
      $('statGrid').innerHTML =
        tile(st.documents, t('kba.stat.documents')) + tile(st.public_documents ?? 0, vt('stat.public')) +
        tile(st.chunks, t('kba.stat.chunks')) +
        tile(st.embedding_coverage+'%', t('kba.stat.coverage')) + tile(st.failed, t('kba.stat.failed')) +
        tile(st.approx_tokens, t('kba.stat.tokens')) + tile(st.in_progress, t('kba.stat.inprogress')) +
        tile(st.last_updated ? new Date(st.last_updated).toLocaleDateString() : '—', t('kba.stat.lastupd'));
      $('healthStrip').innerHTML = `<div class="hint" style="text-align:right">${st.documents} docs · ${st.chunks} chunks · ${st.embedding_coverage}% embedded${st.failed?` · <span class="warn-flag">${st.failed} failed</span>`:''}</div>`;
      const e = pa.embedding, ch = pa.chunking, re = pa.retrieval;
      const kv = (b,s,warn) => `<div class="kv-line"><b>${b}</b><span class="${warn?'warn-flag':''}">${s}</span></div>`;
      $('paramsBox').innerHTML =
        kv(t('adm.embprov'), esc(e.provider)) + kv(t('f.model'), esc(e.model)) +
        kv(t('f.dimension'), e.dim) + kv(t('tkb.params.columndim'), e.column_dim + (e.dim_mismatch ? ' ⚠' : ''), e.dim_mismatch) +
        (e.dim_mismatch ? `<div class="warn-flag" style="margin:6px 0">${t('kba.warn.mismatch')}</div>` : '') +
        kv(t('tkb.params.chunk'), `${ch.size} / ${ch.overlap}`) +
        kv(t('tkb.params.threshold'), re.similarity_threshold) + kv(t('tkb.params.topk'), re.default_top_k) +
        kv(t('tkb.params.metric'), re.distance_metric) + kv(t('tkb.params.index'), re.index_type) +
        kv(t('tkb.params.noembed'), pa.warnings.chunks_without_embedding, pa.warnings.chunks_without_embedding>0);
    }
    function download(url) {

      const r = await fetch(`${K()}/reembed`, { method:'POST', headers: H() }); const d = await r.json().catch(()=>({}));
      // The inline full-KB re-embed now reports a mid-run encoder failure as 502 carrying how

    // ---- DOCUMENTS ----
    let selected = new Set(), page = { limit: 50, offset: 0, total: 0 };
    $('applyFilter').addEventListener('click', () => { page.offset = 0; loadDocuments(); });
    ['fType','fTag','fSearch'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key==='Enter'){ page.offset=0; loadDocuments(); } }));
    async function loadDocuments() {
      selected.clear(); updateSelBar();
      const p = new URLSearchParams({ limit: page.limit, offset: page.offset });
      if ($('fStatus').value) p.set('status', $('fStatus').value);
      if ($('fType').value.trim()) p.set('doc_type', $('fType').value.trim());
      if ($('fTag').value.trim()) p.set('tag', $('fTag').value.trim());
      if ($('fVis').value) p.set('visibility', $('fVis').value);
      if ($('fSearch').value.trim()) p.set('q', $('fSearch').value.trim());
      let r; try { r = await adminFetch(`${K()}/documents?${p}`, { headers: H() }); } catch { return; }
      if (!r.ok) { $('docList').innerHTML = `<div class="msg err">${t('toast.error')}</div>`; $('docPager').innerHTML=''; return; }
      const d = await r.json().catch(() => ({ total: 0, documents: [] }));
      if (!Array.isArray(d.documents)) d.documents = [];
      page.total = d.total || 0;
      if (!d.documents.length) { $('docList').innerHTML = `<div class="empty">${t('kba.nodocs')}</div>`; $('docPager').innerHTML=''; return; }
      $('docList').innerHTML = `<div class="table-wrap"><table><thead><tr>
        <th><input type="checkbox" id="selAll"/></th><th>${t('kba.doc.title')}</th><th>${t('th.category')}</th><th class="hide-md">${t('kba.doc.tags')}</th>
        <th class="tight">${t('th.chunks')}</th><th>${t('th.status')}</th><th class="tight">${vt('col')}</th><th class="tight hide-md">${t('tkb.th.source')}</th><th></th></tr></thead><tbody>` +
        d.documents.map(x => `<tr>
          <td><input type="checkbox" class="rowsel" data-id="${x.id}"/></td>
          <td>${esc(x.title)}</td><td>${esc(x.doc_type)}</td>
          <td class="hide-md">${(x.tags||[]).map(tg=>`<span class="chip">${esc(tg)}</span>`).join('')||'—'}</td>
          <td class="tight">${x.chunk_count}</td>
          <td><span class="pill ${esc(x.status)}">${esc(x.status)}</span>${x.error?` <span class="hint" title="${esc(x.error)}">⚠</span>`:''}</td>
          <td class="tight"><span class="pill ${x.visibility==='public'?'vis-public':'vis-internal'}">${x.visibility==='public'?vt('public'):vt('internal')}</span></td>
          <td class="tight hint hide-md">${esc(x.source_type||'—')}</td>
          <td class="inline"><button class="act" data-act="${x.visibility==='public'?'unpublish':'publish'}" data-id="${x.id}" data-title="${esc(x.title)}" title="${x.visibility==='public'?vt('unpublish'):vt('publish')}" aria-label="${x.visibility==='public'?vt('unpublish'):vt('publish')}">${x.visibility==='public'?'🚫':'🤖'}</button>
            <button class="act" data-act="edit" data-id="${x.id}" title="${t('kba.edit')}" aria-label="${t('kba.edit')}">✏️</button>
            <button class="act" data-act="chunks" data-id="${x.id}" title="${t('kba.chunks')}" aria-label="${t('kba.chunks')}">🧩</button>
            <button class="act" data-act="reembed" data-id="${x.id}" title="${t('kba.reembed')}" aria-label="${t('kba.reembed')}">↻</button>
            <button class="act danger" data-act="del" data-id="${x.id}" data-title="${esc(x.title)}" title="${t('kba.delete')}" aria-label="${t('kba.delete')}">🗑</button></td></tr>`).join('') + `</tbody></table></div>`;
      $('docList').querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => docAction(b.dataset.act, b.dataset.id, b.dataset.title)));
      $('docList').querySelectorAll('.rowsel').forEach(cb => cb.addEventListener('change', () => { cb.checked ? selected.add(cb.dataset.id) : selected.delete(cb.dataset.id); updateSelBar(); }));
      $('selAll').addEventListener('change', () => { $('docList').querySelectorAll('.rowsel').forEach(cb => { cb.checked = $('selAll').checked; cb.checked ? selected.add(cb.dataset.id) : selected.delete(cb.dataset.id); }); updateSelBar(); });
      const pages = Math.ceil(page.total / page.limit);
      const cur = Math.floor(page.offset / page.limit) + 1;
      $('docPager').innerHTML = pages > 1 ? `<button class="ghost" ${cur<=1?'disabled':''} id="prevP">‹</button> <span class="hint">${cur}/${pages} · ${page.total}</span> <button class="ghost" ${cur>=pages?'disabled':''} id="nextP">›</button>` : `<span class="hint">${page.total} total</span>`;
      if ($('prevP')) $('prevP').addEventListener('click', () => { page.offset=Math.max(0,page.offset-page.limit); loadDocuments(); });
      if ($('nextP')) $('nextP').addEventListener('click', () => { page.offset+=page.limit; loadDocuments(); });
    }
    function updateSelBar() { $('selBar').classList.toggle('hidden', selected.size===0); $('selCount').textContent = selected.size; }
    async function docAction(act, id, title) {
      // Publishing decides what a public bot may repeat to a customer, so even the
      // single-row toggle confirms and says out loud what "public" means.
      if (act==='publish' || act==='unpublish') {
        const vis = act==='publish' ? 'public' : 'internal';
        const msg = vt(`confirm.${act}.one`).replace('{title}', title || '');
        if (!(await CQ.confirm(msg, { ok: vt(act), danger: act==='unpublish' }))) return;
        const r = await fetch(`${K()}/documents/${id}/visibility`, { method:'PUT', headers: JH(), body: JSON.stringify({ visibility: vis }) });
        if (r.ok) { CQ.toast(vt(`done.${act}`), 'ok'); loadDocuments(); }
        else { const d = await r.json().catch(()=>({})); CQ.toast(d.detail || t('toast.error'), 'err'); }
        return;
      }
      if (act==='del') { if(!(await CQ.confirm(t('tkb.del.confirm').replace('{title}', () => title || ''), {ok:t('kba.delete')}))) return;
        await fetch(`${K()}/documents/${id}`, { method:'DELETE', headers: H() }); CQ.toast(t('toast.deleted'),'ok'); loadDocuments(); return; }
      if (act==='reembed') { const r = await fetch(`${K()}/documents/${id}/reembed`, { method:'POST', headers: H() }); const d = await r.json().catch(()=>({}));
        // 502 when the encoder is unreachable — without the r.ok guard that toasts
        // "undefined chunks" in green, which reads as success.
        CQ.toast(r.ok ? `${d.reembedded_chunks} chunks` : (d.detail || t('toast.error')), r.ok ? 'ok' : 'err'); return; }
      if (act==='edit') return openEditor(id);
      if (act==='chunks') return openChunks(id);
    }
    async function openEditor(id) {
      const doc = await fetch(`${K()}/documents/${id}`, { headers: H() }).then(r=>r.json());
      const bg = showModal(`<h3>${t('kba.edit')}: ${esc(doc.title)}</h3>
        <label>${t('kba.doc.title')}</label><input id="ed_title" value="${esc(doc.title)}"/>
        <label>${t('kba.doc.type')}</label><input id="ed_type" value="${esc(doc.doc_type)}"/>
        <label>${t('kba.doc.tags')}</label><input id="ed_tags" value="${esc((doc.tags||[]).join(', '))}"/>
        <label>${t('kba.doc.meta')}</label><textarea id="ed_meta" style="min-height:60px">${esc(JSON.stringify(doc.metadata||{}))}</textarea>
        <label>${t('kba.doc.content')}</label><textarea id="ed_content" style="min-height:120px">${esc(doc.content_text||'')}</textarea>
        <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="primary" id="ed_save">${t('kba.save')}</button></div>
        <div class="msg" id="ed_msg"></div>`);
      bg.querySelector('[data-c]').addEventListener('click', ()=>bg.remove());
      bg.querySelector('#ed_save').addEventListener('click', async () => {
        let meta; try { meta = JSON.parse($('ed_meta').value||'{}'); } catch { $('ed_msg').className='msg err'; $('ed_msg').textContent='Invalid JSON metadata'; return; }
        const body = { title:$('ed_title').value, doc_type:$('ed_type').value, tags:$('ed_tags').value.split(',').map(s=>s.trim()).filter(Boolean), metadata:meta };
        if ($('ed_content').value !== (doc.content_text||'')) body.text = $('ed_content').value;
        const btn = $('ed_save'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
        const r = await fetch(`${K()}/documents/${id}`, { method:'PUT', headers: JH(), body: JSON.stringify(body) });
        // A text edit re-chunks and re-embeds, so this can now come back 502 ("Re-embedding
        // failed: ...") with the document left in status='error'. Show the server's reason
        // verbatim: "Save failed" would send the operator looking at their own input when the
        // actual fault is a down encoder, and the modal stays open with the text still in it.
        if (r.ok) { CQ.toast(t('toast.saved'),'ok'); bg.remove(); loadDocuments(); }
        else { const d = await r.json().catch(()=>({})); btn.disabled=false; btn.textContent=t('kba.save');
               $('ed_msg').className='msg err'; $('ed_msg').textContent = d.detail || t('toast.error'); loadDocuments(); }
      });
    }
    async function openChunks(id) {
      const cr = await fetch(`${K()}/documents/${id}/chunks`, { headers: H() });
      const chunks = cr.ok ? await cr.json() : [];
      if (!Array.isArray(chunks)) { CQ.toast(t('toast.error')||'Error', 'err'); return; }
      const bg = showModal(`<h3>${t('kba.chunks')} (${chunks.length})</h3><div id="chList"></div>`);
      const render = list => { bg.querySelector('#chList').innerHTML = list.map(c => `<div class="fc-claim" style="border-left-color:${c.has_embedding?'var(--ok)':'var(--alert)'}">
        <div class="inline" style="justify-content:space-between; gap:8px; flex-wrap:wrap"><span class="hint">#${c.chunk_index} · ${c.token_count||0} tok ${c.has_embedding?'':'· <span class="warn-flag">no embedding</span>'}</span>
          <span class="inline wrap"><button class="ghost" data-cedit="${c.id}">${t('kba.chunk.edit')}</button><button class="danger" data-cdel="${c.id}">${t('kba.chunk.delete')}</button></span></div>
        <div style="margin-top:6px; white-space:pre-wrap">${esc(c.content)}</div></div>`).join('') || `<div class="empty">—</div>`;
        bg.querySelectorAll('[data-cedit]').forEach(b => b.addEventListener('click', () => editChunk(id, b.dataset.cedit, bg)));
        bg.querySelectorAll('[data-cdel]').forEach(b => b.addEventListener('click', async () => {
          if(!(await CQ.confirm(t('tkb.chunk.del.confirm'), {ok:t('kba.delete')}))) return;
          await fetch(`${K()}/chunks/${b.dataset.cdel}`, { method:'DELETE', headers: H() }); CQ.toast(t('toast.deleted'),'ok');
          const fresh = await fetch(`${K()}/documents/${id}/chunks`, { headers: H() }).then(r=>r.json()); render(fresh); loadDocuments();
        }));
      };
      render(chunks);
    }
    function editChunk(docId, chunkId, parentBg) {
      const cur = parentBg;
      const chDiv = parentBg.querySelector(`[data-cedit="${chunkId}"]`).closest('.fc-claim');
      const content = chDiv.querySelector('div:last-child').textContent;
      const bg = showModal(`<h3>${t('kba.chunk.edit')}</h3><textarea id="ce_content" style="min-height:140px">${esc(content)}</textarea>
        <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="primary" id="ce_save">${t('kba.save')}</button></div>`);
      bg.querySelector('[data-c]').addEventListener('click', ()=>bg.remove());
      bg.querySelector('#ce_save').addEventListener('click', async () => {
        const btn = $('ce_save'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
        const r = await fetch(`${K()}/chunks/${chunkId}`, { method:'PUT', headers: JH(), body: JSON.stringify({content:$('ce_content').value}) });
        if (r.ok) { CQ.toast(t('toast.saved'),'ok'); bg.remove(); parentBg.remove(); openChunks(docId); }
        else { btn.disabled=false; btn.textContent=t('kba.save'); }

    /* ---- RETRIEVAL CONFIDENCE (mirrors tenant.html — same product, same story) ----
       WHY: a BGE-M3 cosine score is NOT calibrated in absolute terms — only the ranking is
       meaningful. Unrelated same-language text still scores ~0.30–0.45, so a screen full of
       0.36–0.40 rows is the encoder saying "none of these match" while looking exactly like a
       set of matches. A real tenant searched for a word appearing nowhere in their KB and got
       every document back inside a 0.037-wide band; the operator answering that ticket was
       left eyeballing four numbers and guessing. `confidence`
       (services/retrieval.py::assess_confidence) names the case; this renders it.

       A BANNER, not a toast: it must persist while the passages it warns about are read. The
       passages stay visible — an operator may legitimately want the best-effort ranking, and
       hiding them would make a populated KB look empty. */
    function retrMethod(m) {
      return (m === 'vector' || m === 'keyword' || m === 'none') ? t('retr.m.' + m) : esc(m || '—');
    }
    function retrNum(v) { return v == null ? '—' : Number(v).toFixed(4); }
    function retrMetaHTML(d, n) {
      const c = (d && typeof d.confidence === 'object' && d.confidence) || null;
      const top = (d && d.top_score != null) ? d.top_score : (c ? c.top_score : null);
      const lvl = c && ['high', 'medium', 'low', 'none'].indexOf(c.level) >= 0 ? c.level : null;
      const pill = lvl === 'high' ? 'ready' : lvl === 'medium' ? 'processing' : 'notinkb';
      return `<div class="inline hint" style="gap:8px; flex-wrap:wrap; margin-bottom:8px">
        <span>${t('kba.pg.method')}: <b>${retrMethod(d && d.method)}</b></span>
        <span>· ${t('retr.top')} <b>${retrNum(top)}</b></span><span>· ${n}</span>
        ${lvl ? `<span class="pill ${pill}">${t('retr.level.' + lvl)}</span>` : ''}</div>`;
    }
    function retrFlagHTML(d, n) {
      const c = (d && typeof d.confidence === 'object' && d.confidence) || null;
      if (!c || c.confident !== false) return '';
      const known = ['empty_kb', 'unavailable', 'no_hits', 'keyword_fallback',
                     'flat_distribution', 'low_score'];
      const k = known.indexOf(c.reason) >= 0 ? 'retr.flag.' + c.reason : 'retr.flag.generic';
      const nums = [];
      if (c.top_score != null) nums.push(`${t('retr.top')} ${retrNum(c.top_score)}`);
      if (c.spread != null) nums.push(`${t('retr.spread')} ${retrNum(c.spread)}`);
      if (c.margin != null) nums.push(`${t('retr.margin')} ${retrNum(c.margin)}`);
      if (n) nums.push(t('retr.flag.shown'));
      /* Red for the two that are a fact about our machinery rather than about this tenant's
         KB — `keyword_fallback` (the encoder is unreachable, so every tenant on this box is
         quietly getting worse answers) and `unavailable` (the search did not run at all, so
         nothing on screen is a statement about the KB). Both are the operator's to act on
         TODAY. The rest say "this KB has a gap", which is amber, not red. */
      const hard = c.reason === 'keyword_fallback' || c.reason === 'unavailable';
      return `<div class="retr-flag${hard ? ' hard' : ''}">
        <b>${t(k)}</b>${t(k + '.b')}
        ${nums.length ? `<span class="retr-nums">${nums.join(' · ')}</span>` : ''}</div>`;
    }

    // ---- CURATION (KB Health) -----------------------------------------------------------
    // Same review queue as the tenant portal, but operator-side: scoped to the selected
    // tenant and able to kick a run. Cards are per-cluster; the verbatim customer quotes are
    // the point of the card and are never summarised away.
    const CUR = () => `${API}/admin/curation/${TID}/proposals`;
    const CH_ICON = { web:'🌐', instagram:'📸', messenger:'💬', whatsapp:'🟩', phone:'☎️', call:'☎️', email:'✉️' };
    const OP_PILL = { add:'ready', update:'processing', remove:'contradicted' };
    let curProposals = [], curSel = new Set();

    /* Character-level diff, trimmed to the changed middle so the LCS matrix stays small.
       A long middle falls back to word tokens — a 4000x4000 character matrix would hang the tab. */
    function diffParts(a, b) {
      a = a || ''; b = b || '';
      const min = Math.min(a.length, b.length);
      let s = 0; while (s < min && a[s] === b[s]) s++;
      let e = 0; while (e < min - s && a[a.length-1-e] === b[b.length-1-e]) e++;
      const head = a.slice(0, s), tail = e ? a.slice(a.length - e) : '';
      const am = a.slice(s, a.length - e), bm = b.slice(s, b.length - e);
      const byWord = am.length > 800 || bm.length > 800;
      const split = x => byWord ? (x.match(/\s+|\S+/g) || []) : x.split('');
      const A = split(am), B = split(bm), n = A.length, m = B.length;
      const dp = new Uint32Array((n+1)*(m+1));
      for (let i=n-1; i>=0; i--) for (let j=m-1; j>=0; j--)
        dp[i*(m+1)+j] = A[i]===B[j] ? dp[(i+1)*(m+1)+j+1]+1 : Math.max(dp[(i+1)*(m+1)+j], dp[i*(m+1)+j+1]);
      const parts = []; let i=0, j=0;
      while (i<n && j<m) {
        if (A[i]===B[j]) { parts.push(['=', A[i]]); i++; j++; }
        else if (dp[(i+1)*(m+1)+j] >= dp[i*(m+1)+j+1]) parts.push(['-', A[i++]]);
        else parts.push(['+', B[j++]]);
      }
      while (i<n) parts.push(['-', A[i++]]);
      while (j<m) parts.push(['+', B[j++]]);
      return { head, tail, parts };
    }
    function diffHTML(oldT, newT) {
      const d = diffParts(oldT, newT);
      let html = esc(d.head), run = '', op = '';
      const flush = () => { if (!run) return;
        html += op==='=' ? esc(run) : op==='-' ? `<del>${esc(run)}</del>` : `<ins>${esc(run)}</ins>`; run=''; };
      d.parts.forEach(p => { if (p[0] !== op) { flush(); op = p[0]; } run += p[1]; });
      flush();
      return html + esc(d.tail);
    }

    // Only ever follow http(s) links the API gave us; anything else renders as plain text.
    const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';
    function evidenceHTML(evs) {
      if (!Array.isArray(evs) || !evs.length) return `<div class="hint">${t('cur.evidence.none')}</div>`;
      return evs.slice(0, 3).map(ev => {
        const ch = (ev.channel || '').toLowerCase();
        const when = ev.occurred_at ? new Date(ev.occurred_at).toLocaleString() : '';
        const url = safeUrl(ev.url || (ev.metadata && ev.metadata.url));
        const ref = ev.conversation_id || ev.source_id || '';
        const foreign = ev.same_tenant === false ? ` <span class="warn-flag">${t('cur.foreign')}</span>` : '';
        return `<div class="cur-q">
          <div class="cur-src"><span>${CH_ICON[ch] || '💬'} ${esc(ev.channel || ev.source_kind || '')}${ev.locale?' · '+esc(ev.locale):''}${when?' · '+esc(when):''}${foreign}</span>
            <span>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${t('cur.opensource')} ↗</a>` : (ref ? `<code>${esc(String(ref).slice(0,8))}</code>` : '')}</span></div>
          <q>${esc(ev.question)}</q>
          ${ev.answer ? `<div class="cur-a">${esc(ev.answer)}</div>` : ''}
        </div>`;
      }).join('');
    }

    /* `target.content` is the CURRENT text, read server-side at view time — never a snapshot
       taken when the card was mined — so the reviewer approves a diff against what is really
       in the KB right now. If it is missing we show the proposal alone rather than a fake diff. */
    function curBodyHTML(p) {
      const proposed = p.proposed_content || '';
      if ((p.op || '') !== 'update') return esc(proposed);
      const cur = p.target && typeof p.target.content === 'string' ? p.target.content : null;
      return cur === null ? `<span class="hint">${t('cur.diff.nochunk')}</span>\n\n${esc(proposed)}`
                          : diffHTML(cur, proposed);
    }

    function curCard(p) {
      const op = (p.op || 'add').toLowerCase();
      const bulkable = op !== 'remove' && (p.state || 'pending') === 'pending';
      const decided = (p.state || 'pending') !== 'pending';
      const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
      return `<div class="card" data-pid="${esc(p.id)}">
        <div class="inline" style="gap:8px; flex-wrap:wrap">
          ${bulkable ? `<input type="checkbox" class="cur-sel" data-id="${esc(p.id)}" style="width:auto" />` : ''}
          <span class="pill ${OP_PILL[op] || 'notinkb'}">${t('cur.op.' + op)}</span>
          <b>${esc(p.title)}</b>
        </div>
        <div class="cur-meta" style="margin-top:8px">
          <span class="chip">${t('cur.asked').replace('{n}', p.occurrences ?? 0)}</span>
          <span>${t('cur.sources').replace('{n}', p.distinct_sources ?? 0)}</span>
          <span>· ${t('cur.priority')} ${p.priority != null ? Number(p.priority).toFixed(2) : '—'}</span>
          <span>· ${t('cur.confidence')} ${pct(p.confidence)}</span>
          ${p.risk ? `<span>· ${t('cur.risk')} ${esc(p.risk)}</span>` : ''}
          ${decided ? `<span class="pill ${p.state==='apply_failed'?'error':'notinkb'}">${t('cur.st.' + p.state)}</span>` : ''}
        </div>
        ${p.rationale ? `<p class="hint" style="margin:10px 0 0">${esc(p.rationale)}</p>` : ''}
        ${p.apply_error ? `<div class="msg err">${esc(p.apply_error)}</div>` : ''}
        <h4>${t('cur.evidence')}</h4>
        ${evidenceHTML(p.evidence)}
        <h4>${op === 'update' ? t('cur.diff') : t('cur.proposed')}</h4>
        ${p.target && p.target.title ? `<div class="hint">${t('cur.target')}: ${esc(p.target.title)}</div>` : ''}
        <div class="cur-diff">${curBodyHTML(p)}</div>
        ${(p.suggested_tags||[]).map(tg=>`<span class="chip">${esc(tg)}</span>`).join('')}
        ${op === 'remove' ? `<div class="hint" style="margin-top:8px">${t('cur.remove.note')}</div>` : ''}
        ${decided ? '' : `<div class="actions">
          <button class="ghost" data-cact="decline" data-id="${esc(p.id)}">${t('cur.decline')}</button>
          <button class="ghost" data-cact="edit" data-id="${esc(p.id)}">${t('cur.acceptedit')}</button>
          <button class="primary" data-cact="accept" data-id="${esc(p.id)}">${t('cur.accept')}</button>
        </div>`}
      </div>`;
    }

    $('reloadCur').addEventListener('click', loadCuration);
    $('curState').addEventListener('change', loadCuration);
    async function loadCuration() {
      const box = $('curList'); curSel.clear(); curSelBar();
      CQ.enhanceSelects($('panel-curation')); CQ.syncSelect($('curState'));
      box.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
      let d;
      try {
        const r = await fetch(`${CUR()}?state=${encodeURIComponent($('curState').value || 'pending')}`, { headers: H() });
        if (!r.ok) throw new Error(t('cur.loadfail'));
        d = await r.json();
      } catch (e) { box.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
      // An expired token / error body must never reach .map — a fixed QA bug.
      const listed = Array.isArray(d) ? d : (Array.isArray(d && d.items) ? d.items : []);
      if (!listed.length) { box.innerHTML = `<div class="empty">${t('cur.none')}</div>`; return; }
      // The list is deliberately light; body, quotes and the live target text come from the
      // per-proposal GET. The open queue is hard-capped at ~10 cards, so this stays cheap.
      curProposals = await Promise.all(listed.map(async p => {
        try { const rr = await fetch(`${CUR()}/${p.id}`, { headers: H() });
          if (rr.ok) { const full = await rr.json(); if (full && full.id) return full; } } catch {}
        return p;
      }));
      box.innerHTML = curProposals.map(curCard).join('');
      box.querySelectorAll('button[data-cact]').forEach(b => b.addEventListener('click', () => curAction(b.dataset.cact, b.dataset.id)));
      box.querySelectorAll('.cur-sel').forEach(cb => cb.addEventListener('change', () => {
        cb.checked ? curSel.add(cb.dataset.id) : curSel.delete(cb.dataset.id); curSelBar(); }));
    }
    function curSelBar() { $('curSelBar').classList.toggle('hidden', curSel.size === 0); $('curSelCount').textContent = curSel.size; }

    function declineModal() {
      const reasons = ['not_true','already_covered','dont_want','temporary'];
      const labels = { not_true:'cur.decline.r.nottrue', already_covered:'cur.decline.r.covered',
                       dont_want:'cur.decline.r.dontsay', temporary:'cur.decline.r.temporary' };
      return new Promise(resolve => {
        const bg = showModal(`<h3>${t('cur.decline.heading')}</h3>
          ${reasons.map(r => `<label class="cur-reason"><input type="radio" name="dr" value="${r}" style="width:auto" /> <span>${t(labels[r])}</span></label>`).join('')}
          <div class="msg err" id="dr_msg"></div>
          <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="danger" id="dr_ok">${t('cur.decline')}</button></div>`);
        const done = v => { bg.remove(); resolve(v); };
        bg.querySelector('[data-c]').addEventListener('click', () => done(null));
        bg.querySelector('#dr_ok').addEventListener('click', () => {
          const sel = bg.querySelector('input[name=dr]:checked');
          if (!sel) { bg.querySelector('#dr_msg').textContent = t('cur.decline.pick'); return; }
          done(sel.value);
        });
      });
    }
    // `remove` is never bulk and never a one-click action: it takes content out of every answer.
    function typedConfirm() {
      const word = t('cur.remove.word');
      return new Promise(resolve => {
        const bg = showModal(`<h3>${t('cur.remove.heading')}</h3>
          <p class="hint">${t('cur.remove.note')}</p>
          <label>${t('cur.remove.confirm').replace('{word}', esc(word))}</label>
          <input id="tc_input" autocomplete="off" />
          <div class="msg err" id="tc_msg"></div>
          <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="danger" id="tc_ok">${t('cur.op.remove')}</button></div>`);
        const done = v => { bg.remove(); resolve(v); };
        bg.querySelector('[data-c]').addEventListener('click', () => done(false));
        bg.querySelector('#tc_ok').addEventListener('click', () => {
          if (bg.querySelector('#tc_input').value.trim().toLowerCase() !== word.toLowerCase()) {
            bg.querySelector('#tc_msg').textContent = t('cur.remove.mismatch'); return; }
          done(true);
        });
        bg.querySelector('#tc_input').focus();
      });
    }
    function editModal(p) {
      return new Promise(resolve => {
        const bg = showModal(`<h3>${t('cur.edit.heading')}</h3>
          <p class="hint">${t('cur.edit.hint')}</p>
          <label>${t('cur.proposed')}</label>
          <textarea id="ce_body" style="min-height:220px">${esc(p.proposed_content || '')}</textarea>
          <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="primary" id="ce_ok">${t('cur.accept')}</button></div>`);
        const done = v => { bg.remove(); resolve(v); };
        bg.querySelector('[data-c]').addEventListener('click', () => done(null));
        bg.querySelector('#ce_ok').addEventListener('click', () => done(bg.querySelector('#ce_body').value));
      });
    }

    async function curAction(act, id) {
      const p = curProposals.find(x => x.id === id); if (!p) return;
      const op = (p.op || '').toLowerCase();
      try {
        if (act === 'decline') {
          const reason = await declineModal(); if (!reason) return;
          await curPost(`${CUR()}/${id}/decline`, { reason });
          CQ.toast(t('cur.declinedok'), 'ok'); return loadCuration();
        }
        // Accept-with-edits posts the edited body to the SAME endpoint — `content` present == edited.
        let content;
        if (act === 'edit') { content = await editModal(p); if (content == null) return; }
        if (op === 'remove' && !(await typedConfirm())) return;
        await curPost(`${CUR()}/${id}/accept`, content == null ? {} : { content });
        CQ.toast(t('cur.applied'), 'ok'); loadCuration();
      } catch (e) { CQ.toast(e.message || t('toast.error'), 'err'); }
    }
    async function curPost(url, body) {
      const r = await fetch(url, { method:'POST', headers: JH(), body: JSON.stringify(body) });
      return CQ.readResp(r);
    }
    $('curBulkAccept').addEventListener('click', async () => {
      const ids = [...curSel]; if (!ids.length) return;
      if (!(await CQ.confirm(t('cur.bulk.confirm').replace('{n}', () => ids.length), { ok: t('cur.accept'), danger: false }))) return;
      try { await curPost(`${CUR()}/bulk`, { action: 'accept', ids });
        CQ.toast(t('cur.applied'), 'ok'); loadCuration();
      } catch (e) { CQ.toast(e.message || t('toast.error'), 'err'); }
    });
    $('curRun').addEventListener('click', async () => {
      const btn = $('curRun'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await fetch(`${API}/admin/curation/run`, { method:'POST', headers: JH(), body: JSON.stringify({ client_id: TID }) });
        if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || t('toast.error'));
        CQ.toast(t('cur.run.started'), 'ok');
      } catch (e) { CQ.toast(e.message || t('toast.error'), 'err'); }
      finally { btn.disabled = false; btn.textContent = t('cur.run'); }
    });

    // ---- ACTIVITY ----
    $('reloadAct').addEventListener('click', loadActivity);
    async function loadActivity() {
      const box = $('actBox');
      let ev; try { const r = await adminFetch(`${K()}/activity`, { headers: H() }); ev = r.ok ? (await r.json()).events : null; } catch { return; }
      if (!Array.isArray(ev)) { box.innerHTML = `<div class="msg err">${t('toast.error')}</div>`; return; }
      if (!ev.length) { box.innerHTML = `<div class="empty">${t('kba.act.none')}</div>`; return; }
      box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${t('tkb.act.filter')}</th><th class="hide-md">${t('tkb.act.method')}</th><th>${t('th.status')}</th><th>${t('tkb.act.detail')}</th><th class="tight">${t('th.chunks')}</th><th class="tight hide-md">ms</th><th>${t('tkb.act.actor')}</th><th>${t('th.when')}</th></tr></thead><tbody>` +
        ev.map(e => `<tr><td><b>${esc(e.action)}</b></td><td class="hide-md">${esc(e.method||'—')}</td>
          <td><span class="pill ${e.status==='ready'||e.status==='ok'?'ready':e.status==='error'?'error':'processing'}">${esc(e.status||'—')}</span></td>
          <td>${esc(e.detail||'—')}</td><td class="tight">${e.chunk_count??'—'}</td><td class="tight hide-md">${e.duration_ms??'—'}</td>
          <td class="hint">${esc(e.actor||'—')}</td><td class="hint">${new Date(e.created_at).toLocaleString()}</td></tr>`).join('') + `</tbody></table></div>`;
    }

    // ---- SCORING ----
    let scDims = [];
    function scRow(d, i) {
      return `<div class="sc-edit" data-i="${i}">
        <div class="inline" style="justify-content:space-between; margin-bottom:8px">
          <span class="sc-edit-num">${i + 1}</span>
          <button class="act danger sc-del" data-i="${i}" title="${t('sc.remove')}" aria-label="${t('sc.remove')}">🗑</button>
        </div>
        <div class="row">
          <div style="flex:2"><label>${t('sc.dname')}</label><input class="sc-name" value="${esc(d.name||'')}" placeholder="${esc(t('sc.dname.ph'))}"/></div>
          <div class="w-num"><label>${t('sc.dweight')}</label><input class="sc-weight" type="number" min="0" step="1" value="${d.weight??0}"/></div>
        </div>
        <label>${t('sc.ddesc')}</label><input class="sc-desc" value="${esc(d.description||'')}"/>
        <label>${t('sc.dguide')}</label><textarea class="sc-guide" style="min-height:54px" placeholder="${esc(t('sc.dguide.ph'))}">${esc(d.guidance||'')}</textarea>
      </div>`;
    }
    function scReadDom() {
      const box = $('scDims');
      scDims = [...box.querySelectorAll('[data-i]')].filter(el=>el.classList.contains('sc-edit')).map(el => ({
        key: (scDims[+el.dataset.i]||{}).key,
        name: el.querySelector('.sc-name').value.trim(),
        weight: parseFloat(el.querySelector('.sc-weight').value)||0,
        description: el.querySelector('.sc-desc').value.trim(),
        guidance: el.querySelector('.sc-guide').value.trim(),
      }));
    }
    function scRenderDims() {
      const box = $('scDims');
      box.innerHTML = scDims.length ? scDims.map(scRow).join('') : `<div class="empty">${t('sc.nodims')}</div>`;
      box.querySelectorAll('.sc-del').forEach(b => b.addEventListener('click', () => { scReadDom(); scDims.splice(+b.dataset.i,1); scRenderDims(); }));
      box.querySelectorAll('.sc-weight').forEach(inp => inp.addEventListener('input', scSum));
      scSum();
    }
    function scSum() {
      let s = 0; $('scDims').querySelectorAll('.sc-weight').forEach(i => s += parseFloat(i.value)||0);
      s = Math.round(s*10)/10;
      const ok = Math.abs(s - 100) <= 0.5;
      $('scSum').textContent = s; $('scSum').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      $('scSumFlag').textContent = ok ? '✓' : '✗'; $('scSumFlag').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      return ok;
    }
    $('scAdd').addEventListener('click', () => { scReadDom(); scDims.push({name:'',weight:0,description:'',guidance:''}); scRenderDims(); });

    // Rubric import from file (AI draft) — mirrors the tenant editor.
    //
    // WHY XMLHttpRequest and not fetch: this single request has two long phases — the upload
    // and then minutes of model work — and the user has to see both. `xhr.upload.onprogress`
    // reports real uploaded bytes; `xhr.onprogress` exposes the response body as it grows, so
    // the server's SSE frames can be read while they arrive. fetch() cannot report upload
    // progress at all, and EventSource is GET-only so it cannot carry the file. One request,
    // both halves.
    let scImpXhr = null;

    // Every number on this bar has a real denominator behind it. `pct === null` means the
    // stage has none (extraction is one opaque pypdf/openpyxl call), so it draws the
    // indeterminate stripe and shows NO figure rather than a number we made up.
    function scProgStage(labelKey, pct) {
      const box = $('scProg'), bar = $('scProgBar'), fill = bar.firstElementChild;
      box.classList.remove('hidden');
      $('scProgLabel').textContent = t(labelKey);
      if (pct === null) {
        bar.classList.add('indet'); fill.style.width = '';
        bar.removeAttribute('aria-valuenow'); $('scProgPct').textContent = '';
      } else {
        const v = Math.max(0, Math.min(100, Math.round(pct)));
        bar.classList.remove('indet'); fill.style.width = v + '%';
        bar.setAttribute('aria-valuenow', String(v)); $('scProgPct').textContent = v + '%';
      }
    }

    // Pull whole `event: x\ndata: {...}\n\n` frames out of a buffer that grows between ticks,
    // keeping the partial tail for next time — a frame can arrive split across two progress
    // events, and consuming only what is complete is what stops an event being applied twice.
    function scSseFrames(st, text) {
      st.buf += text.replace(/\r\n/g, '\n');
      const out = []; let i;
      while ((i = st.buf.indexOf('\n\n')) >= 0) {
        const raw = st.buf.slice(0, i); st.buf = st.buf.slice(i + 2);
        let name = '', data = '';
        raw.split('\n').forEach(line => {
          if (!line || line[0] === ':') return;               // keep-alive comment, not an event
          if (line.indexOf('event:') === 0) name = line.slice(6).trim();
          else if (line.indexOf('data:') === 0) data += (data ? '\n' : '') + line.slice(5).trim();
        });
        if (!name) continue;
        let payload; try { payload = data ? JSON.parse(data) : {}; } catch { continue; }
        out.push([name, payload]);
      }
      return out;
    }

    function scImportRun(file) {
      const m = $('scMsg'); m.className = 'msg'; m.textContent = t('sc.import.loading');
      const btn = $('scImport'); btn.disabled = true;
      const st = { buf:'', seen:0, done:false, streaming:null, stage:'' };
      const xhr = new XMLHttpRequest(); scImpXhr = xhr;

      // One exit path for every ending: the bar goes away, the button comes back.
      const finish = () => {
        if (scImpXhr === xhr) scImpXhr = null;
        $('scProg').classList.add('hidden'); btn.disabled = false;
        // Wind the bar back while it is display:none, so the next import does not open
        // with a 300ms animation of the last one's percentage draining away.
        $('scProgBar').classList.remove('indet');
        $('scProgBar').firstElementChild.style.width = '0%';
      };
      const fail = msg => { st.done = true; finish();
        m.className = 'msg err'; m.textContent = msg || t('sc.import.fail');
        CQ.toast(t('sc.import.fail'), 'err'); };
      const ok = d => { st.done = true; finish();
        const dims = (d && Array.isArray(d.dimensions)) ? d.dimensions : [];
        scDims = dims.map(x => ({ name:(x||{}).name||'', weight:+(x||{}).weight||0,
          description:(x||{}).description||'', guidance:(x||{}).guidance||'' }));
        if (d && d.rubric) $('scRubric').value = d.rubric;
        scRenderDims();
        m.className = 'msg ok'; m.textContent = t('sc.import.loaded');
        CQ.toast(t('sc.import.loaded'), 'ok'); };

      xhr.upload.addEventListener('progress', e => {
        if (st.done || st.stage) return;                     // the server owns the bar from here
        scProgStage('sc.import.stage.upload', e.lengthComputable && e.total ? (e.loaded / e.total) * 100 : null);
      });
      xhr.upload.addEventListener('load', () => {
        if (!st.done && !st.stage) scProgStage('sc.import.stage.queued', null);
      });

      xhr.addEventListener('readystatechange', () => {
        if (xhr.readyState !== 2 || st.streaming !== null) return;
        // An older build has no `?stream=1`: FastAPI ignores the unknown query param and
        // answers with the ordinary JSON body. The Content-Type is the tell — decide once, on
        // the headers, and read the whole body at the end instead of showing a bar that would
        // never move. Auth/size failures (401/404/413) are JSON too and land here as well.
        st.streaming = (xhr.getResponseHeader('Content-Type') || '').toLowerCase().indexOf('text/event-stream') >= 0;
        if (!st.streaming) scProgStage('sc.import.stage.queued', null);
      });

      xhr.addEventListener('progress', () => {
        if (!st.streaming || st.done) return;
        const chunk = xhr.responseText.slice(st.seen); st.seen = xhr.responseText.length;
        if (!chunk) return;
        scSseFrames(st, chunk).forEach(ev => scApplySse(st, ev, ok, fail));
      });

      xhr.addEventListener('load', async () => {
        if (st.done) return;
        if (st.streaming === null)   // readyState 2 can be missed; the headers are still here
          st.streaming = (xhr.getResponseHeader('Content-Type') || '').toLowerCase().indexOf('text/event-stream') >= 0;
        if (st.streaming) {
          // Drain what landed after the last tick — a terminal frame can share a chunk with
          // EOF — then give up honestly rather than leaving a live bar on a dead stream.
          const tail = xhr.responseText.slice(st.seen); st.seen = xhr.responseText.length;
          scSseFrames(st, tail).forEach(ev => scApplySse(st, ev, ok, fail));
          if (!st.done) fail(t('sc.import.fail'));
          return;
        }
        if (!xhr.status) { fail(t('sc.import.netfail')); return; }
        try { ok(await CQ.readResp(new Response(xhr.responseText || '', { status: xhr.status }))); }
        catch (e) { fail(e.message); }
      });

      xhr.addEventListener('error', () => { if (!st.done) fail(t('sc.import.netfail')); });
      xhr.addEventListener('abort', () => {
        if (st.done) return;
        st.done = true; finish();
        m.className = 'msg'; m.textContent = t('sc.import.cancelled');
      });

      const fd = new FormData(); fd.append('file', file);
      xhr.open('POST', `${API}/admin/scoring/${TID}/import?stream=1`, true);
      const h = H(); Object.keys(h).forEach(k => xhr.setRequestHeader(k, h[k]));
      scProgStage('sc.import.stage.upload', 0);
      xhr.send(fd);                                          // no xhr.timeout: this runs for minutes
    }

    // `draft` and `error` are the terminal states — the percentage never is. A real Georgian
    // scorecard finishes near 80% because the token estimate is deliberately conservative and
    // the server clamps at 99, so the arriving draft is what says "done", not the number.
    function scApplySse(st, ev, ok, fail) {
      if (st.done) return;
      const name = ev[0], d = ev[1] || {};
      if (name === 'stage') {
        st.stage = d.stage || '';
        if (d.stage === 'analyzing') scProgStage('sc.import.stage.analyzing', 0);
        else scProgStage('sc.import.stage.extracting', null);
      } else if (name === 'progress') {
        st.stage = 'analyzing'; scProgStage('sc.import.stage.analyzing', +d.pct || 0);
      } else if (name === 'draft') ok(d);
      else if (name === 'error') fail(d.detail);
    }

    $('scImport').addEventListener('click', () => $('scImportFile').click());
    $('scImportFile').addEventListener('change', () => {
      const fInp = $('scImportFile'); const file = fInp.files[0];
      fInp.value = '';                                       // cleared up front: every exit path is covered
      if (!file) return;
      if (scImpXhr) scImpXhr.abort();                        // never two imports racing for one editor
      scImportRun(file);
    });
    // Leaving the page: drop the request so the server sees the disconnect on its next ping
    // and cancels the model call, instead of paying for a draft nobody will read.
    window.addEventListener('pagehide', () => { if (scImpXhr) scImpXhr.abort(); });
    // Rescale weights proportionally so they total exactly 100% (drift goes on the last one).
    $('scNormalize').addEventListener('click', () => {
      scReadDom(); const n = scDims.length; if (!n) return;
      const total = scDims.reduce((a,d)=>a+(d.weight||0),0);
      if (total <= 0) scDims.forEach(d => d.weight = Math.round(100/n));
      else scDims.forEach(d => d.weight = Math.round((d.weight/total)*100));
      scDims[n-1].weight += 100 - scDims.reduce((a,d)=>a+d.weight,0);
      scRenderDims();
    });
    async function loadScoring() {
      $('scMsg').textContent=''; $('scMsg').className='msg';
      const cfg = await fetch(`${API}/admin/scoring/${TID}/config`, { headers: H() }).then(r=>r.json());
      scDims = (cfg.dimensions||[]).map(d => ({ key:d.key, name:d.name||'', weight:d.weight||0, description:d.description||'', guidance:d.guidance||'' }));
      $('scRubric').value = cfg.rubric || '';
      $('scVersion').textContent = cfg.version ? `${t('sc.version')} ${cfg.version}` : t('sc.none');
      scRenderDims();
    }
    $('scSave').addEventListener('click', async () => {
      scReadDom();
      if (!scDims.length) { $('scMsg').className='msg err'; $('scMsg').textContent=t('sc.needone'); return; }
      if (scDims.some(d => !d.name)) { $('scMsg').className='msg err'; $('scMsg').textContent=t('sc.needname'); return; }
      const total = Math.round(scDims.reduce((a,d)=>a+(d.weight||0),0)*10)/10;
      if (Math.abs(total - 100) > 0.5) { $('scMsg').className='msg err'; $('scMsg').textContent = t('sc.mustbe100').replace('{total}', total); return; }
      const btn = $('scSave'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
      const r = await fetch(`${API}/admin/scoring/${TID}/config`, { method:'PUT', headers: JH(),
        body: JSON.stringify({ dimensions: scDims, rubric: $('scRubric').value }) });
      const d = await r.json(); btn.disabled=false; btn.textContent=t('sc.save');
      if (r.ok) { CQ.toast(t('sc.saved'),'ok'); scDims = (d.dimensions||[]).map(x=>({key:x.key,name:x.name,weight:x.weight,description:x.description,guidance:x.guidance}));
        $('scRubric').value=d.rubric||''; $('scVersion').textContent=`${t('sc.version')} ${d.version}`; scRenderDims(); }
      else { $('scMsg').className='msg err'; $('scMsg').textContent = d.detail || 'Save failed'; }
    });

    // boot
    (async () => {
      const r = await fetch(`${API}/admin/tenants`, { headers: H() });
      if (r.status === 401) { sessionStorage.removeItem('cq_admin_token'); location.replace('tenant.html?next=kb-admin.html'); return; }
      await loadTenants();
      paintVisLabels();
    })();
  </script>
</body>
</html>
