    // ---- KB HEALTH: curation review queue ----------------------------------------------
    // Cards are per-cluster, not per-message: a tenant sees ~6-10 of these, never a feed.
    // The verbatim quotes are the whole point — they are what make a card auditable rather
    // than "the machine says so", so they are never summarised away.
    const CUR = `${API}/v1/curation/proposals`;
    const CH_ICON = { web:'🌐', instagram:'📸', messenger:'💬', whatsapp:'🟩', phone:'☎️', call:'☎️', email:'✉️' };
    const OP_PILL = { add:'ready', update:'processing', remove:'contradicted' };
    let curProposals = [], curSel = new Set();

    function showModal(inner, max = '680px') {
      const bg = document.createElement('div'); bg.className = 'cq-modal-bg';
      bg.innerHTML = `<div class="cq-modal" style="max-width:${max}; max-height:86vh; overflow:auto">${inner}</div>`;
      bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
      $('modalHost').appendChild(bg); return bg;
    }

    /* Character-level diff, trimmed to the changed middle so the LCS matrix stays small.
       A long middle falls back to word tokens — a 4000x4000 character matrix would hang the tab. */
    function diffParts(a, b) {
      a = a || ''; b = b || '';
      const min = Math.min(a.length, b.length);
      let s = 0; while (s < min && a[s] === b[s]) s++;
      let e = 0; while (e < min - s && a[a.length-1-e] === b[b.length-1-e]) e++;
      const head = a.slice(0, s), tail = e ? a.slice(a.length - e) : '';
      const am = a.slice(s, a.length - e), bm = b.slice(s, b.length - e);
      const byWord = am.length > 800 || bm.length > 800;
      const split = x => byWord ? (x.match(/\s+|\S+/g) || []) : x.split('');
      const A = split(am), B = split(bm), n = A.length, m = B.length;
      const dp = new Uint32Array((n+1)*(m+1));
      for (let i=n-1; i>=0; i--) for (let j=m-1; j>=0; j--)
        dp[i*(m+1)+j] = A[i]===B[j] ? dp[(i+1)*(m+1)+j+1]+1 : Math.max(dp[(i+1)*(m+1)+j], dp[i*(m+1)+j+1]);
      const parts = []; let i=0, j=0;
      while (i<n && j<m) {
        if (A[i]===B[j]) { parts.push(['=', A[i]]); i++; j++; }
        else if (dp[(i+1)*(m+1)+j] >= dp[i*(m+1)+j+1]) parts.push(['-', A[i++]]);
        else parts.push(['+', B[j++]]);
      }
      while (i<n) parts.push(['-', A[i++]]);
      while (j<m) parts.push(['+', B[j++]]);
      return { head, tail, parts };
    }
    function diffHTML(oldT, newT) {
      const d = diffParts(oldT, newT);
      let html = esc(d.head), run = '', op = '';
      const flush = () => { if (!run) return;
        html += op==='=' ? esc(run) : op==='-' ? `<del>${esc(run)}</del>` : `<ins>${esc(run)}</ins>`; run=''; };
      d.parts.forEach(p => { if (p[0] !== op) { flush(); op = p[0]; } run += p[1]; });
      flush();
      return html + esc(d.tail);
    }

    // Only ever follow http(s) links the API gave us; anything else renders as plain text.
    const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';
    function evidenceHTML(evs) {
      if (!Array.isArray(evs) || !evs.length) return `<div class="hint">${t('cur.evidence.none')}</div>`;
      return evs.slice(0, 3).map(ev => {
        const ch = (ev.channel || '').toLowerCase();
        const when = ev.occurred_at ? new Date(ev.occurred_at).toLocaleString() : '';
        const url = safeUrl(ev.url || (ev.metadata && ev.metadata.url));
        const jobId = ev.source_kind === 'audio_job' && ev.source_id ? ev.source_id : '';
        const link = jobId ? `<a href="#" data-job="${esc(jobId)}">${t('cur.openjob')} ↗</a>`
          : url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${t('cur.opensource')} ↗</a>` : '';
        const foreign = ev.same_tenant === false ? ` <span class="warn-flag">${t('cur.foreign')}</span>` : '';
        return `<div class="cur-q">
          <div class="cur-src"><span>${CH_ICON[ch] || '💬'} ${esc(ev.channel || ev.source_kind || '')}${ev.locale?' · '+esc(ev.locale):''}${when?' · '+esc(when):''}${foreign}</span><span>${link}</span></div>
          <q>${esc(ev.question)}</q>
          ${ev.answer ? `<div class="cur-a">${esc(ev.answer)}</div>` : ''}
        </div>`;
      }).join('');
    }

    /* `target.content` is the CURRENT text, read server-side at view time — never a snapshot
       taken when the card was mined — so the reviewer approves a diff against what is really
       in the KB right now. If it is missing we show the proposal alone rather than a fake diff. */
    function curBodyHTML(p) {
      const proposed = p.proposed_content || '';
      if ((p.op || '') !== 'update') return esc(proposed);
      const cur = p.target && typeof p.target.content === 'string' ? p.target.content : null;
      return cur === null ? `<span class="hint">${t('cur.diff.nochunk')}</span>\n\n${esc(proposed)}`
                          : diffHTML(cur, proposed);
    }

    function curCard(p) {
      const op = (p.op || 'add').toLowerCase();
      const bulkable = op !== 'remove';
      const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
      return `<div class="card" data-pid="${esc(p.id)}">
        <div class="row" style="justify-content:space-between; align-items:flex-start; gap:10px">
          <div style="flex:1; min-width:220px">
            <div class="inline" style="gap:8px; flex-wrap:wrap">
              ${bulkable ? `<input type="checkbox" class="cur-sel" data-id="${esc(p.id)}" style="width:auto" />` : ''}
              <span class="pill ${OP_PILL[op] || 'notinkb'}">${t('cur.op.' + op) }</span>
              <b>${esc(p.title)}</b>
            </div>
            <div class="cur-meta" style="margin-top:8px">
              <span class="chip">${t('cur.asked').replace('{n}', p.occurrences ?? 0)}</span>
              <span>${t('cur.sources').replace('{n}', p.distinct_sources ?? 0)}</span>
              <span>· ${t('cur.priority')} ${p.priority != null ? Number(p.priority).toFixed(2) : '—'}</span>
              <span>· ${t('cur.confidence')} ${pct(p.confidence)}</span>
              ${p.risk ? `<span>· ${t('cur.risk')} ${esc(p.risk)}</span>` : ''}
              ${p.state && p.state !== 'pending' ? `<span class="pill ${p.state==='apply_failed'?'error':'notinkb'}">${t('cur.st.' + p.state)}</span>` : ''}
            </div>
          </div>
        </div>
        ${p.rationale ? `<p class="hint" style="margin:10px 0 0">${esc(p.rationale)}</p>` : ''}
        ${p.apply_error ? `<div class="msg err">${esc(p.apply_error)}</div>` : ''}
        <h4>${t('cur.evidence')}</h4>
        ${evidenceHTML(p.evidence)}
        <h4>${op === 'update' ? t('cur.diff') : t('cur.proposed')}</h4>
        ${p.target && p.target.title ? `<div class="hint">${t('cur.target')}: ${esc(p.target.title)}</div>` : ''}
        <div class="cur-diff">${curBodyHTML(p)}</div>
        ${(p.suggested_tags||[]).map(tg=>`<span class="chip">${esc(tg)}</span>`).join('')}
        ${op === 'remove' ? `<div class="hint" style="margin-top:8px">${t('cur.remove.note')}</div>` : ''}
        <div class="actions">
          <button class="ghost" data-cact="decline" data-id="${esc(p.id)}">${t('cur.decline')}</button>
          <button class="ghost" data-cact="edit" data-id="${esc(p.id)}">${t('cur.acceptedit')}</button>
          <button class="primary" data-cact="accept" data-id="${esc(p.id)}">${t('cur.accept')}</button>
        </div>
      </div>`;
    }

    $('reloadCur').addEventListener('click', loadCuration);
    async function loadCuration() {
      const box = $('curList'); curSel.clear(); curSelBar();
      box.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
      let d;
      try {
        const r = await fetch(`${CUR}?state=pending`, { headers: authH() });
        if (!r.ok) throw new Error(t('cur.loadfail'));
        d = await r.json();
      } catch (e) { box.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
      // An expired token / error body must never reach .map — a fixed QA bug.
      const listed = Array.isArray(d) ? d : (Array.isArray(d && d.items) ? d.items : []);
      if (!listed.length) { box.innerHTML = `<div class="empty">${t('cur.none')}</div>`; return; }
      // The list is deliberately light; body, quotes and the live target text come from the
      // per-proposal GET. The open queue is hard-capped at ~10 cards, so this stays cheap.
      curProposals = await Promise.all(listed.map(async p => {
        try { const rr = await fetch(`${CUR}/${p.id}`, { headers: authH() });
          if (rr.ok) { const full = await rr.json(); if (full && full.id) return full; } } catch {}
        return p;
      }));
      box.innerHTML = curProposals.map(curCard).join('');
      box.querySelectorAll('button[data-cact]').forEach(b => b.addEventListener('click', () => curAction(b.dataset.cact, b.dataset.id)));
      box.querySelectorAll('a[data-job]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openSourceJob(a.dataset.job); }));
      box.querySelectorAll('.cur-sel').forEach(cb => cb.addEventListener('change', () => {
        cb.checked ? curSel.add(cb.dataset.id) : curSel.delete(cb.dataset.id); curSelBar(); }));
    }
    function curSelBar() { $('curSelBar').classList.toggle('hidden', curSel.size === 0); $('curSelCount').textContent = curSel.size; }

    function openSourceJob(id) {
      const tb = document.querySelector('.tab[data-tab="history"]'); if (tb) tb.click();
      openJob(id);
    }

    function declineModal() {
      const reasons = ['not_true','already_covered','dont_want','temporary'];
      const labels = { not_true:'cur.decline.r.nottrue', already_covered:'cur.decline.r.covered',
                       dont_want:'cur.decline.r.dontsay', temporary:'cur.decline.r.temporary' };
      return new Promise(resolve => {
        const bg = showModal(`<h3>${t('cur.decline.heading')}</h3>
          ${reasons.map(r => `<label class="cur-reason"><input type="radio" name="dr" value="${r}" style="width:auto" /> <span>${t(labels[r])}</span></label>`).join('')}
          <div class="msg err" id="dr_msg"></div>
          <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="danger" id="dr_ok">${t('cur.decline')}</button></div>`, '460px');
        const done = v => { bg.remove(); resolve(v); };
        bg.querySelector('[data-c]').addEventListener('click', () => done(null));
        bg.querySelector('#dr_ok').addEventListener('click', () => {
          const sel = bg.querySelector('input[name=dr]:checked');
          if (!sel) { bg.querySelector('#dr_msg').textContent = t('cur.decline.pick'); return; }
          done(sel.value);
        });
      });
    }
    // `remove` is never bulk and never a one-click action: it takes content out of every answer.
    function typedConfirm() {
      const word = t('cur.remove.word');
      return new Promise(resolve => {
        const bg = showModal(`<h3>${t('cur.remove.heading')}</h3>
          <p class="hint">${t('cur.remove.note')}</p>
          <label>${t('cur.remove.confirm').replace('{word}', esc(word))}</label>
          <input id="tc_input" autocomplete="off" />
          <div class="msg err" id="tc_msg"></div>
          <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="danger" id="tc_ok">${t('cur.op.remove')}</button></div>`, '460px');
        const done = v => { bg.remove(); resolve(v); };
        bg.querySelector('[data-c]').addEventListener('click', () => done(false));
        bg.querySelector('#tc_ok').addEventListener('click', () => {
          if (bg.querySelector('#tc_input').value.trim().toLowerCase() !== word.toLowerCase()) {
            bg.querySelector('#tc_msg').textContent = t('cur.remove.mismatch'); return; }
          done(true);
        });
        bg.querySelector('#tc_input').focus();
      });
    }
    function editModal(p) {
      return new Promise(resolve => {
        const bg = showModal(`<h3>${t('cur.edit.heading')}</h3>
          <p class="hint">${t('cur.edit.hint')}</p>
          <label>${t('cur.proposed')}</label>
          <textarea id="ce_body" style="min-height:220px">${esc(p.proposed_content || '')}</textarea>
          <div class="actions"><button class="ghost" data-c>${t('btn.cancel')}</button><button class="primary" id="ce_ok">${t('cur.accept')}</button></div>`);
        const done = v => { bg.remove(); resolve(v); };
        bg.querySelector('[data-c]').addEventListener('click', () => done(null));
        bg.querySelector('#ce_ok').addEventListener('click', () => done(bg.querySelector('#ce_body').value));
      });
    }

    async function curAction(act, id) {
      const p = curProposals.find(x => x.id === id); if (!p) return;
      const op = (p.op || '').toLowerCase();
      try {
        if (act === 'decline') {
          const reason = await declineModal(); if (!reason) return;
          await curPost(`${CUR}/${id}/decline`, { reason });
          CQ.toast(t('cur.declinedok'), 'ok'); return loadCuration();
        }
        // Accept-with-edits posts the edited body to the SAME endpoint — `content` present == edited.
        let content;
        if (act === 'edit') { content = await editModal(p); if (content == null) return; }
        if (op === 'remove' && !(await typedConfirm())) return;
        await curPost(`${CUR}/${id}/accept`, content == null ? {} : { content });
        CQ.toast(t('cur.applied'), 'ok'); loadCuration();
      } catch (e) { CQ.toast(e.message || t('toast.error'), 'err'); }
    }
    async function curPost(url, body) {
      const r = await fetch(url, { method:'POST', headers: authH({'Content-Type':'application/json'}), body: JSON.stringify(body) });
      return CQ.readResp(r);
    }
    $('curBulkAccept').addEventListener('click', async () => {
      const ids = [...curSel]; if (!ids.length) return;
      if (!(await CQ.confirm(`${t('cur.bulk.accept')} — ${ids.length}?`, { ok: t('cur.accept'), danger: false }))) return;
      try { await curPost(`${CUR}/bulk`, { action: 'accept', ids });
        CQ.toast(t('cur.applied'), 'ok'); loadCuration();
      } catch (e) { CQ.toast(e.message || t('toast.error'), 'err'); }
    });

    // ---- BOT: the tenant's own autopilot configuration ---------------------------------
    // Reads/writes `chat_configs` through the tenant-scoped mirror of the superadmin route
    // (`/admin/chat/{tenant_id}/config`), exactly as `/scoring/config` mirrors its admin twin.
    // If that route is not deployed yet the tab says so rather than throwing: a tenant seeing
    // a dead tab must be told it is the server, not their browser.
    const BOTCFG = `${API}/chat/config`;
    const BOT_LANGS = ['en','ka','ru'];
    let botCfg = null;

    function botStatePill() {
      const el = $('botState');
      const killed = !!(botCfg && botCfg.killed);          // set by the superadmin kill switch
      const on = $('b_autopilot').checked;
      el.className = 'pill ' + (killed ? 'error' : on ? 'ready' : 'notinkb');
      el.textContent = killed ? t('bot.state.killed') : on ? t('bot.state.live') : t('bot.state.off');
      $('botKilled').classList.toggle('hidden', !killed);
    }

    function fillBot(cfg) {
      botCfg = cfg || {};
      const s = (botCfg.settings && typeof botCfg.settings === 'object') ? botCfg.settings : {};
      const g = (botCfg.greeting && typeof botCfg.greeting === 'object') ? botCfg.greeting : {};
      const rf = (botCfg.refusal_copy && typeof botCfg.refusal_copy === 'object') ? botCfg.refusal_copy : {};
      const limits = (s.limits && typeof s.limits === 'object') ? s.limits : {};
      const langs = Array.isArray(botCfg.languages) && botCfg.languages.length ? botCfg.languages : BOT_LANGS;
      $('b_autopilot').checked = !!botCfg.autopilot_enabled;
      $('b_persona').value = botCfg.persona || '';
      BOT_LANGS.forEach(l => { $('b_greet_'+l).value = g[l] || ''; $('b_ref_'+l).value = rf[l] || ''; });
      document.querySelectorAll('.b-lang').forEach(cb => { cb.checked = langs.includes(cb.dataset.lang); });
      const kw = s.escalation_keywords;
      $('b_escalation').value = Array.isArray(kw) ? kw.join(', ') : (typeof kw === 'string' ? kw : '');
      $('b_minscore').value = botCfg.min_score ?? 0.35;
      $('b_minhits').value  = botCfg.min_hits ?? 1;
      $('b_topk').value     = botCfg.top_k ?? 8;
      $('b_sugg').value     = botCfg.suggestion_count ?? 2;
      $('b_maxchars').value = s.max_reply_chars ?? 1200;
      $('b_cap_tenant').value  = limits.tenant_per_minute ?? '';
      $('b_cap_enduser').value = limits.enduser_per_hour ?? '';
      // Never `??`-default this to true: the safe value is false and a missing key means false.
      $('b_general').checked = s.allow_general_knowledge === true;
      $('b_handoff').checked = s.handoff_summary !== false;
      $('botVersion').textContent = botCfg.version ? `${t('bot.version')} ${botCfg.version}` : '';
      $('botNeedPublic').classList.add('hidden');
      botStatePill();
    }

    $('reloadBot').addEventListener('click', loadBot);
    async function loadBot() {
      const m = $('botLoadMsg'); m.classList.add('hidden'); m.textContent = '';
      let d = null;
      try {
        const r = await fetch(BOTCFG, { headers: authH() });
        if (r.status === 404 || r.status === 405) { throw new Error(t('bot.unavailable')); }
        if (!r.ok) throw new Error(t('bot.loadfail'));
        d = await r.json();
      } catch (e) {
        $('botForm').classList.add('hidden');
        m.classList.remove('hidden'); m.textContent = e.message || t('bot.loadfail'); return;
      }
      if (!d || typeof d !== 'object') { m.classList.remove('hidden'); m.textContent = t('bot.loadfail'); return; }
      $('botForm').classList.remove('hidden');
      fillBot(d);
    }

    $('b_autopilot').addEventListener('change', () => { $('botNeedPublic').classList.add('hidden'); botStatePill(); });

    // Turning general knowledge ON is a deliberate risk decision, so it costs a confirmation.
    // Turning it OFF never does — the safe direction is always one click.
    $('b_general').addEventListener('change', async () => {
      if (!$('b_general').checked) return;
      $('b_general').checked = false;
      if (await CQ.confirm(t('bot.general.confirm'), { ok: t('bot.general.on') })) $('b_general').checked = true;
    });

    function botNeedPublicHTML() {
      return `<b>${esc(t('bot.needpublic.title'))}</b><div style="margin-top:6px">${esc(t('bot.needpublic.body'))}</div>
        <div class="actions"><button class="ghost" id="botToKb">${esc(t('bot.needpublic.link'))}</button></div>`;
    }

    $('saveBot').addEventListener('click', async () => {
      const m = $('botMsg'); m.className = 'msg'; m.textContent = '';
      $('botNeedPublic').classList.add('hidden');
      const langs = [...document.querySelectorAll('.b-lang')].filter(cb => cb.checked).map(cb => cb.dataset.lang);
      if (!langs.length) { m.className = 'msg err'; m.textContent = t('bot.languages.pickone'); return; }
      const greeting = {}, refusal = {};
      BOT_LANGS.forEach(l => {
        const g = $('b_greet_'+l).value.trim(), rf = $('b_ref_'+l).value.trim();
        if (g) greeting[l] = g; if (rf) refusal[l] = rf;
      });
      // A public bot with no refusal copy in a language it answers in would improvise the most
      // frequently-read sentence in the product. Block it here rather than discover it live.
      if ($('b_autopilot').checked) {
        const missing = langs.find(l => !refusal[l]);
        if (missing) { m.className = 'msg err'; m.textContent = t('bot.refusal.missing').replace('{lang}', t('bot.lang.'+missing)); return; }
      }
      const num = (id, dflt) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : dflt; };
      const optInt = id => { const v = parseInt($(id).value, 10); return Number.isFinite(v) ? v : undefined; };
      const prev = (botCfg && typeof botCfg.settings === 'object' && botCfg.settings) ? botCfg.settings : {};
      const limits = {};
      if (optInt('b_cap_tenant') !== undefined) limits.tenant_per_minute = optInt('b_cap_tenant');
      if (optInt('b_cap_enduser') !== undefined) limits.enduser_per_hour = optInt('b_cap_enduser');
      const body = {
        persona: $('b_persona').value.trim() || null,
        greeting, refusal_copy: refusal, languages: langs,
        canned: Array.isArray(botCfg && botCfg.canned) ? botCfg.canned : [],
        autopilot_enabled: $('b_autopilot').checked,
        settings: { ...prev,                                   // unknown knobs survive a save
          min_score: num('b_minscore', 0.35), min_hits: num('b_minhits', 1),
          top_k: num('b_topk', 8), suggestion_count: num('b_sugg', 2),
          max_reply_chars: num('b_maxchars', 1200),
          escalation_keywords: $('b_escalation').value.split(',').map(s => s.trim()).filter(Boolean),
          allow_general_knowledge: $('b_general').checked,
          handoff_summary: $('b_handoff').checked,
          limits },
      };
      const b = $('saveBot'); b.disabled = true; b.innerHTML = '<span class="spinner"></span>';
      try {
        const r = await fetch(BOTCFG, { method:'PUT', headers: authH({'Content-Type':'application/json'}), body: JSON.stringify(body) });
        // 409 == "no published documents". Explain the reason and point at the fix; a toggle
        // that only fails is the difference between a broken product and one that teaches.
        if (r.status === 409) {
          $('b_autopilot').checked = false; botStatePill();
          const np = $('botNeedPublic'); np.innerHTML = botNeedPublicHTML(); np.classList.remove('hidden');
          $('botToKb').addEventListener('click', () => { const tb = document.querySelector('.tab[data-tab="kb"]'); if (tb) tb.click(); });
          return;
        }
        const d = await CQ.readResp(r);
        fillBot(d && typeof d === 'object' ? d : body);
        m.className = 'msg ok'; m.textContent = t('bot.saved'); CQ.toast(t('bot.saved'), 'ok');
      } catch (e) {
        m.className = 'msg err'; m.textContent = e.message || t('toast.error'); CQ.toast(e.message || t('toast.error'), 'err');
      } finally { b.disabled = false; b.textContent = t('bot.save'); }
    });

    // ---- Scoring rubric (self-serve config; view-only for members, editable by owners) ----
    let scDims = [], scLoaded = false, scVer = null;
    const scEditable = () => ROLE === 'owner';
    function scShowVersion(){ $('scVersion').textContent = scVer ? `${t('sc.version')} ${scVer}` : t('sc.none'); }
    function scRow(d, i) {
      const dis = scEditable() ? '' : ' disabled';
      return `<div class="fc-claim" data-i="${i}" style="border-left-color:var(--beam)">
        <div class="row">
          <div style="flex:2"><label>${t('sc.dname')}</label><input class="sc-name" value="${esc(d.name||'')}" placeholder="${esc(t('sc.dname.ph'))}"${dis}/></div>
          <div style="flex:0; min-width:110px"><label>${t('sc.dweight')}</label><input class="sc-weight" type="number" min="0" step="1" value="${d.weight??0}"${dis}/></div>
        </div>
        <label>${t('sc.ddesc')}</label><input class="sc-desc" value="${esc(d.description||'')}"${dis}/>
        <label>${t('sc.dguide')}</label><textarea class="sc-guide" style="min-height:54px" placeholder="${esc(t('sc.dguide.ph'))}"${dis}>${esc(d.guidance||'')}</textarea>
        ${scEditable() ? `<div class="actions"><button class="danger sc-del" data-i="${i}">${t('sc.remove')}</button></div>` : ''}
      </div>`;
    }
    function scReadDom() {
      scDims = [...$('scDims').querySelectorAll('[data-i]')].filter(el=>el.classList.contains('fc-claim')).map(el => ({
        key: (scDims[+el.dataset.i]||{}).key,
        name: el.querySelector('.sc-name').value.trim(),
        weight: parseFloat(el.querySelector('.sc-weight').value)||0,
        description: el.querySelector('.sc-desc').value.trim(),
        guidance: el.querySelector('.sc-guide').value.trim(),
      }));
    }
    function scRenderDims() {
      const box = $('scDims');
      box.innerHTML = scDims.length ? scDims.map(scRow).join('') : `<div class="empty">${t('sc.nodims')}</div>`;
      box.querySelectorAll('.sc-del').forEach(b => b.addEventListener('click', () => { scReadDom(); scDims.splice(+b.dataset.i,1); scRenderDims(); }));
      box.querySelectorAll('.sc-weight').forEach(inp => inp.addEventListener('input', scSum));
      scSum();
    }
    function scSum() {
      let s = 0; $('scDims').querySelectorAll('.sc-weight').forEach(i => s += parseFloat(i.value)||0);
      s = Math.round(s*10)/10;
      const ok = Math.abs(s - 100) <= 0.5;
      $('scSum').textContent = s; $('scSum').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      $('scSumFlag').textContent = ok ? '✓' : '✗'; $('scSumFlag').style.color = ok ? 'var(--ok)' : 'var(--coral)';
      return ok;
    }
    $('scAdd').addEventListener('click', () => { scReadDom(); scDims.push({name:'',weight:0,description:'',guidance:''}); scRenderDims(); });
    // Rescale weights proportionally so they total exactly 100% (drift goes on the last one).
    $('scNormalize').addEventListener('click', () => {
      scReadDom(); const n = scDims.length; if (!n) return;
      const total = scDims.reduce((a,d)=>a+(d.weight||0),0);
      if (total <= 0) scDims.forEach(d => d.weight = Math.round(100/n));
      else scDims.forEach(d => d.weight = Math.round((d.weight/total)*100));
      scDims[n-1].weight += 100 - scDims.reduce((a,d)=>a+d.weight,0);
      scRenderDims();
    });
    async function loadScoring() {
      $('scMsg').textContent=''; $('scMsg').className='msg';
      const ro = !scEditable();
      $('scReadonly').classList.toggle('hidden', !ro);
      ['scAdd','scNormalize','scSave'].forEach(id => $(id).classList.toggle('hidden', ro));
      $('scRubric').disabled = ro;
      try {
        const cfg = await CQ.readResp(await fetch(`${API}/scoring/config`, { headers: authH() }));
        scDims = (cfg.dimensions||[]).map(d => ({ key:d.key, name:d.name||'', weight:d.weight||0, description:d.description||'', guidance:d.guidance||'' }));
        $('scRubric').value = cfg.rubric || '';
        scVer = cfg.version || null; scLoaded = true; scShowVersion();
        scRenderDims();
      } catch(e){ $('scMsg').className='msg err'; $('scMsg').textContent = e.message; }
    }
    $('scSave').addEventListener('click', async () => {
      scReadDom();
      if (!scDims.length) { $('scMsg').className='msg err'; $('scMsg').textContent=t('sc.needone'); return; }
      if (scDims.some(d => !d.name)) { $('scMsg').className='msg err'; $('scMsg').textContent=t('sc.needname'); return; }
      const total = Math.round(scDims.reduce((a,d)=>a+(d.weight||0),0)*10)/10;
      if (Math.abs(total - 100) > 0.5) { $('scMsg').className='msg err'; $('scMsg').textContent = t('sc.mustbe100').replace('{total}', total); return; }
      const btn = $('scSave'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
      try {
        const d = await CQ.readResp(await fetch(`${API}/scoring/config`, { method:'PUT',
          headers: authH({'Content-Type':'application/json'}),
          body: JSON.stringify({ dimensions: scDims, rubric: $('scRubric').value }) }));
        CQ.toast(t('sc.saved'),'ok');
        scDims = (d.dimensions||[]).map(x=>({key:x.key,name:x.name,weight:x.weight,description:x.description,guidance:x.guidance}));
        $('scRubric').value = d.rubric||''; scVer = d.version||null; scShowVersion(); scRenderDims();
      } catch(e){ $('scMsg').className='msg err'; $('scMsg').textContent = e.message; }
      finally { btn.disabled=false; btn.textContent=t('sc.save'); }
    });

    // history
    $('reloadJobs').addEventListener('click', loadJobs);
    async function loadJobs() {
      const r = await fetch(`${API}/jobs`, { headers: authH() }); if (!r.ok) return; const jobs = await r.json();
      const box = $('jobList');
      box.innerHTML = jobs.length ? `<div class="table-wrap"><table><thead><tr><th>${t('th.file')}</th><th>${t('th.status')}</th><th>${t('th.lang')}</th><th>${t('th.when')}</th></tr></thead><tbody>` +
        jobs.map(j=>`<tr style="cursor:pointer" data-id="${j.id}"><td>${esc(j.filename||'—')}</td><td><span class="pill ${j.status==='done'?'ready':j.status==='error'?'error':'processing'}">${esc(j.status)}</span></td><td>${esc(j.language||'—')}</td><td class="hint">${new Date(j.created_at).toLocaleString()}</td></tr>`).join('') + `</tbody></table></div>`
        : `<div class="empty">${t('hist.none')}</div>`;
      box.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => openJob(tr.dataset.id)));
    }
    async function openJob(id) {
      const r = await fetch(`${API}/jobs/${id}`, { headers: authH() }); const d = await r.json();
      if (r.ok) $('jobDetail').innerHTML = renderAnalysis(d);
    }

    if (TOKEN) {
      fetch(`${API}/auth/me`, { headers: authH() }).then(r => r.ok ? r.json() : Promise.reject())
        .then(me => { if (me.kind==='tenant') enter(me.client, me.role); else throw 0; })
        .catch(() => { sessionStorage.removeItem('cq_tenant_token'); TOKEN=''; });
    }
  </script>
</body>
</html>
