# HTTPS (443) is enabled at container start ONLY if TLS certs are present in
# /etc/nginx/certs — see deploy/enable-tls.sh + deploy/tls-ssl.conf. That keeps the
# stack working locally / on a fresh clone (HTTP only) while the server serves HTTPS.
include /etc/nginx/tls-enabled/*.conf;

# Call recordings can be up to 100 MB (the API's own limit), and a synchronous /analyze
# runs the full STT + LLM pipeline (can take a few minutes). Without these, nginx rejects
# the upload with a 413 or times the request out with a 504 — both HTML pages the browser
# can't parse as JSON ("Unexpected token '<'"). Set at http level so every server block
# (HTTP + HTTPS) inherits them.
client_max_body_size 200m;
proxy_read_timeout 600s;   # AI rubric import / restructure can stream for minutes
proxy_send_timeout 300s;

# Upgrade/Connection pair for the chat transport (SSE now, WebSocket later).
# DECLARED EXACTLY ONCE, HERE. Line 4 above includes tls-ssl.conf into the SAME http
# context, so declaring this map in both files is a fatal duplicate-variable error and
# nginx refuses to start — and nothing in the deploy pipeline rolls back. Never copy it
# into tls-ssl.conf; that file only *uses* $connection_upgrade.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---- HTTP: production domain -> force HTTPS ----
# Only matches requests whose Host is ai.communiq.ge (i.e. real public traffic), so local
# dev (localhost) and the fallback below are unaffected. The ACME renewal challenge is still
# served over HTTP here so certbot can renew.
server {
    listen 80;
    server_name ai.communiq.ge;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://ai.communiq.ge$request_uri;
    }
}

# ---- HTTP: everything else (localhost, the IP, fresh clone with no cert) -> serve over HTTP ----
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chat transport (SSE token streams; WebSocket later). MUST come before /api/ —
    # longest-prefix wins, so this block is what actually serves /api/v1/chat/*.
    location ^~ /api/v1/chat/ {
        # The URI is restated deliberately: this location strips its own prefix, so
        # reusing `http://api:8000/` (as /api/ does) would forward /v1/chat/... as
        # /... and silently 404.
        proxy_pass http://api:8000/v1/chat/;
        proxy_http_version 1.1;
        # Ships now so the later WebSocket is pure application code — no deploy needed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Buffering/gzip would hold tokens back until a buffer fills — the whole point
        # of the stream is that the first token lands early.
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_read_timeout 3600s;
        # The SSE URL carries a single-use stream ticket; keep it out of the access log.
        access_log off;
    }

    # App-shell files (html/css/js) are tiny and change on deploy: force revalidation so a
    # deploy reaches returning browsers immediately (unchanged files still 304 via ETag).
    # Without this, browsers heuristically cache brand.css/brand.js for days and can pair a
    # fresh page with a stale script/stylesheet. Both /api/ blocks above use ^~ so no API
    # path (incl. a tenant-supplied chat ref ending in .js) can ever fall through to here.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API reverse proxy: external /api/calls -> internal api:8000/calls
    # (^~ so the static-asset regex above can never intercept an /api/ path)
    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Push-to-deploy webhook -> host-side receiver (HMAC-validated there).
    location = /gh-webhook {
        proxy_pass http://host.docker.internal:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }
}
