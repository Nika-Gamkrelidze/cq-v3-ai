# HTTPS server block. Mounted read-only at /etc/nginx/tls-available/ssl.conf and copied
# into /etc/nginx/tls-enabled/ at container start ONLY when certs exist (deploy/enable-tls.sh),
# so environments without certs (local dev, fresh clone) still start on HTTP.
# Client-address headers (X-Real-IP / X-Forwarded-For): the rules and the reasoning live in
# the "Client address" note in nginx.conf. They matter MORE here — production serves 443, so
# this is the block real visitors are metered through.
server {
    listen 443 ssl;
    http2 on;
    server_name ai.communiq.ge;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Same as the HTTP block: $uri.html serves an exported page at a clean URL.
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ---- Retired legacy URLs -> the routes that replaced them ------------------
    # MIRRORED FROM deploy/nginx.conf, where the reasoning is written out in full (exact-match
    # precedence over the regex block below, and why `$is_args$args` is load-bearing). This is
    # the copy that actually serves production — real visitors arrive on 443 — so the two must
    # be changed together; a redirect that exists only in nginx.conf is not deployed.
    location = /tenant.html       { return 301 /workspace$is_args$args; }
    location = /admin.html        { return 301 /console$is_args$args; }
    location = /kb-admin.html     { return 301 /workspace$is_args$args; }
    location = /copilot-demo.html { return 301 /copilot$is_args$args; }

    # Chat transport (SSE token streams; WebSocket later). MUST come before /api/ —
    # longest-prefix wins, so this block is what actually serves /api/v1/chat/*.
    # $connection_upgrade is declared ONCE in nginx.conf (which includes this file into
    # the same http context) — do NOT add the `map` here, nginx would refuse to start.
    location ^~ /api/v1/chat/ {
        # The URI is restated deliberately: this location strips its own prefix, so
        # reusing `http://api:8000/` (as /api/ does) would forward /v1/chat/... as
        # /... and silently 404.
        proxy_pass http://api:8000/v1/chat/;
        proxy_http_version 1.1;
        # Ships now so the later WebSocket is pure application code — no deploy needed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REPLACE, never append: see the "Client address" note in nginx.conf.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Buffering/gzip would hold tokens back until a buffer fills — the whole point
        # of the stream is that the first token lands early.
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_read_timeout 3600s;
        # The SSE URL carries a single-use stream ticket; keep it out of the access log.
        access_log off;
    }

    # App-shell files (html/css/js) are tiny and change on deploy: force revalidation so a
    # deploy reaches returning browsers immediately (unchanged files still 304 via ETag).
    # It is the exported .html that needs this: Next fingerprints everything under
    # /_next/static/, but the page shells keep stable names and reference the new hashes, so
    # without this a browser can serve a cached shell pointing at chunks the deploy removed —
    # a blank page, not a stale one. Both /api/ blocks use ^~ so no API path (incl. a
    # tenant-supplied chat ref ending in .js) can ever fall through to here.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REPLACE, never append: see the "Client address" note in nginx.conf.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /gh-webhook {
        proxy_pass http://host.docker.internal:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }
}
