# HTTPS server block. Mounted read-only at /etc/nginx/tls-available/ssl.conf and copied
# into /etc/nginx/tls-enabled/ at container start ONLY when certs exist (deploy/enable-tls.sh),
# so environments without certs (local dev, fresh clone) still start on HTTP.
server {
    listen 443 ssl;
    http2 on;
    server_name ai.communiq.ge;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chat transport (SSE token streams; WebSocket later). MUST come before /api/ —
    # longest-prefix wins, so this block is what actually serves /api/v1/chat/*.
    # $connection_upgrade is declared ONCE in nginx.conf (which includes this file into
    # the same http context) — do NOT add the `map` here, nginx would refuse to start.
    location /api/v1/chat/ {
        # The URI is restated deliberately: this location strips its own prefix, so
        # reusing `http://api:8000/` (as /api/ does) would forward /v1/chat/... as
        # /... and silently 404.
        proxy_pass http://api:8000/v1/chat/;
        proxy_http_version 1.1;
        # Ships now so the later WebSocket is pure application code — no deploy needed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Buffering/gzip would hold tokens back until a buffer fills — the whole point
        # of the stream is that the first token lands early.
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        gzip off;
        proxy_read_timeout 3600s;
        # The SSE URL carries a single-use stream ticket; keep it out of the access log.
        access_log off;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /gh-webhook {
        proxy_pass http://host.docker.internal:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
    }
}
